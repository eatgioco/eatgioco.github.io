<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#FFEDDA">
<meta name="apple-mobile-web-app-title" content="GIOCO Contas">
<meta name="viewport" content="width=1200">
<title>GIOCO · Contabilidade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gioco-shell.css">

<style>
  .page-subtitle{
    margin:-14px 0 0;
    font-size:12px;
    font-weight:600;
    color:var(--red);
    letter-spacing:.18em;
    text-transform:uppercase;
  }
  .placeholder-card{ margin-top:28px; }
  .placeholder-card > *{ position:relative; z-index:1; }
  .placeholder-card p{ margin:0; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<script src="gioco-shell.js"></script>

<div class="shell">

  <div class="sidebar glass collapsed" id="sidebarEl">
    <div class="glass-bend"></div>
    <div class="brand">
      <div class="mark-collapsed"><svg class="icon" width="18" height="18"><use href="#i-menu"/></svg></div>
      <img src="Logo_Tomato_5x.png" alt="GIOCO" class="mark-logo">
      <div class="word">GIOCO OS<span>painel interno</span></div>
    </div>
    <nav id="giocoNav"></nav>
    <script>giocoNav('contabilidade.html');</script>
    <div class="sidebar-foot">
      <div class="foot-user"><div style="width:26px;height:26px;border-radius:50%;background:var(--mustard);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#141414;flex-shrink:0">G</div> <span>GIOCO</span><div class="dot"></div></div>
    </div>
  </div>

  <div class="main">
    <div class="page">

      <div class="greet-row">
        <button class="sidebar-pin-btn glass-light" id="sidebarPinBtn" onclick="toggleSidebarPin()">
          <svg class="icon" width="16" height="16"><use href="#i-panel-left"/></svg>
        </button>
        <h1>Contabili<b>dade</b></h1>
        <div class="spacer"></div>
        <div class="toggle-track is-light" id="toggleTrack" onclick="toggleThemeSwitch()">
          <div class="toggle-knob" id="toggleKnob"><svg class="icon" width="14" height="14" id="knobIcon"><use href="#i-sun"/></svg></div>
          <div class="toggle-ghost" id="toggleGhost"><svg class="icon" width="13" height="13" id="ghostIcon"><use href="#i-moon"/></svg></div>
        </div>
      </div>
      <p class="page-subtitle">Documentos e Finanças</p>

      <div class="card glass-light placeholder-card">
        <p>Em construção — a caminho.</p>
      </div>

    </div>
  </div>
</div>

</body>
</html>
