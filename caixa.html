<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>GIOCO · Caixa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
    --green:#1E7A46;
    --amber:#B8860B;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .home-link{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--white);
    text-decoration:none;
    border:2px solid var(--white);
    padding:6px 10px;
    white-space:nowrap;
  }

  .home-link:hover{
    background:var(--white);
    color:var(--red);
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:40px 24px 80px;
  }

  .page-title{
    margin:0;
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .page-subtitle{
    margin:8px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
  }

  /* ---------- Layout ---------- */
  .work-grid{
    display:grid;
    grid-template-columns:360px minmax(0,1fr);
    gap:24px;
    align-items:start;
    margin-top:24px;
  }

  /* ---------- Summary ---------- */
  .summary-row{
    display:flex;
    gap:14px;
    margin-top:28px;
  }

  .summary-card{
    flex:0 0 260px;
    background:var(--white);
    border:2px solid var(--black);
    padding:18px;
  }

  .summary-card.pending-active{
    border-color:var(--amber);
  }

  .summary-label{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }

  .summary-value{
    font-family:'Space Mono', monospace;
    font-size:22px;
    font-weight:700;
    margin:0;
    line-height:1.1;
  }

  .summary-value.positive{ color:var(--green); }
  .summary-value.negative{ color:var(--red); }

  .summary-sub{
    font-size:11px;
    color:var(--muted);
    margin:4px 0 0;
  }

  /* ---------- Form ---------- */
  .form-card{
    background:var(--white);
    border:2px solid var(--black);
    padding:20px;
  }

  .form-title{
    margin:0 0 12px;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .tipo-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:12px;
  }

  .tipo-btn{
    font-family:'Space Mono', monospace;
    font-size:14px;
    font-weight:700;
    padding:11px 8px;
    border:2px solid var(--black);
    background:var(--white);
    color:var(--black);
    cursor:pointer;
  }

  .tipo-btn:hover{
    background:var(--bg);
  }

  .tipo-btn.saida.active{
    background:var(--red);
    border-color:var(--red);
    color:var(--white);
  }

  .tipo-btn.entrada.active{
    background:var(--green);
    border-color:var(--green);
    color:var(--white);
  }

  .field{
    margin-bottom:12px;
  }

  .field-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field select{
    width:100%;
    padding:10px 12px;
    border:2px solid var(--line);
    background:var(--bg);
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--black);
  }

  .field input[type="number"]{
    font-family:'Space Mono', monospace;
    font-size:18px;
    font-weight:700;
  }

  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--black);
  }

  .btn-registar{
    width:100%;
    padding:12px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    background:var(--black);
    color:var(--white);
    border:2px solid var(--black);
    cursor:pointer;
  }

  .btn-registar:not(:disabled):hover{
    background:var(--red);
    border-color:var(--red);
  }

  .btn-registar:disabled{
    background:var(--line);
    border-color:var(--line);
    color:var(--muted);
    cursor:not-allowed;
  }

  .btn-registar:not(:disabled):active{
    transform:translateY(1px);
  }

  /* ---------- Filter tabs ---------- */
  .filter-tabs{
    display:flex;
    gap:8px;
  }

  .filter-tab{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:9px 18px;
    border:2px solid var(--black);
    background:var(--white);
    color:var(--black);
    cursor:pointer;
  }

  .filter-tab.active{
    background:var(--black);
    color:var(--white);
  }

  .filter-extra{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }

  .filter-extra input[type="month"],
  .filter-extra select{
    padding:9px 12px;
    border:2px solid var(--line);
    background:var(--bg);
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--black);
  }

  .filter-summary{
    margin-top:10px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--muted);
  }

  /* ---------- List ---------- */
  .list{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .mov-row{
    background:var(--white);
    border:2px solid var(--line);
    padding:14px 18px;
  }

  .mov-row.aberto{
    border-color:var(--amber);
  }

  .mov-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .mov-tipo-hora{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--muted);
  }

  .mov-tipo-tag{
    font-weight:700;
    font-size:11px;
  }

  .mov-tipo-tag.saida{ color:var(--red); }
  .mov-tipo-tag.entrada{ color:var(--green); }

  .mov-valor{
    font-family:'Space Mono', monospace;
    font-size:18px;
    font-weight:700;
    white-space:nowrap;
  }

  .mov-valor.saida{ color:var(--red); }
  .mov-valor.entrada{ color:var(--green); }

  .mov-motivo{
    margin:8px 0 4px;
    font-size:14px;
  }

  .mov-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:8px;
  }

  .mov-pessoa{
    font-size:12px;
    color:var(--muted);
  }

  .badge-pending{
    font-family:'Space Mono', monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--amber);
    color:var(--white);
    padding:3px 8px;
    white-space:nowrap;
  }

  .btn-acertar{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:8px 16px;
    border:2px solid var(--amber);
    background:var(--white);
    color:var(--amber);
    cursor:pointer;
    margin-top:10px;
  }

  .btn-acertar:hover{
    background:var(--amber);
    color:var(--white);
  }

  .acertar-form{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }

  .acertar-row{
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    gap:12px;
    margin-bottom:10px;
  }

  .acertar-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }

  .btn-guardar{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:9px 20px;
    border:2px solid var(--black);
    background:var(--black);
    color:var(--white);
    cursor:pointer;
  }

  .btn-cancelar{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:9px 20px;
    border:2px solid var(--line);
    background:var(--white);
    color:var(--muted);
    cursor:pointer;
  }

  .gasto-real{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
  }

  .gasto-real strong{
    color:var(--black);
  }

  .notas-txt{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
    font-style:italic;
  }

  .empty-state{
    text-align:center;
    padding:32px 16px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="home-link">🏠 Home</a>
    <span class="brand-mark"><span style="color:var(--black);">●</span> GIOCO®</span>
  </div>
</header>

<main>
  <h1 class="page-title">GIOCO · Caixa</h1>
  <p class="page-subtitle">Movimentos de dinheiro</p>

  <div class="summary-row">
    <div class="summary-card">
      <p class="summary-label">Saldo hoje</p>
      <p class="summary-value" id="saldoHojeValue">0,00 €</p>
    </div>
    <div class="summary-card" id="pendingCard">
      <p class="summary-label">Por acertar</p>
      <p class="summary-value" id="pendingCount">0</p>
      <p class="summary-sub" id="pendingTotal">0,00 €</p>
    </div>
  </div>

  <div class="work-grid">
  <div class="form-card">
    <p class="form-title">Registar movimento</p>
    <form id="movForm">
      <div class="tipo-toggle">
        <button type="button" class="tipo-btn saida" id="tipoSaidaBtn">− Saída</button>
        <button type="button" class="tipo-btn entrada" id="tipoEntradaBtn">+ Entrada</button>
      </div>

      <div class="field">
        <label class="field-label" for="valorInput">Valor (€)</label>
        <input type="number" id="valorInput" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      </div>

      <div class="field">
        <label class="field-label" for="motivoSelect">Motivo</label>
        <select id="motivoSelect" disabled>
          <option value="">Escolhe primeiro Saída ou Entrada</option>
        </select>
      </div>

      <div class="field" id="motivoDetalheField" style="display:none;">
        <label class="field-label" id="motivoDetalheLabel" for="motivoDetalheInput">Detalhe</label>
        <input type="text" id="motivoDetalheInput" placeholder="">
      </div>

      <div class="field">
        <label class="field-label" for="pessoaSelect">Pessoa</label>
        <select id="pessoaSelect" disabled>
          <option>A carregar...</option>
        </select>
      </div>

      <button type="submit" class="btn-registar" id="registarBtn" disabled>Registar</button>
    </form>
  </div>

  <div class="list-col">
    <div class="filter-tabs">
      <button type="button" class="filter-tab active" data-filter="hoje">Hoje</button>
      <button type="button" class="filter-tab" data-filter="7dias">Últimos 7 dias</button>
      <button type="button" class="filter-tab" data-filter="mes">Mês</button>
      <button type="button" class="filter-tab" data-filter="tudo">Tudo</button>
    </div>

    <div class="filter-extra">
      <input type="month" id="mesFiltroInput" style="display:none;">
      <select id="motivoFiltroSelect">
        <option value="">Todos os motivos</option>
        <option value="Compra">Compra</option>
        <option value="Pagamento a fornecedor">Pagamento a fornecedor</option>
        <option value="Depósito bancário">Depósito bancário</option>
        <option value="Troco de compra/saída">Troco de compra/saída</option>
        <option value="Reforço de caixa">Reforço de caixa</option>
        <option value="Outro">Outro</option>
      </select>
    </div>

    <div class="filter-summary" id="filterSummary"></div>

    <div class="list" id="movList">
      <div class="empty-state">A carregar movimentos…</div>
    </div>
  </div>
  </div>
</main>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDxjZXA3wp4sgxMxmiuOQDomx9GJgt3puE",
    authDomain: "gioco-fornecedores.firebaseapp.com",
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gioco-fornecedores",
    storageBucket: "gioco-fornecedores.firebasestorage.app",
    messagingSenderId: "441783294427",
    appId: "1:441783294427:web:51a362d4f91d0e2149effe"
  };
  firebase.initializeApp(firebaseConfig);

  // NÃO ALTERAR: autenticação anónima obrigatória antes de qualquer
  // leitura/escrita no Firebase. Ver decisão de segurança de Ago/2026.
  function autenticarEContinuar(callback) {
    firebase.auth().signInAnonymously()
      .then(() => callback())
      .catch((erro) => {
        console.error('Falha na autenticação anónima:', erro);
        // Não continuar sem sessão — evita escritas/leituras que vão
        // falhar de qualquer forma quando as rules apertarem.
      });
  }

  autenticarEContinuar(function () {
  var db = firebase.database();
  var movRef = db.ref('caixaMovimentos');
  var pessoasRef = db.ref('pessoas');

  var pessoasAtivas = [];
  var pessoasCarregadas = false;

  function carregarPessoas(onUpdate){
    pessoasRef.on('value', function(snapshot){
      var val = snapshot.val() || {};
      pessoasAtivas = Object.keys(val)
        .map(function(id){ return Object.assign({ id: id }, val[id]); })
        .filter(function(p){ return p.ativo !== false; })
        .sort(function(a, b){ return (a.nome || '').localeCompare(b.nome || ''); });
      pessoasCarregadas = true;
      onUpdate();
    });
  }

  function popularSelectPessoas(selectEl){
    if (!pessoasCarregadas){
      selectEl.disabled = true;
      selectEl.innerHTML = '<option>A carregar...</option>';
      return;
    }
    selectEl.disabled = false;
    var html = '';
    pessoasAtivas.forEach(function(p){
      html += '<option value="' + p.id + '">' + escapeHtml(p.nome) + '</option>';
    });
    html += '<option value="outro">Outro</option>';
    selectEl.innerHTML = html;
  }

  function resolvePessoaSelecao(selectEl){
    var val = selectEl.value;
    var found = pessoasAtivas.filter(function(p){ return p.id === val; })[0];
    return {
      pessoaId: found ? found.id : null,
      pessoaNome: found ? found.nome : 'Outro'
    };
  }

  var MOTIVO_OPTIONS = {
    saida: [
      { value: 'compra', label: 'Compra', detailLabel: 'O quê?', detailPlaceholder: 'ex: rúcula Pingo Doce' },
      { value: 'pagamento', label: 'Pagamento a fornecedor', detailLabel: 'A quem?', detailPlaceholder: 'ex: fornecedor café' },
      { value: 'deposito', label: 'Depósito bancário', semAcerto: true },
      { value: 'outro', label: 'Outro', detailLabel: 'Detalhe', detailPlaceholder: 'descreve o motivo' }
    ],
    entrada: [
      { value: 'troco', label: 'Troco de compra/saída', detailLabel: 'De quê?', detailPlaceholder: 'ex: troco da rúcula Pingo Doce' },
      { value: 'reforco', label: 'Reforço de caixa', detailLabel: 'De onde?', detailPlaceholder: 'ex: levantamento ATM' },
      { value: 'outro', label: 'Outro', detailLabel: 'Detalhe', detailPlaceholder: 'descreve o motivo' }
    ]
  };

  var allMovs = {};
  var activeFilter = 'hoje';
  var mesFiltroInput = document.getElementById('mesFiltroInput');
  var motivoFiltroSelect = document.getElementById('motivoFiltroSelect');
  var filterSummaryEl = document.getElementById('filterSummary');
  // valor default do mês = mês atual, formato YYYY-MM
  (function(){
    var d = new Date();
    var ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    mesFiltroInput.value = ym;
  })();
  var acertarOpenId = null;
  var formState = { tipo: null };

  var tipoSaidaBtn = document.getElementById('tipoSaidaBtn');
  var tipoEntradaBtn = document.getElementById('tipoEntradaBtn');
  var valorInput = document.getElementById('valorInput');
  var motivoSelect = document.getElementById('motivoSelect');
  var motivoDetalheField = document.getElementById('motivoDetalheField');
  var motivoDetalheLabel = document.getElementById('motivoDetalheLabel');
  var motivoDetalheInput = document.getElementById('motivoDetalheInput');
  var pessoaSelect = document.getElementById('pessoaSelect');
  var registarBtn = document.getElementById('registarBtn');
  var movForm = document.getElementById('movForm');
  var movListEl = document.getElementById('movList');
  var saldoHojeValueEl = document.getElementById('saldoHojeValue');
  var pendingCountEl = document.getElementById('pendingCount');
  var pendingTotalEl = document.getElementById('pendingTotal');
  var pendingCardEl = document.getElementById('pendingCard');

  function formatEUR(n){
    return (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' €';
  }

  function formatHora(iso){
    var d = new Date(iso);
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function formatDataHora(iso){
    var d = new Date(iso);
    var dd = String(d.getDate()).padStart(2, '0');
    var mo = String(d.getMonth() + 1).padStart(2, '0');
    return dd + '/' + mo + ' ' + formatHora(iso);
  }

  function isToday(iso){
    var d = new Date(iso);
    var now = new Date();
    return d.getFullYear() === now.getFullYear() &&
           d.getMonth() === now.getMonth() &&
           d.getDate() === now.getDate();
  }

  function isWithinLast7Days(iso){
    var d = new Date(iso);
    var now = new Date();
    var diffMs = now - d;
    return diffMs >= 0 && diffMs <= 7 * 24 * 60 * 60 * 1000;
  }

  function currentMotivoOpcao(){
    var lista = MOTIVO_OPTIONS[formState.tipo] || [];
    return lista.filter(function(o){ return o.value === motivoSelect.value; })[0] || null;
  }

  function populateMotivoSelect(tipo){
    var lista = MOTIVO_OPTIONS[tipo] || [];
    var html = '<option value="">Seleciona um motivo...</option>';
    lista.forEach(function(o){
      html += '<option value="' + o.value + '">' + escapeHtml(o.label) + '</option>';
    });
    motivoSelect.innerHTML = html;
    motivoSelect.disabled = lista.length === 0;
    motivoDetalheField.style.display = 'none';
    motivoDetalheInput.value = '';
  }

  function onMotivoChange(){
    var opcao = currentMotivoOpcao();
    if (opcao && opcao.detailLabel){
      motivoDetalheField.style.display = 'block';
      motivoDetalheLabel.textContent = opcao.detailLabel;
      motivoDetalheInput.placeholder = opcao.detailPlaceholder || '';
    } else {
      motivoDetalheField.style.display = 'none';
      motivoDetalheInput.value = '';
    }
    validateForm();
  }

  function validateForm(){
    var opcao = currentMotivoOpcao();
    var motivoValido = !!opcao && (!opcao.detailLabel || motivoDetalheInput.value.trim().length > 0);
    var valid = formState.tipo && parseFloat(valorInput.value) > 0 && motivoValido;
    registarBtn.disabled = !valid;
  }

  function selectTipo(tipo){
    formState.tipo = tipo;
    tipoSaidaBtn.classList.toggle('active', tipo === 'saida');
    tipoEntradaBtn.classList.toggle('active', tipo === 'entrada');
    populateMotivoSelect(tipo);
    validateForm();
  }

  tipoSaidaBtn.addEventListener('click', function(){ selectTipo('saida'); valorInput.focus(); });
  tipoEntradaBtn.addEventListener('click', function(){ selectTipo('entrada'); valorInput.focus(); });
  valorInput.addEventListener('input', validateForm);
  motivoSelect.addEventListener('change', onMotivoChange);
  motivoDetalheInput.addEventListener('input', validateForm);

  movForm.addEventListener('submit', function(e){
    e.preventDefault();
    if (registarBtn.disabled) return;

    var tipo = formState.tipo;
    var valor = parseFloat(valorInput.value);
    var opcao = currentMotivoOpcao();
    var detalhe = motivoDetalheInput.value.trim();
    var motivo = opcao.detailLabel ? (opcao.label + ': ' + detalhe) : opcao.label;
    var semAcerto = !!opcao.semAcerto;
    var pessoaSelecao = resolvePessoaSelecao(pessoaSelect);

    var novoMov = {
      dataHora: new Date().toISOString(),
      tipo: tipo,
      valor: valor,
      motivo: motivo,
      pessoa: pessoaSelecao.pessoaNome,
      pessoaId: pessoaSelecao.pessoaId,
      estado: (tipo === 'entrada' || semAcerto) ? 'acertado' : 'aberto',
      valorDevolvido: semAcerto ? 0 : null,
      notas: null
    };

    registarBtn.disabled = true;
    registarBtn.textContent = 'A registar…';

    movRef.push(novoMov).then(function(){
      valorInput.value = '';
      selectTipo(null);
      tipoSaidaBtn.classList.remove('active');
      tipoEntradaBtn.classList.remove('active');
      registarBtn.textContent = 'Registar';
      validateForm();
    }).catch(function(err){
      registarBtn.textContent = 'Registar';
      validateForm();
      alert('Erro ao registar movimento: ' + err.message);
    });
  });

  document.querySelectorAll('.filter-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeFilter = btn.getAttribute('data-filter');
      mesFiltroInput.style.display = (activeFilter === 'mes') ? 'inline-block' : 'none';
      document.querySelectorAll('.filter-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      renderList();
    });
  });

  mesFiltroInput.addEventListener('change', renderList);
  motivoFiltroSelect.addEventListener('change', renderList);

  function openAcertar(id){
    acertarOpenId = id;
    renderList();
  }

  function cancelAcertar(){
    acertarOpenId = null;
    renderList();
  }
  window.cancelAcertar = cancelAcertar;
  window.openAcertar = openAcertar;

  function saveAcertar(id){
    var devolvidoInput = document.getElementById('devolvido_' + id);
    var notasInput = document.getElementById('notas_' + id);
    var devolvido = parseFloat(devolvidoInput.value);
    if (isNaN(devolvido) || devolvido < 0){
      alert('Indica um valor devolvido válido.');
      return;
    }
    var notas = notasInput.value.trim();

    movRef.child(id).update({
      estado: 'acertado',
      valorDevolvido: devolvido,
      notas: notas || null
    }).then(function(){
      acertarOpenId = null;
    }).catch(function(err){
      alert('Erro ao acertar movimento: ' + err.message);
    });
  }
  window.saveAcertar = saveAcertar;

  function renderSummary(){
    var entradasHoje = 0;
    var saidasHoje = 0;
    var pendingCount = 0;
    var pendingTotal = 0;

    Object.keys(allMovs).forEach(function(id){
      var m = allMovs[id];
      if (m.estado === 'aberto'){
        pendingCount++;
        pendingTotal += m.valor;
      }
      if (isToday(m.dataHora)){
        if (m.tipo === 'entrada'){
          entradasHoje += m.valor;
        } else {
          if (m.estado === 'acertado'){
            saidasHoje += (m.valor - (m.valorDevolvido || 0));
          } else {
            saidasHoje += m.valor;
          }
        }
      }
    });

    var saldo = entradasHoje - saidasHoje;
    saldoHojeValueEl.textContent = formatEUR(Math.abs(saldo));
    saldoHojeValueEl.classList.remove('positive', 'negative');
    if (saldo > 0){
      saldoHojeValueEl.textContent = '+' + saldoHojeValueEl.textContent;
      saldoHojeValueEl.classList.add('positive');
    } else if (saldo < 0){
      saldoHojeValueEl.textContent = '−' + saldoHojeValueEl.textContent;
      saldoHojeValueEl.classList.add('negative');
    }

    pendingCountEl.textContent = pendingCount;
    pendingTotalEl.textContent = pendingCount > 0 ? formatEUR(pendingTotal) + ' envolvidos' : 'tudo acertado';
    pendingCardEl.classList.toggle('pending-active', pendingCount > 0);
  }

  // motivo é gravado como "Label" (ex: Depósito bancário) ou "Label: detalhe"
  // (ex: "Compra: rúcula Pingo Doce") — por isso a comparação usa prefixo.
  function motivoCorrespondeFiltro(motivoTexto, labelFiltro){
    if (!labelFiltro) return true;
    if (!motivoTexto) return false;
    if (motivoTexto === labelFiltro) return true;
    return motivoTexto.indexOf(labelFiltro + ':') === 0;
  }

  function renderList(){
    var ids = Object.keys(allMovs).filter(function(id){
      var m = allMovs[id];
      var passaPeriodo = true;
      if (activeFilter === 'hoje') passaPeriodo = isToday(m.dataHora);
      else if (activeFilter === '7dias') passaPeriodo = isWithinLast7Days(m.dataHora);
      else if (activeFilter === 'mes'){
        var ym = mesFiltroInput.value;
        passaPeriodo = !!ym && (m.dataHora || '').slice(0, 7) === ym;
      }
      if (!passaPeriodo) return false;
      return motivoCorrespondeFiltro(m.motivo, motivoFiltroSelect.value);
    });

    ids.sort(function(a, b){
      return new Date(allMovs[b].dataHora) - new Date(allMovs[a].dataHora);
    });

    if (ids.length === 0){
      filterSummaryEl.textContent = '';
      movListEl.innerHTML = '<div class="empty-state">Sem movimentos neste período.</div>';
      return;
    }

    var html = '';
    ids.forEach(function(id){
      var m = allMovs[id];
      var isAberto = m.estado === 'aberto';
      var tipoLabel = m.tipo === 'saida' ? 'SAÍDA' : 'ENTRADA';
      var sinal = m.tipo === 'saida' ? '−' : '+';
      var horaLabel = activeFilter === 'hoje' ? formatHora(m.dataHora) : formatDataHora(m.dataHora);

      html += '<div class="mov-row' + (isAberto ? ' aberto' : '') + '">';
      html += '  <div class="mov-top">';
      html += '    <div class="mov-tipo-hora"><span class="mov-tipo-tag ' + m.tipo + '">' + tipoLabel + '</span><span>' + horaLabel + '</span></div>';
      html += '    <div class="mov-valor ' + m.tipo + '">' + sinal + formatEUR(m.valor) + '</div>';
      html += '  </div>';
      html += '  <p class="mov-motivo">' + escapeHtml(m.motivo) + '</p>';
      html += '  <div class="mov-meta">';
      html += '    <span class="mov-pessoa">' + escapeHtml(m.pessoa) + '</span>';
      if (isAberto){
        html += '    <span class="badge-pending">Por acertar</span>';
      }
      html += '  </div>';

      if (m.estado === 'acertado' && m.tipo === 'saida' && m.valorDevolvido !== null && m.valorDevolvido !== undefined){
        var gastoReal = m.valor - m.valorDevolvido;
        html += '  <p class="gasto-real">Devolvido ' + formatEUR(m.valorDevolvido) + ' · Gasto real: <strong>' + formatEUR(gastoReal) + '</strong></p>';
      }
      if (m.notas){
        html += '  <p class="notas-txt">' + escapeHtml(m.notas) + '</p>';
      }

      if (isAberto){
        if (acertarOpenId === id){
          html += '  <div class="acertar-form">';
          html += '    <div class="acertar-row">';
          html += '      <div class="field" style="margin-bottom:0;"><label class="field-label">Devolvido (€)</label><input type="number" inputmode="decimal" step="0.01" min="0" id="devolvido_' + id + '"></div>';
          html += '      <div class="field" style="margin-bottom:0;"><label class="field-label">Notas</label><input type="text" id="notas_' + id + '"></div>';
          html += '    </div>';
          html += '    <div class="acertar-actions">';
          html += '      <button type="button" class="btn-cancelar" onclick="cancelAcertar()">Cancelar</button>';
          html += '      <button type="button" class="btn-guardar" onclick="saveAcertar(\'' + id + '\')">Guardar</button>';
          html += '    </div>';
          html += '  </div>';
        } else {
          html += '  <button type="button" class="btn-acertar" onclick="openAcertar(\'' + id + '\')">✓ Acertar</button>';
        }
      }

      html += '</div>';
    });

    var totalValor = 0;
    ids.forEach(function(id){ totalValor += allMovs[id].valor; });
    if (ids.length === 0){
      filterSummaryEl.textContent = '';
    } else {
      filterSummaryEl.textContent = ids.length + (ids.length === 1 ? ' movimento' : ' movimentos') + ' · Total: ' + formatEUR(totalValor);
    }

    movListEl.innerHTML = html;
  }

  function escapeHtml(str){
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  movRef.on('value', function(snapshot){
    allMovs = snapshot.val() || {};
    renderSummary();
    renderList();
  });

  carregarPessoas(function(){
    popularSelectPessoas(pessoaSelect);
  });
  }); // fim de autenticarEContinuar
</script>

</body>
</html>
