<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>GIOCO · Callback Abanca</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
    --alert-bg:#FBE9EB;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .home-link{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--white);
    text-decoration:none;
    border:2px solid var(--white);
    padding:6px 10px;
    white-space:nowrap;
  }

  .home-link:hover{
    background:var(--white);
    color:var(--red);
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:40px 24px 80px;
  }

  .page-title{
    margin:0;
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .page-subtitle{
    margin:8px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .block{
    margin-top:40px;
    max-width:820px;
  }

  .label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
  }

  .code-box{
    border:2px solid var(--black);
    background:var(--white);
    padding:18px 20px;
    font-family:'Space Mono', monospace;
    font-size:15px;
    line-height:1.6;
    word-break:break-all;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
  }

  .actions{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .btn{
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    border:2px solid var(--black);
    background:var(--white);
    color:var(--black);
    padding:12px 20px;
    cursor:pointer;
    transition:all .15s ease;
    letter-spacing:0.5px;
  }

  .btn:hover{
    background:var(--black);
    color:var(--white);
  }

  .copy-feedback{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:0.5px;
  }

  .instruction{
    margin:20px 0 0;
    font-size:15px;
    line-height:1.6;
  }

  .alert{
    border:2px solid var(--red);
    background:var(--alert-bg);
    padding:20px;
  }

  .alert h2{
    margin:0 0 12px;
    font-size:16px;
    letter-spacing:0.5px;
    color:var(--red);
  }

  .alert-row{
    margin:0 0 10px;
    font-size:14px;
    line-height:1.6;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  .alert-row:last-child{margin-bottom:0;}

  .alert-row .k{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:2px;
  }

  .empty{
    border:2px solid var(--black);
    background:var(--white);
    padding:20px;
    font-family:'Space Mono', monospace;
    font-size:14px;
    line-height:1.7;
    color:var(--muted);
  }

  .meta{
    margin-top:28px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    line-height:1.8;
    color:var(--muted);
    word-break:break-all;
    overflow-wrap:anywhere;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="home-link">🏠 Home</a>
    <span class="brand-mark"><span style="color:var(--black);">●</span> GIOCO®</span>
  </div>
</header>

<main>
  <h1 class="page-title">Callback Abanca</h1>
  <p class="page-subtitle">Enable Banking · Autorização</p>

  <div id="conteudo"></div>
</main>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var error = params.get('error');
  var errorDescription = params.get('error_description');
  var alvo = document.getElementById('conteudo');

  function esc(txt){
    var d = document.createElement('div');
    d.textContent = txt;
    return d.innerHTML;
  }

  function blocoState(){
    if(!state) return '';
    return '<p class="meta"><strong>state:</strong> ' + esc(state) + '</p>';
  }

  if(code){
    alvo.innerHTML =
      '<div class="block">' +
        '<p class="label">Código de autorização</p>' +
        '<div class="code-box" id="codeBox">' + esc(code) + '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn" id="btnCopiar">Copiar</button>' +
          '<span class="copy-feedback" id="copyFeedback"></span>' +
        '</div>' +
        '<p class="instruction">Copia este código e cola-o no Claude Code Desktop para continuar a integração bancária.</p>' +
        blocoState() +
      '</div>';

    var btn = document.getElementById('btnCopiar');
    var feedback = document.getElementById('copyFeedback');

    btn.addEventListener('click', function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){
          feedback.textContent = '✓ Copiado';
          setTimeout(function(){ feedback.textContent = ''; }, 2500);
        }).catch(function(){
          feedback.textContent = 'Não foi possível copiar — selecciona o código à mão.';
        });
      } else {
        feedback.textContent = 'Clipboard indisponível — selecciona o código à mão.';
      }
    });

  } else if(error){
    alvo.innerHTML =
      '<div class="block">' +
        '<div class="alert">' +
          '<h2>Erro na autorização</h2>' +
          '<p class="alert-row"><span class="k">Erro</span>' + esc(error) + '</p>' +
          (errorDescription
            ? '<p class="alert-row"><span class="k">Descrição</span>' + esc(errorDescription) + '</p>'
            : '') +
        '</div>' +
        '<p class="instruction">A autorização não foi concluída. Repete o fluxo a partir do Claude Code Desktop.</p>' +
        blocoState() +
      '</div>';

  } else {
    alvo.innerHTML =
      '<div class="block">' +
        '<div class="empty">Nenhum código recebido — esta página só funciona como destino de um fluxo de autorização.</div>' +
      '</div>';
  }
})();
</script>

</body>
</html>
