<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#FFEDDA">
<meta name="apple-mobile-web-app-title" content="GIOCO Tarefas">
<meta name="viewport" content="width=1200">
<title>GIOCO OS · Tarefas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
    --green:#1E7A46;
    --amber:#C08A2E;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .home-link{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--white);
    text-decoration:none;
    border:2px solid var(--white);
    padding:6px 10px;
    white-space:nowrap;
  }

  .home-link:hover{
    background:var(--white);
    color:var(--red);
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:40px 24px 80px;
  }

  .page-title{
    margin:0;
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .page-subtitle{
    margin:8px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .col{
    max-width:760px;
  }

  .loading-state{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin:28px 0 0;
  }

  /* ---------- Adicionar tarefa ---------- */
  .add-card{
    background:var(--white);
    border:2px solid var(--black);
    padding:18px;
    margin-top:28px;
  }

  .add-row{
    display:flex;
    gap:8px;
  }

  .add-row input{
    flex:1;
    padding:11px 12px;
    border:2px solid var(--line);
    background:var(--bg);
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--black);
  }

  .add-row input:focus{
    outline:none;
    border-color:var(--black);
  }

  .btn-add{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    padding:0 18px;
    border:2px solid var(--black);
    background:var(--white);
    color:var(--black);
    cursor:pointer;
    line-height:1;
  }

  .btn-add:hover{
    background:var(--black);
    color:var(--white);
  }

  /* ---------- Bloco HOJE ---------- */
  .hoje-block{
    margin-top:28px;
    background:var(--black);
    color:var(--white);
    padding:20px 22px 22px;
  }

  .hoje-head{
    display:flex;
    align-items:baseline;
    gap:10px;
  }

  .hoje-title{
    margin:0;
    font-family:'Space Mono', monospace;
    font-size:14px;
    font-weight:700;
    letter-spacing:2px;
  }

  .hoje-count{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:#9a948c;
  }

  .hoje-count.over{
    color:var(--amber);
  }

  .hoje-aviso{
    display:none;
    margin:10px 0 0;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--amber);
  }

  .hoje-list{
    margin-top:14px;
    display:flex;
    flex-direction:column;
  }

  .hoje-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-top:1px solid #2e2c29;
    font-size:14px;
  }

  .hoje-row:first-child{
    border-top:none;
  }

  .hoje-num{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--red);
    flex-shrink:0;
  }

  .hoje-text{
    flex:1;
    word-break:break-word;
  }

  .hoje-badge{
    flex-shrink:0;
    font-family:'Space Mono', monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:3px 6px;
    border:1px solid #4a4742;
    color:#c9c3b9;
    white-space:nowrap;
  }

  .hoje-x{
    flex-shrink:0;
    background:none;
    border:none;
    color:#8a847c;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:15px;
    line-height:1;
    padding:2px 5px;
  }

  .hoje-x:hover{
    color:var(--white);
  }

  .hoje-empty{
    margin:14px 0 0;
    font-size:13px;
    color:#9a948c;
  }

  /* ---------- Secções ---------- */
  .task-section{
    margin-top:32px;
  }

  .section-title{
    margin:0 0 12px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .section-count{
    color:var(--black);
  }

  .task-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  /* ---------- Linhas ---------- */
  .task-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    background:var(--white);
    border:2px solid var(--black);
    font-size:14px;
  }

  .task-row input[type="checkbox"]{
    width:18px;
    height:18px;
    flex-shrink:0;
    cursor:pointer;
    accent-color:var(--red);
  }

  .task-text{
    flex:1;
    word-break:break-word;
    cursor:text;
    padding:2px 0;
  }

  .task-text:hover{
    text-decoration:underline dotted var(--muted);
  }

  .task-text-input{
    flex:1;
    padding:4px 6px;
    border:2px solid var(--black);
    background:var(--bg);
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--black);
  }

  .task-text-input:focus{
    outline:none;
  }

  /* ---------- Indicador de prazo ---------- */
  .prazo{
    flex-shrink:0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    white-space:nowrap;
    padding:4px 7px;
    border:1px solid transparent;
    background:none;
  }

  button.prazo{
    cursor:pointer;
  }

  button.prazo:hover{
    border-color:var(--line);
  }

  .prazo-late{
    color:var(--red);
    font-weight:700;
  }

  .prazo-soon{
    color:var(--amber);
  }

  .prazo-future{
    color:var(--black);
  }

  .prazo-none{
    color:var(--muted);
    font-size:11px;
  }

  /* ---------- Botões de linha ---------- */
  .row-btn{
    flex-shrink:0;
    background:none;
    border:none;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:3px 4px;
    opacity:0.45;
  }

  .row-btn:hover{
    opacity:1;
  }

  .btn-pin-on{
    opacity:1;
    color:var(--amber);
  }

  /* ---------- Aviso de revisão ---------- */
  .review-note{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border:1px dashed var(--amber);
    background:#FBF4E7;
    font-size:13px;
    color:#6d4e12;
  }

  .review-note span{
    flex:1;
  }

  .btn-review{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:6px 9px;
    border:1px solid var(--amber);
    background:var(--white);
    color:#6d4e12;
    cursor:pointer;
    white-space:nowrap;
  }

  .btn-review:hover{
    background:var(--amber);
    color:var(--white);
  }

  /* ---------- Sugestão de prazo ---------- */
  .sugestao{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:-2px;
    padding:9px 14px;
    border:1px solid var(--amber);
    border-top:none;
    background:#FBF4E7;
    font-size:13px;
    color:#6d4e12;
  }

  .sugestao span{
    flex:1;
  }

  .btn-sugestao{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:5px 10px;
    border:1px solid var(--amber);
    background:var(--white);
    color:#6d4e12;
    cursor:pointer;
  }

  .btn-sugestao:hover{
    background:var(--amber);
    color:var(--white);
  }

  /* ---------- Itens de outros módulos ---------- */
  .ext-badge{
    flex-shrink:0;
    font-family:'Space Mono', monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:4px 7px;
    border:1px solid var(--black);
    background:var(--bg);
    white-space:nowrap;
  }

  .ext-link{
    flex:1;
    text-decoration:none;
    color:var(--black);
    word-break:break-word;
    cursor:pointer;
  }

  .ext-link:hover{
    text-decoration:underline;
  }

  .ext-ref{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--red);
    margin-right:6px;
  }

  .ext-meta{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }

  /* ---------- Colapsáveis ---------- */
  .fold summary{
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:12px;
  }

  .fold summary:hover{
    color:var(--black);
  }

  .fold-done .task-row{
    border-color:var(--line);
    background:transparent;
  }

  .fold-done .task-text{
    text-decoration:line-through;
    color:var(--muted);
    cursor:default;
  }

  .fold-done .task-text:hover{
    text-decoration:line-through;
  }

  /* ---------- Estado vazio ---------- */
  .empty-state{
    margin-top:32px;
    padding:48px 20px;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:16px;
    color:var(--muted);
    border:2px dashed var(--line);
  }

  /* ---------- Popovers ---------- */
  .pop{
    display:none;
    position:absolute;
    z-index:50;
    background:var(--white);
    border:2px solid var(--black);
    box-shadow:4px 4px 0 var(--red);
    padding:10px;
  }

  #prazoPop{ width:230px; }
  #adiarPop{ width:170px; }

  .pop-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  .pop-opt{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:8px 6px;
    border:1px solid var(--black);
    background:var(--white);
    color:var(--black);
    cursor:pointer;
    white-space:nowrap;
    width:100%;
  }

  .pop-opt:hover{
    background:var(--black);
    color:var(--white);
  }

  .pop-opt-clear{
    border-color:var(--muted);
    color:var(--muted);
  }

  .pop-opt-clear:hover{
    background:var(--muted);
    color:var(--white);
  }

  .pop-sep{
    margin:10px 0 8px;
    border-top:1px solid var(--line);
  }

  .pop-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .pop input[type="date"]{
    width:100%;
    padding:8px;
    border:2px solid var(--line);
    background:var(--bg);
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--black);
    cursor:pointer;
  }

  .pop input[type="date"]:focus{
    outline:none;
    border-color:var(--black);
  }

  #adiarPop .pop-opt{
    margin-bottom:6px;
  }

  #adiarPop .pop-opt:last-child{
    margin-bottom:0;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="home-link">🏠 Home</a>
    <span class="brand-mark"><span style="color:var(--black);">●</span> GIOCO®</span>
  </div>
</header>

<main id="main">
  <h1 class="page-title">GIOCO OS · Tarefas</h1>
  <p class="page-subtitle">Lista unificada</p>

  <div class="col">
    <div class="add-card">
      <div class="add-row">
        <input type="text" id="taskInput" placeholder="Nova tarefa..." autocomplete="off">
        <button type="button" class="btn-add" id="btnAddTask" title="Adicionar tarefa">+</button>
      </div>
    </div>

    <p class="loading-state" id="loadingState">A carregar...</p>

    <div class="hoje-block" id="hojeBlock" style="display:none;">
      <div class="hoje-head">
        <h2 class="hoje-title">HOJE</h2>
        <span class="hoje-count" id="hojeCount">0/5</span>
      </div>
      <p class="hoje-aviso" id="hojeAviso">A lista funciona melhor curta.</p>
      <div class="hoje-list" id="hojeList"></div>
      <p class="hoje-empty" id="hojeEmpty" style="display:none;">Toca na ☆ de qualquer item abaixo para o trazer para hoje.</p>
    </div>

    <p class="empty-state" id="emptyState" style="display:none;">Sem tarefas pendentes ✓</p>

    <div class="task-section" id="secMinhas" style="display:none;">
      <p class="section-title">As minhas <span class="section-count" id="countMinhas"></span></p>
      <div class="task-list" id="listMinhas"></div>
    </div>

    <div class="task-section" id="secPagamentos" style="display:none;">
      <p class="section-title">💶 Pagamentos <span class="section-count" id="countPagamentos"></span></p>
      <div class="task-list" id="listPagamentos"></div>
    </div>

    <details class="task-section fold" id="secLoja" style="display:none;">
      <summary id="summaryLoja">📝 Loja (0)</summary>
      <div class="task-list" id="listLoja"></div>
    </details>

    <details class="task-section fold fold-done" id="secFeitas" style="display:none;">
      <summary id="summaryFeitas">Feitas hoje (0)</summary>
      <div class="task-list" id="listFeitas"></div>
    </details>
  </div>
</main>

<div class="pop" id="prazoPop">
  <div class="pop-grid">
    <button type="button" class="pop-opt" data-op="hoje">Hoje</button>
    <button type="button" class="pop-opt" data-op="amanha">Amanhã</button>
    <button type="button" class="pop-opt" data-op="semana">Esta semana</button>
    <button type="button" class="pop-opt pop-opt-clear" data-op="sem">Sem prazo</button>
  </div>
  <div class="pop-sep"></div>
  <label class="pop-label" for="prazoPopDate">Escolher data</label>
  <input type="date" id="prazoPopDate">
</div>

<div class="pop" id="adiarPop">
  <button type="button" class="pop-opt" data-op="amanha">Ver amanhã</button>
  <button type="button" class="pop-opt" data-op="semana">Ver esta semana</button>
</div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDxjZXA3wp4sgxMxmiuOQDomx9GJgt3puE",
    authDomain: "gioco-fornecedores.firebaseapp.com",
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gioco-fornecedores",
    storageBucket: "gioco-fornecedores.firebasestorage.app",
    messagingSenderId: "441783294427",
    appId: "1:441783294427:web:51a362d4f91d0e2149effe"
  };
  firebase.initializeApp(firebaseConfig);

  // NÃO ALTERAR: autenticação anónima obrigatória antes de qualquer
  // leitura/escrita no Firebase. Ver decisão de segurança de Ago/2026.
  function autenticarEContinuar(callback) {
    firebase.auth().signInAnonymously()
      .then(() => callback())
      .catch((erro) => {
        console.error('Falha na autenticação anónima:', erro);
        // Não continuar sem sessão — evita escritas/leituras que vão
        // falhar de qualquer forma quando as rules apertarem.
      });
  }

  autenticarEContinuar(function () {
  var db = firebase.database();

  var tasksRef = db.ref('tasks');
  var paymentRequestsRef = db.ref('paymentRequests');
  var pedidosRef = db.ref('lojaPedidos');
  var todayPicksRef = db.ref('todayPicks');
  var snoozedRef = db.ref('tarefasUi/snoozed');
  var lastReviewRef = db.ref('uiState/tarefasLastReview');

  var MAX_HOJE = 5;
  var SUGESTAO_MS = 9000;

  var allTasks = {};
  var allPayments = {};
  var allPedidos = {};
  var todayPicks = {};
  var snoozed = {};
  var lastReview = 0;

  var carregado = { tasks: false, payments: false, pedidos: false, picks: false, snoozed: false, review: false };

  /* ---------- Helpers gerais ---------- */
  function escapeHtml(str) {
    return String(str === undefined || str === null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function toISODate(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function hojeISO() {
    return toISODate(new Date());
  }

  function isoParaData(iso) {
    var p = String(iso).split("-");
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function isoMaisDias(iso, dias) {
    var d = isoParaData(iso);
    d.setDate(d.getDate() + dias);
    return toISODate(d);
  }

  // Fim da semana corrente (domingo). Se hoje já for domingo, é hoje.
  function fimDaSemanaISO() {
    var d = new Date();
    var dow = d.getDay();
    d.setDate(d.getDate() + (dow === 0 ? 0 : 7 - dow));
    return toISODate(d);
  }

  // Próxima ocorrência do dia da semana (hoje conta, se for o mesmo dia).
  function proximoDiaSemanaISO(dow) {
    var d = new Date();
    var delta = (dow - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + delta);
    return toISODate(d);
  }

  function fimDoDiaTs(iso) {
    var d = isoParaData(iso);
    d.setHours(23, 59, 59, 999);
    return d.getTime();
  }

  function ddmmyyyyToIso(str) {
    if (!str) return "";
    var parts = String(str).split("/");
    if (parts.length !== 3) return "";
    return parts[2] + "-" + parts[1] + "-" + parts[0];
  }

  function formatDDMM(iso) {
    var p = String(iso).split("-");
    return p[2] + "/" + p[1];
  }

  function diasDesde(ts) {
    if (!ts) return 0;
    return Math.max(0, Math.floor((Date.now() - ts) / 86400000));
  }

  function truncar(texto, max) {
    var t = String(texto || "");
    return t.length > max ? t.slice(0, max - 1) + "…" : t;
  }

  function ehHoje(ts) {
    return !!ts && toISODate(new Date(ts)) === hojeISO();
  }

  function chaveItem(source, refId) {
    return source + "_" + refId;
  }

  /* ---------- Classificação de prazo ---------- */
  // Ultrapassado → vermelho/negrito. Hoje ou amanhã → âmbar. Futuro → normal.
  // Sem prazo → idade em dias, cinzento, sempre igual.
  function prazoInfo(item) {
    var hoje = hojeISO();
    if (item.prazo) {
      if (item.prazo < hoje) return { cls: 'prazo-late', label: formatDDMM(item.prazo) };
      if (item.prazo === hoje) return { cls: 'prazo-soon', label: 'Hoje' };
      if (item.prazo === isoMaisDias(hoje, 1)) return { cls: 'prazo-soon', label: 'Amanhã' };
      return { cls: 'prazo-future', label: formatDDMM(item.prazo) };
    }
    return { cls: 'prazo-none', label: diasDesde(item.criadoTs) + 'd' };
  }

  function estaAtrasadoOuHoje(item) {
    return !!item.prazo && item.prazo <= hojeISO();
  }

  /* ---------- Deteção de datas no texto ---------- */
  var ACENTOS = { 'á': 'a', 'à': 'a', 'â': 'a', 'ã': 'a', 'é': 'e', 'ê': 'e',
    'í': 'i', 'ó': 'o', 'ô': 'o', 'õ': 'o', 'ú': 'u', 'ç': 'c' };

  function normalizar(texto) {
    return String(texto || "").toLowerCase().replace(/[áàâãéêíóôõúç]/g, function (c) {
      return ACENTOS[c] || c;
    });
  }

  var PADROES_DATA = [
    { re: /\bhoje\b/, tipo: 'hoje', label: 'hoje' },
    { re: /\bamanha\b/, tipo: 'amanha', label: 'amanhã' },
    { re: /\bdomingo\b/, dow: 0, label: 'domingo' },
    { re: /\bsegunda(\s*-?\s*feira)?\b/, dow: 1, label: 'segunda' },
    { re: /\bterca(\s*-?\s*feira)?\b/, dow: 2, label: 'terça' },
    { re: /\bquarta(\s*-?\s*feira)?\b/, dow: 3, label: 'quarta' },
    { re: /\bquinta(\s*-?\s*feira)?\b/, dow: 4, label: 'quinta' },
    { re: /\bsexta(\s*-?\s*feira)?\b/, dow: 5, label: 'sexta' },
    { re: /\bsabado\b/, dow: 6, label: 'sábado' }
  ];

  function detetarData(texto) {
    var t = normalizar(texto);
    for (var i = 0; i < PADROES_DATA.length; i++) {
      var p = PADROES_DATA[i];
      if (!p.re.test(t)) continue;
      var iso;
      if (p.tipo === 'hoje') iso = hojeISO();
      else if (p.tipo === 'amanha') iso = isoMaisDias(hojeISO(), 1);
      else iso = proximoDiaSemanaISO(p.dow);
      return { iso: iso, label: p.label };
    }
    return null;
  }

  /* ---------- Modelo de itens ---------- */
  function tarefasProprias() {
    return Object.keys(allTasks).map(function (id) {
      var t = allTasks[id];
      return {
        source: 'task',
        id: id,
        texto: t.texto || "",
        concluida: !!t.concluida,
        criadoTs: t.createdAt || 0,
        completedAt: t.completedAt || 0,
        prazo: t.prazo || null
      };
    });
  }

  function pagamentoPendente(p) {
    var status = p.status || 'pendente';
    return status !== 'concluido' && status !== 'anulado';
  }

  function pagamentoPrazo(p) {
    var isos = (p.lines || []).map(function (l) {
      return ddmmyyyyToIso(l.prazo);
    }).filter(function (iso) { return !!iso; }).sort();
    return isos.length ? isos[0] : null;
  }

  function pagamentoItem(id) {
    var p = allPayments[id];
    var lines = p.lines || [];
    var total = lines.reduce(function (soma, l) {
      var n = parseFloat(String(l.montante).replace(',', '.'));
      return soma + (isNaN(n) ? 0 : n);
    }, 0);
    var nome = lines.length ? (lines[0].fornecedor || "—") : "—";
    if (lines.length > 1) nome += " +" + (lines.length - 1);
    var criadoIso = ddmmyyyyToIso(p.date);
    return {
      source: 'pagamento',
      id: id,
      texto: truncar(nome, 60) + " · " + total.toFixed(2) + "€",
      ref: p.numeroReferencia ? '#' + p.numeroReferencia : '',
      meta: p.date ? 'Pedido em ' + p.date : '',
      badge: '💶 Pagamento',
      prazo: pagamentoPrazo(p),
      criadoTs: criadoIso ? isoParaData(criadoIso).getTime() : 0,
      href: 'pagamentos.html#pagamento-' + id
    };
  }

  function pedidoPendente(p) {
    var estado = p.estado || 'novo';
    return estado === 'novo' || estado === 'em análise';
  }

  function pedidoItem(id) {
    var p = allPedidos[id];
    var meta = [];
    if (p.zona) meta.push('Zona: ' + p.zona);
    if (p.pessoa) meta.push(p.pessoa);
    return {
      source: 'loja',
      id: id,
      texto: truncar(p.descricao, 90),
      ref: '',
      meta: meta.join(' · '),
      badge: '📝 Loja',
      prazo: null,
      criadoTs: p.dataHora ? new Date(p.dataHora).getTime() : 0,
      href: 'loja-sao-bento.html#pedidos-section'
    };
  }

  /* ---------- Snooze ---------- */
  function estaEscondido(source, refId) {
    var s = snoozed[chaveItem(source, refId)];
    return !!(s && s.hiddenUntil && s.hiddenUntil > Date.now());
  }

  function esconderAte(source, refId, ts) {
    var chave = chaveItem(source, refId);
    snoozed[chave] = { hiddenUntil: ts };
    snoozedRef.child(chave).child('hiddenUntil').set(ts);
  }

  /* ---------- todayPicks ---------- */
  function pickValido(pick) {
    if (!pick || !pick.source || !pick.refId) return false;
    if (pick.source === 'task') {
      var t = allTasks[pick.refId];
      return !!t && !t.concluida;
    }
    if (pick.source === 'pagamento') {
      var p = allPayments[pick.refId];
      return !!p && pagamentoPendente(p);
    }
    if (pick.source === 'loja') {
      var l = allPedidos[pick.refId];
      return !!l && pedidoPendente(l);
    }
    return false;
  }

  function estaFixado(source, refId) {
    return !!todayPicks[chaveItem(source, refId)];
  }

  function itemDoPick(pick) {
    if (pick.source === 'task') {
      var t = allTasks[pick.refId];
      return {
        source: 'task',
        id: pick.refId,
        texto: t.texto || "",
        badge: '',
        prazo: t.prazo || null,
        criadoTs: t.createdAt || 0
      };
    }
    if (pick.source === 'pagamento') return pagamentoItem(pick.refId);
    return pedidoItem(pick.refId);
  }

  function fixar(source, refId) {
    var chave = chaveItem(source, refId);
    if (todayPicks[chave]) {
      delete todayPicks[chave];
      todayPicksRef.child(chave).remove();
      esconderAvisoHoje();
    } else {
      var pick = { source: source, refId: refId, pinnedAt: Date.now() };
      todayPicks[chave] = pick;
      todayPicksRef.child(chave).set(pick);
      // Não bloqueia acima de 5 — só avisa.
      if (Object.keys(todayPicks).length > MAX_HOJE) mostrarAvisoHoje();
    }
    flushRender();
  }

  var avisoTimeout = null;

  function mostrarAvisoHoje() {
    var el = document.getElementById('hojeAviso');
    el.style.display = 'block';
    if (avisoTimeout) clearTimeout(avisoTimeout);
    avisoTimeout = setTimeout(esconderAvisoHoje, 6000);
  }

  function esconderAvisoHoje() {
    if (avisoTimeout) { clearTimeout(avisoTimeout); avisoTimeout = null; }
    document.getElementById('hojeAviso').style.display = 'none';
  }

  // Limpa picks cujo item desapareceu, foi concluído ou deixou de estar pendente.
  function limparPicks() {
    var removidos = false;
    Object.keys(todayPicks).forEach(function (chave) {
      if (pickValido(todayPicks[chave])) return;
      delete todayPicks[chave];
      todayPicksRef.child(chave).remove();
      removidos = true;
    });
    return removidos;
  }

  /* ---------- Escritas em tasks/ (uma chave de cada vez) ---------- */
  function setConcluida(id, valor) {
    if (!allTasks[id]) return;
    if (valor) {
      allTasks[id].completedAt = Date.now();
      allTasks[id].concluida = true;
      tasksRef.child(id).child('completedAt').set(allTasks[id].completedAt).then(function () {
        return tasksRef.child(id).child('concluida').set(true);
      });
    } else {
      allTasks[id].concluida = false;
      delete allTasks[id].completedAt;
      tasksRef.child(id).child('concluida').set(false).then(function () {
        return tasksRef.child(id).child('completedAt').remove();
      });
    }
    flushRender();
  }

  function setPrazo(id, iso) {
    if (!allTasks[id]) return;
    if (iso) {
      allTasks[id].prazo = iso;
      tasksRef.child(id).child('prazo').set(iso);
    } else {
      delete allTasks[id].prazo;
      tasksRef.child(id).child('prazo').remove();
    }
  }

  function setTexto(id, texto) {
    if (!allTasks[id]) return;
    allTasks[id].texto = texto;
    tasksRef.child(id).child('texto').set(texto);
  }

  function apagarTarefa(id) {
    delete allTasks[id];
    tasksRef.child(id).remove();
    flushRender();
  }

  /* ---------- Adicionar tarefa + sugestão de prazo ---------- */
  var sugestao = null;
  var sugestaoTimeout = null;

  function limparSugestao() {
    if (sugestaoTimeout) { clearTimeout(sugestaoTimeout); sugestaoTimeout = null; }
    sugestao = null;
  }

  function addTask() {
    var input = document.getElementById('taskInput');
    var texto = input.value.trim();
    if (!texto) return;
    input.value = '';

    var detetada = detetarData(texto);

    // A chave é gerada localmente antes da escrita: o Firebase levanta o evento
    // local ainda dentro do set(), e a sugestão tem de já existir nessa altura.
    var ref = tasksRef.push();

    limparSugestao();
    if (detetada) {
      sugestao = { id: ref.key, iso: detetada.iso, label: detetada.label };
      sugestaoTimeout = setTimeout(function () {
        limparSugestao();
        flushRender();
      }, SUGESTAO_MS);
    }

    ref.set({ texto: texto, concluida: false, createdAt: Date.now() });
  }

  /* ---------- Render ---------- */
  var editingTaskId = null;
  var popAberto = null;   // { tipo:'prazo'|'adiar', source, refId }
  var renderPendente = false;

  function flushRender() {
    if (editingTaskId || popAberto) {
      renderPendente = true;
      return;
    }
    renderPendente = false;
    renderAll();
  }

  function pinBtnHtml(source, refId) {
    var on = estaFixado(source, refId);
    return '<button type="button" class="row-btn btn-pin' + (on ? ' btn-pin-on' : '') +
      '" data-source="' + source + '" data-ref="' + refId + '" title="' +
      (on ? 'Tirar do Hoje' : 'Trazer para hoje') + '">' + (on ? '★' : '☆') + '</button>';
  }

  function prazoHtml(item, editavel) {
    var info = prazoInfo(item);
    if (editavel) {
      return '<button type="button" class="prazo ' + info.cls + '" title="Definir prazo">' + escapeHtml(info.label) + '</button>';
    }
    return '<span class="prazo ' + info.cls + '">' + escapeHtml(info.label) + '</span>';
  }

  function tarefaRowHtml(t) {
    return '<div class="task-row" data-source="task" data-id="' + t.id + '">' +
      '<input type="checkbox" class="task-check"' + (t.concluida ? ' checked' : '') + '>' +
      '<span class="task-text">' + escapeHtml(t.texto) + '</span>' +
      prazoHtml(t, !t.concluida) +
      pinBtnHtml('task', t.id) +
      '<button type="button" class="row-btn btn-del" title="Apagar">🗑</button>' +
      '</div>';
  }

  function tarefaFeitaRowHtml(t) {
    return '<div class="task-row" data-source="task" data-id="' + t.id + '">' +
      '<input type="checkbox" class="task-check" checked>' +
      '<span class="task-text">' + escapeHtml(t.texto) + '</span>' +
      '<button type="button" class="row-btn btn-del" title="Apagar">🗑</button>' +
      '</div>';
  }

  function externoRowHtml(item) {
    return '<div class="task-row" data-source="' + item.source + '" data-id="' + item.id + '">' +
      '<span class="ext-badge">' + escapeHtml(item.badge) + '</span>' +
      '<a class="ext-link" href="' + escapeHtml(item.href) + '">' +
        (item.ref ? '<span class="ext-ref">' + escapeHtml(item.ref) + '</span>' : '') +
        escapeHtml(item.texto) +
        (item.meta ? '<span class="ext-meta">' + escapeHtml(item.meta) + '</span>' : '') +
      '</a>' +
      prazoHtml(item, false) +
      pinBtnHtml(item.source, item.id) +
      '<button type="button" class="row-btn btn-adiar" title="Adiar">⏰</button>' +
      '</div>';
  }

  function sugestaoHtml() {
    return '<div class="sugestao" id="sugestaoChip">' +
      '<span>📅 Definir prazo para ' + escapeHtml(sugestao.label) + '?</span>' +
      '<button type="button" class="btn-sugestao" data-op="sim">Sim</button>' +
      '<button type="button" class="btn-sugestao" data-op="nao">Ignorar</button>' +
      '</div>';
  }

  function reviewNoteHtml() {
    return '<div class="review-note">' +
      '<span>Há mais de 7 dias sem reveres estas tarefas</span>' +
      '<button type="button" class="btn-review" id="btnRevi">Revi agora ✓</button>' +
      '</div>';
  }

  function hojeRowHtml(item, indice, automatico) {
    return '<div class="hoje-row" data-source="' + item.source + '" data-id="' + item.id +
      '" data-auto="' + (automatico ? '1' : '0') + '">' +
      '<span class="hoje-num">' + pad2(indice) + '</span>' +
      '<span class="hoje-text">' + escapeHtml(item.texto) + '</span>' +
      (item.badge ? '<span class="hoje-badge">' + escapeHtml(item.badge) + '</span>' : '') +
      '<button type="button" class="hoje-x" title="' +
        (automatico ? 'Esconder até amanhã' : 'Tirar do Hoje') + '">×</button>' +
      '</div>';
  }

  // Composição do bloco Hoje: fixados manualmente (por pinnedAt) e depois
  // preenchimento automático com prazos vencidos/hoje até 5.
  function construirHoje(tarefas, pagamentos) {
    var fixados = Object.keys(todayPicks).map(function (chave) {
      return todayPicks[chave];
    }).filter(pickValido).sort(function (a, b) {
      return (a.pinnedAt || 0) - (b.pinnedAt || 0);
    }).map(function (pick) {
      return { item: itemDoPick(pick), automatico: false };
    });

    var candidatos = tarefas.filter(function (t) {
      return !t.concluida && estaAtrasadoOuHoje(t);
    }).concat(pagamentos.filter(estaAtrasadoOuHoje));

    var automaticos = candidatos.filter(function (item) {
      return !estaFixado(item.source, item.id) && !estaEscondido(item.source, item.id);
    }).sort(function (a, b) {
      if (a.prazo !== b.prazo) return a.prazo < b.prazo ? -1 : 1;
      return (a.criadoTs || 0) - (b.criadoTs || 0);
    }).slice(0, Math.max(0, MAX_HOJE - fixados.length)).map(function (item) {
      return { item: item, automatico: true };
    });

    return fixados.concat(automaticos);
  }

  function renderAll() {
    if (!carregado.tasks || !carregado.payments || !carregado.pedidos ||
        !carregado.picks || !carregado.snoozed || !carregado.review) return;
    document.getElementById('loadingState').style.display = 'none';

    if (limparPicks()) { /* segue com o estado local já limpo */ }

    var hoje = hojeISO();
    var tarefas = tarefasProprias();

    var pagamentos = Object.keys(allPayments)
      .filter(function (id) { return pagamentoPendente(allPayments[id]); })
      .map(pagamentoItem);

    var pedidos = Object.keys(allPedidos)
      .filter(function (id) { return pedidoPendente(allPedidos[id]); })
      .map(pedidoItem);

    /* ----- Bloco Hoje ----- */
    var linhasHoje = construirHoje(tarefas, pagamentos);
    document.getElementById('hojeBlock').style.display = 'block';
    document.getElementById('hojeList').innerHTML = linhasHoje.map(function (l, i) {
      return hojeRowHtml(l.item, i + 1, l.automatico);
    }).join('');
    var contador = document.getElementById('hojeCount');
    contador.textContent = linhasHoje.length + '/' + MAX_HOJE;
    contador.className = 'hoje-count' + (linhasHoje.length > MAX_HOJE ? ' over' : '');
    document.getElementById('hojeEmpty').style.display = linhasHoje.length ? 'none' : 'block';

    /* ----- As minhas ----- */
    var minhas = tarefas.filter(function (t) { return !t.concluida; });
    var grupoA = minhas.filter(estaAtrasadoOuHoje).sort(function (a, b) {
      return a.prazo < b.prazo ? -1 : (a.prazo > b.prazo ? 1 : 0);
    });
    var grupoB = minhas.filter(function (t) { return t.prazo && t.prazo > hoje; }).sort(function (a, b) {
      return a.prazo < b.prazo ? -1 : (a.prazo > b.prazo ? 1 : 0);
    });
    var grupoC = minhas.filter(function (t) { return !t.prazo; }).sort(function (a, b) {
      return (b.criadoTs || 0) - (a.criadoTs || 0);
    });

    var mostrarRevisao = grupoC.length > 0 && (Date.now() - (lastReview || 0)) > 7 * 86400000;

    var htmlMinhas = '';
    grupoA.concat(grupoB).forEach(function (t) {
      htmlMinhas += tarefaRowHtml(t);
      if (sugestao && sugestao.id === t.id) htmlMinhas += sugestaoHtml();
    });
    if (mostrarRevisao) htmlMinhas += reviewNoteHtml();
    grupoC.forEach(function (t) {
      htmlMinhas += tarefaRowHtml(t);
      if (sugestao && sugestao.id === t.id) htmlMinhas += sugestaoHtml();
    });

    document.getElementById('listMinhas').innerHTML = htmlMinhas;
    document.getElementById('countMinhas').textContent = '(' + minhas.length + ')';
    document.getElementById('secMinhas').style.display = minhas.length ? 'block' : 'none';

    /* ----- Pagamentos ----- */
    var pagVisiveis = pagamentos.filter(function (p) {
      return !estaEscondido('pagamento', p.id);
    }).sort(function (a, b) {
      if (!a.prazo && !b.prazo) return (a.criadoTs || 0) - (b.criadoTs || 0);
      if (!a.prazo) return 1;
      if (!b.prazo) return -1;
      return a.prazo < b.prazo ? -1 : (a.prazo > b.prazo ? 1 : 0);
    });

    document.getElementById('listPagamentos').innerHTML = pagVisiveis.map(externoRowHtml).join('');
    document.getElementById('countPagamentos').textContent = '(' + pagVisiveis.length + ')';
    document.getElementById('secPagamentos').style.display = pagVisiveis.length ? 'block' : 'none';

    /* ----- Loja ----- */
    var lojaVisiveis = pedidos.filter(function (p) {
      return !estaEscondido('loja', p.id);
    }).sort(function (a, b) {
      return (b.criadoTs || 0) - (a.criadoTs || 0);
    });

    document.getElementById('listLoja').innerHTML = lojaVisiveis.map(externoRowHtml).join('');
    document.getElementById('summaryLoja').textContent = '📝 Loja (' + lojaVisiveis.length + ')';
    document.getElementById('secLoja').style.display = lojaVisiveis.length ? 'block' : 'none';

    /* ----- Feitas hoje ----- */
    var feitas = tarefas.filter(function (t) {
      return t.concluida && ehHoje(t.completedAt);
    }).sort(function (a, b) {
      return (b.completedAt || 0) - (a.completedAt || 0);
    });

    document.getElementById('listFeitas').innerHTML = feitas.map(tarefaFeitaRowHtml).join('');
    document.getElementById('summaryFeitas').textContent = 'Feitas hoje (' + feitas.length + ')';
    document.getElementById('secFeitas').style.display = feitas.length ? 'block' : 'none';

    /* ----- Estado vazio (fora do bloco Hoje) ----- */
    var totalPendente = minhas.length + pagVisiveis.length + lojaVisiveis.length;
    document.getElementById('emptyState').style.display = totalPendente === 0 ? 'block' : 'none';
  }

  /* ---------- Edição inline ---------- */
  function iniciarEdicao(span) {
    var row = span.closest('.task-row');
    if (!row || row.closest('.fold-done')) return;
    var id = row.getAttribute('data-id');
    if (!allTasks[id]) return;

    fecharPop(false);
    editingTaskId = id;

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'task-text-input';
    input.value = allTasks[id].texto || '';
    row.replaceChild(input, span);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    var terminado = false;
    function terminar(guardar) {
      if (terminado) return;
      terminado = true;
      editingTaskId = null;
      var novo = input.value.trim();
      if (guardar && novo && novo !== (allTasks[id] || {}).texto) setTexto(id, novo);
      flushRender();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); terminar(true); }
      else if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
    });
    input.addEventListener('blur', function () { terminar(true); });
  }

  /* ---------- Popovers ---------- */
  var prazoPop = document.getElementById('prazoPop');
  var prazoPopDate = document.getElementById('prazoPopDate');
  var adiarPop = document.getElementById('adiarPop');

  function abrirPop(tipo, btn) {
    var row = btn.closest('.task-row');
    if (!row) return;
    var source = row.getAttribute('data-source');
    var refId = row.getAttribute('data-id');
    var pop = tipo === 'prazo' ? prazoPop : adiarPop;

    popAberto = { tipo: tipo, source: source, refId: refId };
    if (tipo === 'prazo') prazoPopDate.value = (allTasks[refId] || {}).prazo || '';

    pop.style.display = 'block';
    var r = btn.getBoundingClientRect();
    var maxLeft = window.pageXOffset + document.documentElement.clientWidth - pop.offsetWidth - 10;
    pop.style.top = (r.bottom + window.pageYOffset + 6) + 'px';
    pop.style.left = Math.max(10, Math.min(r.left + window.pageXOffset, maxLeft)) + 'px';
  }

  function fecharPop(render) {
    prazoPop.style.display = 'none';
    adiarPop.style.display = 'none';
    popAberto = null;
    if (render !== false && renderPendente) flushRender();
  }

  prazoPop.addEventListener('click', function (e) {
    var opt = e.target.closest('.pop-opt');
    if (!opt || !popAberto) return;
    var op = opt.getAttribute('data-op');
    var iso = null;
    if (op === 'hoje') iso = hojeISO();
    else if (op === 'amanha') iso = isoMaisDias(hojeISO(), 1);
    else if (op === 'semana') iso = fimDaSemanaISO();
    setPrazo(popAberto.refId, iso);
    fecharPop(false);
    flushRender();
  });

  prazoPopDate.addEventListener('change', function () {
    if (!popAberto) return;
    setPrazo(popAberto.refId, prazoPopDate.value || null);
    fecharPop(false);
    flushRender();
  });

  adiarPop.addEventListener('click', function (e) {
    var opt = e.target.closest('.pop-opt');
    if (!opt || !popAberto) return;
    var op = opt.getAttribute('data-op');
    // "Ver amanhã" → escondido até ao fim de hoje. "Ver esta semana" → até à véspera do fim da semana.
    var ate = op === 'semana'
      ? fimDoDiaTs(isoMaisDias(fimDaSemanaISO(), -1))
      : fimDoDiaTs(hojeISO());
    if (ate <= Date.now()) ate = fimDoDiaTs(hojeISO());
    esconderAte(popAberto.source, popAberto.refId, ate);
    fecharPop(false);
    flushRender();
  });

  document.addEventListener('click', function (e) {
    if (!popAberto) return;
    if (e.target.closest('.pop') || e.target.closest('.prazo') || e.target.closest('.btn-adiar')) return;
    fecharPop(true);
  });

  /* ---------- Delegação de eventos ---------- */
  var mainEl = document.getElementById('main');

  mainEl.addEventListener('click', function (e) {
    /* --- bloco Hoje --- */
    var x = e.target.closest('.hoje-x');
    if (x) {
      var hojeRow = x.closest('.hoje-row');
      var source = hojeRow.getAttribute('data-source');
      var refId = hojeRow.getAttribute('data-id');
      if (hojeRow.getAttribute('data-auto') === '1') {
        esconderAte(source, refId, fimDoDiaTs(hojeISO()));
      } else {
        delete todayPicks[chaveItem(source, refId)];
        todayPicksRef.child(chaveItem(source, refId)).remove();
        esconderAvisoHoje();
      }
      flushRender();
      return;
    }

    /* --- sugestão de prazo --- */
    var sug = e.target.closest('.btn-sugestao');
    if (sug) {
      if (sug.getAttribute('data-op') === 'sim' && sugestao) setPrazo(sugestao.id, sugestao.iso);
      limparSugestao();
      flushRender();
      return;
    }

    /* --- revisão semanal --- */
    if (e.target.closest('#btnRevi')) {
      lastReview = Date.now();
      lastReviewRef.set(lastReview);
      flushRender();
      return;
    }

    /* --- fixar --- */
    var pin = e.target.closest('.btn-pin');
    if (pin) {
      fixar(pin.getAttribute('data-source'), pin.getAttribute('data-ref'));
      return;
    }

    /* --- adiar --- */
    var adiar = e.target.closest('.btn-adiar');
    if (adiar) {
      if (popAberto && popAberto.tipo === 'adiar' &&
          popAberto.refId === adiar.closest('.task-row').getAttribute('data-id')) {
        fecharPop(true);
        return;
      }
      fecharPop(false);
      abrirPop('adiar', adiar);
      return;
    }

    /* --- indicador de prazo (só tarefas próprias) --- */
    var prazoBtn = e.target.closest('button.prazo');
    if (prazoBtn) {
      if (popAberto && popAberto.tipo === 'prazo' &&
          popAberto.refId === prazoBtn.closest('.task-row').getAttribute('data-id')) {
        fecharPop(true);
        return;
      }
      fecharPop(false);
      abrirPop('prazo', prazoBtn);
      return;
    }

    /* --- apagar --- */
    var del = e.target.closest('.btn-del');
    if (del) {
      apagarTarefa(del.closest('.task-row').getAttribute('data-id'));
      return;
    }

    /* --- editar --- */
    var texto = e.target.closest('.task-text');
    if (texto) iniciarEdicao(texto);
  });

  mainEl.addEventListener('change', function (e) {
    var check = e.target.closest('.task-check');
    if (!check) return;
    setConcluida(check.closest('.task-row').getAttribute('data-id'), check.checked);
  });

  document.getElementById('btnAddTask').addEventListener('click', addTask);
  document.getElementById('taskInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addTask(); }
  });

  /* ---------- Ligação ao Firebase ---------- */
  tasksRef.on('value', function (snapshot) {
    allTasks = snapshot.val() || {};
    carregado.tasks = true;
    flushRender();
  });

  paymentRequestsRef.on('value', function (snapshot) {
    allPayments = snapshot.val() || {};
    carregado.payments = true;
    flushRender();
  });

  pedidosRef.on('value', function (snapshot) {
    allPedidos = snapshot.val() || {};
    carregado.pedidos = true;
    flushRender();
  });

  todayPicksRef.on('value', function (snapshot) {
    todayPicks = snapshot.val() || {};
    carregado.picks = true;
    flushRender();
  });

  snoozedRef.on('value', function (snapshot) {
    snoozed = snapshot.val() || {};
    carregado.snoozed = true;
    flushRender();
  });

  lastReviewRef.on('value', function (snapshot) {
    lastReview = snapshot.val() || 0;
    carregado.review = true;
    flushRender();
  });
  }); // fim de autenticarEContinuar
</script>

</body>
</html>
