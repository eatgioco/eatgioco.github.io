<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIOCO · Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
    --amber:#B8860B;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono,.card-title,.tag,.field-label{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .home-link{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--white);
    text-decoration:none;
    border:2px solid var(--white);
    padding:6px 10px;
    white-space:nowrap;
  }

  .home-link:hover{
    background:var(--white);
    color:var(--red);
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:48px 24px;
  }

  .page-title{
    margin:0;
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .page-subtitle{
    margin:8px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    margin-top:40px;
  }

  .card-calendario{
    grid-column:span 1;
  }

  .card-pagamentos{
    grid-column:span 2;
  }

  @media (max-width: 860px){
    .grid{
      grid-template-columns:repeat(2, 1fr);
    }
  }

  @media (max-width: 560px){
    .grid{
      grid-template-columns:1fr;
    }
    .card-calendario, .card-pagamentos{
      grid-column:span 1;
    }
  }

  .card{
    display:block;
    background:var(--white);
    border:2px solid var(--black);
    padding:24px;
    text-decoration:none;
    color:var(--black);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }

  .card:hover{
    transform:translate(-2px,-2px);
    box-shadow:4px 4px 0 var(--red);
  }

  .card-icon{
    font-size:28px;
    line-height:1;
  }

  .card-title{
    margin:14px 0 4px;
    font-size:16px;
    font-weight:700;
  }

  .card-subtitle{
    margin:0;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--muted);
  }

  .status-badge{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:4px 8px;
    color:var(--white);
    margin-top:14px;
  }

  .status-badge-warning{
    background:var(--amber);
  }

  .payments-summary{
    display:flex;
    gap:28px;
    margin:16px 0;
    padding:14px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  .summary-stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .summary-value{
    font-family:'Space Mono', monospace;
    font-size:24px;
    font-weight:700;
  }

  .summary-label{
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .payments-list{
    max-height:240px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .payment-item{
    border:1px solid var(--line);
    padding:10px 12px;
  }

  .payment-item-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    font-size:13px;
  }

  .payment-item-top strong{
    font-weight:600;
  }

  .payment-item-top span{
    font-family:'Space Mono', monospace;
    font-weight:700;
    white-space:nowrap;
  }

  .payment-item-sub{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }

  .empty-state-inline{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--muted);
    margin:20px 0 4px;
  }

  .loading-state{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:14px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="home-link">🏠 Home</a>
    <span class="brand-mark"><span style="color:var(--black);">●</span> GIOCO®</span>
  </div>
</header>

<main>
  <h1 class="page-title">GIOCO · Dashboard</h1>
  <p class="page-subtitle">Manel — Gestão</p>

  <div class="grid">
    <div class="card card-calendario" id="cardCalendario">
      <div class="card-icon">📅</div>
      <h3 class="card-title">Calendário</h3>
      <p class="card-subtitle">Outlook — em breve</p>
      <span class="status-badge status-badge-warning">Em configuração</span>
    </div>

    <a class="card card-pagamentos" href="fornecedores.html#pagamentos" id="cardPagamentos">
      <div class="card-icon">💰</div>
      <h3 class="card-title">Pagamentos Pendentes</h3>

      <p class="loading-state" id="paymentsLoading">A carregar...</p>

      <div class="payments-summary" id="paymentsSummary" style="display:none;">
        <div class="summary-stat">
          <span class="summary-value" id="summaryCount">0</span>
          <span class="summary-label">Pedidos</span>
        </div>
        <div class="summary-stat">
          <span class="summary-value" id="summaryTotal">0.00€</span>
          <span class="summary-label">Total</span>
        </div>
      </div>

      <div class="payments-list" id="paymentsList"></div>

      <p class="empty-state-inline" id="paymentsEmptyInline" style="display:none;">Sem pagamentos pendentes ✓</p>
    </a>
  </div>
</main>

<script>
window.addEventListener('load', function () {

  document.getElementById('cardCalendario').addEventListener('click', function () {
    alert('Integração Outlook a caminho');
  });

  var firebaseConfig = {
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var paymentRequestsRef = db.ref('paymentRequests');

  var loadingEl = document.getElementById('paymentsLoading');
  var summaryEl = document.getElementById('paymentsSummary');
  var countEl = document.getElementById('summaryCount');
  var totalEl = document.getElementById('summaryTotal');
  var listEl = document.getElementById('paymentsList');
  var emptyEl = document.getElementById('paymentsEmptyInline');

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatEuro(n) {
    return n.toFixed(2) + "€";
  }

  paymentRequestsRef.on('value', function (snapshot) {
    var data = snapshot.val() || {};
    loadingEl.style.display = 'none';

    var pending = Object.keys(data)
      .map(function (id) { return Object.assign({ id: id }, data[id]); })
      .filter(function (p) { return (p.status || 'pendente') === 'pendente'; })
      .sort(function (a, b) { return b.id.localeCompare(a.id); });

    if (pending.length === 0) {
      summaryEl.style.display = 'none';
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }

    emptyEl.style.display = 'none';
    summaryEl.style.display = 'flex';

    var totalSum = 0;
    var html = '';

    pending.forEach(function (p) {
      var lines = p.lines || [];
      var fornecedores = lines.map(function (l) { return l.fornecedor; }).filter(Boolean).join(', ');

      var lineTotal = lines.reduce(function (sum, l) {
        var n = parseFloat(String(l.montante).replace(',', '.'));
        return sum + (isNaN(n) ? 0 : n);
      }, 0);
      totalSum += lineTotal;

      var prazos = lines.map(function (l) { return l.prazo; }).filter(Boolean);
      var uniquePrazos = prazos.filter(function (v, i) { return prazos.indexOf(v) === i; });
      var prazoLabel = uniquePrazos.length ? uniquePrazos[0] + (uniquePrazos.length > 1 ? ' …' : '') : 'n/d';

      html += '<div class="payment-item">';
      html += '<div class="payment-item-top"><strong>' + escapeHtml(fornecedores || 'Sem fornecedor') + '</strong><span>' + formatEuro(lineTotal) + '</span></div>';
      html += '<div class="payment-item-sub">Prazo: ' + escapeHtml(prazoLabel) + '</div>';
      html += '</div>';
    });

    listEl.innerHTML = html;
    countEl.textContent = pending.length;
    totalEl.textContent = formatEuro(totalSum);
  }, function (error) {
    loadingEl.textContent = 'Erro de ligação à base de dados.';
  });

});
</script>

</body>
</html>
