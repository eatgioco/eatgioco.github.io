<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GIOCO · Loja (teste · novo design)</title>
<meta name="theme-color" content="#F3F1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GIOCO Loja">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MOCKUP · NOVO DESIGN (minimal, plano, espaçoso).
   O que mudou face à versão anterior é SÓ apresentação:
     - .glass-light (vidro, blur, brilho) -> .surface (branco plano)
     - selos em gradiente -> tintas planas
     - barra flutuante com indicador arrastável -> barra fixa
       com "Hoje" elevado ao centro
     - botões "lançador" (padrão da caixa.html) no ecrã Hoje
       e no teclado numérico
   Toda a lógica (rondas, prazos, picagem, entradas, pedidos,
   férias, fila offline, notificação) está igual.
   Os tokens de cor continuam a ser os do gioco-shell.css.
   Na versão real: <link rel="stylesheet" href="gioco-shell.css">
   e este CSS fica como bloco local da página.
   ============================================================ */

/* ---------- tokens (gioco-shell.css) ---------- */
:root{
  --dough:#F3F1EE; --ink:#141414; --white:#FFFFFF; --line:#f0e6d6; --muted:#6b6660;
  --red:#D91124; --red-ink:#D91124; --on-red:#FFFFFF;
  --lime:#D7EF91; --mustard:#FFCC02; --blush:#F9CBCB; --navy:#004476; --sky:#CFE2F3;
  --green:#1E7A46; --green-bg:#EEF6F1;
  --amber:#8A6508; --amber-bg:#FBF3DF;
  --tap:56px;   /* loja: em pé, com pressa, mãos molhadas */
  /* selos: tintas PLANAS (sem gradiente), par claro/escuro obrigatório */
  --seal-cream:#F8E6D6;
  --seal-lime:#E8F3C6;
  --seal-mustard:#FBECB3;
  --seal-blush:#F9DEDB;
  --seal-navy:#DCE6EE;
  --seal-sky:#E0EBF5;
  --on-seal:#141414;
  /* locais desta página */
  --hair:#E9E5DF;          /* divisórias dentro de cartões */
  --key-shadow:#DAD5CD;    /* sombra sólida das teclas/lançadores */
  --card-shadow:0 1px 2px rgba(20,18,14,.05),0 8px 24px rgba(20,18,14,.04);
}
[data-theme="dark"]{
  --dough:#15130f; --ink:#f2ede4; --white:#1f1c17; --line:#332e26; --muted:#a39c8f;
  --lime:#9fd15a; --mustard:#e0ab1f; --blush:#c97d7d; --navy:#5fa8e6; --sky:#5A8FC4;
  --red-ink:#ff7d88;
  --green:#6FD39B; --green-bg:rgba(111,211,155,0.12);
  --amber:#E8B33A; --amber-bg:rgba(232,179,58,0.12);
  --seal-cream:#2b241c;
  --seal-lime:#232b19;
  --seal-mustard:#2e2716;
  --seal-blush:#2f2120;
  --seal-navy:#1b2530;
  --seal-sky:#1c2631;
  --on-seal:#f2ede4;
  --hair:#2c2822;
  --key-shadow:#0b0a08;
  --card-shadow:none;
}
/* .status.high vem do shell com blush+navy: no tema escuro dá 1,23:1. */
[data-theme="dark"] .status.high{color:#141414;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:#E2DED7;font-family:'Inter',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;min-height:100vh;}
[data-theme="dark"] body{background:#0c0b09;}
.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--ink);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

.device{width:375px;height:812px;background:var(--dough);position:relative;overflow:hidden;
  display:flex;flex-direction:column;border-radius:34px;}
@media (max-width:520px){
  body{display:block;background:var(--dough);}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;}
}

/* ---------- superfície plana (substitui .glass-light) ---------- */
.surface{background:var(--white);box-shadow:var(--card-shadow);}

/* ---------- cabeçalho ---------- */
.page{padding:0 20px;}
.greet-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:22px;padding:22px 20px 0;}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;}
.greet-row h1{font-family:'Antonio',sans-serif;font-weight:600;font-size:36px;margin:0;
  letter-spacing:-.005em;line-height:1.05;}
.page-subtitle{font-size:14px;color:var(--muted);margin-top:7px;}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:600;color:#fff;flex:0 0 auto;
  background:var(--ink);}

/* ---------- lançadores (padrão caixa.html) ---------- */
.launch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:2px 0 22px;}
.l-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:4px 0;cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;
  font-size:12px;font-weight:500;line-height:1.2;text-align:center;}
.l-c{width:62px;height:62px;border-radius:50%;background:var(--white);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 var(--key-shadow);
  transition:transform .09s ease,box-shadow .09s ease,background .09s ease;}
.l-btn:active .l-c{transform:translateY(3px);box-shadow:0 1px 0 var(--key-shadow);
  background:var(--red);color:var(--on-red);}

/* ---------- KPI ---------- */
.kpi{border-radius:24px;padding:22px;margin-bottom:16px;}
.kpi.seal-cream{background:var(--seal-cream);}
.kpi.seal-lime{background:var(--seal-lime);}
.kpi.seal-mustard{background:var(--seal-mustard);}
.kpi.seal-blush{background:var(--seal-blush);}
.kpi.seal-navy{background:var(--seal-navy);}
.kpi.seal-sky{background:var(--seal-sky);}
.kpi[class*="seal-"]{box-shadow:none;}
.kpi .k-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;}
[data-theme="light"] .kpi[class*="seal-"] .k-label,
[data-theme="light"] .kpi[class*="seal-"] .k-note{color:#4f4a44;}
.kpi .k-value{font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;line-height:1.15;}
.kpi .k-value.big{font-size:46px;letter-spacing:-.02em;line-height:1;}
.kpi .k-value.dim{color:var(--muted);opacity:.5;}
.kpi .k-note{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.5;}
.kpi .k-note b{color:var(--ink);font-weight:600;}

/* ---------- cartões ---------- */
.panel,.table-panel,.app-card,.qa-card{border-radius:22px;padding:20px;margin-bottom:16px;}
.panel h3,.table-panel h3,.app-card h3,.qa-card h3{
  font-family:'Inter',sans-serif;font-weight:600;font-size:16px;margin:0 0 12px;}
.table-panel .head,.app-card .head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;}
.table-panel .head h3{margin:0;}

.activity-row{display:flex;align-items:center;gap:13px;padding:12px 0;
  border-bottom:1px solid var(--hair);font-size:13px;width:100%;background:none;border-left:none;
  border-right:none;border-top:none;text-align:left;color:var(--ink);font-family:'Inter',sans-serif;
  cursor:pointer;min-height:var(--tap);}
.activity-row:last-child{border-bottom:none;}
.activity-row:active{opacity:.6;}
.activity-row:disabled{cursor:default;opacity:1;}
.ar-i{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--dough);
  display:flex;align-items:center;justify-content:center;}
.ar-i.ok{background:var(--green-bg);} .ar-i.warn{background:var(--amber-bg);}
.ar-i.high{background:var(--seal-blush);}
.ar-m{flex:1 1 auto;min-width:0;display:block;}
.ar-t{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;}
.ar-s{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
.ar-v{display:block;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.ar-v.high{color:var(--red-ink);} .ar-v.ok{color:var(--green);} .ar-v.none{color:var(--muted);opacity:.5;}

.status{font-size:11px;font-weight:700;padding:5px 11px;border-radius:100px;flex:0 0 auto;
  white-space:nowrap;color:#141414;}
.status.ok{background:var(--lime);}
.status.warn{background:var(--mustard);}
.status.high{background:var(--blush);color:var(--navy);}
.status.mute{background:var(--dough);color:var(--muted);}

/* ---------- botões ---------- */
.btn-add{background:var(--red);color:var(--on-red);border:none;border-radius:100px;
  padding:10px 20px;font-size:14px;font-weight:600;display:flex;align-items:center;
  justify-content:center;gap:8px;cursor:pointer;font-family:'Inter',sans-serif;
  transition:transform .09s ease;}
.btn-add.wide{width:100%;min-height:var(--tap);font-size:15.5px;}
.btn-add.ink{background:var(--ink);color:var(--white);}
.btn-add:active{transform:scale(.98);}
.btn-add:disabled{opacity:.4;transform:none;}

.qa-btn{width:100%;text-align:left;background:var(--dough);border:none;border-radius:16px;
  padding:14px 16px;font-size:14px;font-weight:600;margin-bottom:8px;cursor:pointer;
  color:var(--ink);font-family:'Inter',sans-serif;min-height:var(--tap);
  display:flex;align-items:center;gap:12px;}
.qa-btn:last-child{margin-bottom:0;}
.qa-btn.primary{background:var(--red);color:var(--on-red);}
.qa-btn:active{transform:scale(.985);}
.qa-btn > span{display:block;flex:1;min-width:0;}
.qa-btn small{display:block;font-weight:400;color:var(--muted);margin-top:2px;font-size:12px;}
.qa-btn.primary small{color:rgba(255,255,255,.8);}
.page > .screen > .qa-btn{background:var(--white);box-shadow:var(--card-shadow);}

.cat-chip{display:flex;align-items:center;gap:9px;flex-shrink:0;background:var(--dough);
  border:none;border-radius:100px;padding:8px 18px 8px 8px;cursor:pointer;
  font-family:'Inter',sans-serif;color:var(--ink);min-height:48px;}
.cat-chip:not(:has(.circle)){padding-left:18px;}
.cat-chip.active{background:var(--ink);color:var(--white);}
.cat-chip .circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;background:var(--white);color:var(--ink);}
.cat-chip span{font-weight:600;font-size:14px;white-space:nowrap;}

/* ---------- folha inferior ---------- */
.gioco-modal-overlay{position:absolute;inset:0;background:rgba(20,18,14,.45);z-index:80;
  opacity:0;pointer-events:none;transition:opacity .2s;}
.gioco-modal-overlay.aberto{opacity:1;pointer-events:auto;}
.gioco-modal{position:absolute;left:0;right:0;bottom:0;z-index:81;background:var(--white);
  border-radius:28px 28px 0 0;padding:0 0 calc(28px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,0.22);
  max-height:90%;overflow-y:auto;transform:translateY(101%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);}
.gioco-modal.aberto{transform:translateY(0);}
.gioco-modal::before{content:'';display:block;width:40px;height:4px;border-radius:2px;
  background:var(--key-shadow);margin:10px auto 0;}
.gioco-modal-head{display:flex;align-items:center;gap:12px;padding:12px 20px 16px;
  position:sticky;top:0;background:var(--white);z-index:2;}
.gioco-modal-titulo{flex:1;margin:0;font-family:'Antonio',sans-serif;font-weight:600;font-size:24px;
  letter-spacing:-.005em;}
.gioco-modal-close{width:44px;height:44px;border-radius:50%;flex-shrink:0;
  border:none;background:var(--dough);color:var(--ink);display:flex;
  align-items:center;justify-content:center;cursor:pointer;padding:0;}
.gioco-modal-close.hidden{display:none;}
.gioco-modal-body{font-size:13.5px;line-height:1.5;padding:0 20px;}

/* ---------- barra inferior: fixa, "Hoje" elevado ao centro ----------
   O botão central é --ink, não --red: o vermelho fica para a ação
   principal de cada ecrã e para urgência. */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:70;background:var(--white);
  border-radius:24px 24px 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 14px rgba(20,18,14,.07);}
[data-theme="dark"] .tabbar{box-shadow:0 -1px 0 var(--hair);}
.tabbar nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;}
.nav-row{border:none;background:none;cursor:pointer;color:var(--muted);
  font-family:'Inter',sans-serif;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:5px;padding:6px 2px;min-height:54px;
  transition:color .15s ease;}
.nav-row span{font-size:11px;font-weight:600;}
.nav-row.active{color:var(--ink);}
.nav-row .ping{position:absolute;top:4px;right:calc(50% - 17px);width:8px;height:8px;
  border-radius:50%;background:var(--red);border:2px solid var(--white);box-sizing:content-box;}
.nav-row.center .bubble{width:60px;height:60px;border-radius:50%;background:var(--ink);
  color:var(--white);display:flex;align-items:center;justify-content:center;
  margin-top:-34px;border:4px solid var(--white);box-sizing:content-box;
  box-shadow:0 8px 18px rgba(20,18,14,.22);transition:transform .09s ease;}
.nav-row.center:active .bubble{transform:translateY(2px);}
.nav-row.center .bubble{font-size:0;}

/* ---------- ecrãs ---------- */
.main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(124px + env(safe-area-inset-bottom));}
.screen{display:none;} .screen.active{display:block;}

/* ============================================================
   ESPECÍFICO DA LOJA
   ============================================================ */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-bottom:4px;}
.key{min-height:var(--tap);border:none;border-radius:18px;background:var(--dough);
  font-family:'Inter',sans-serif;font-size:21px;font-weight:600;cursor:pointer;color:var(--ink);
  font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--key-shadow);
  transition:transform .07s ease,box-shadow .07s ease;}
.key:active{background:var(--ink);color:var(--white);transform:translateY(2px);
  box-shadow:0 1px 0 var(--key-shadow);}
.readout{background:var(--dough);border-radius:20px;text-align:center;padding:22px 12px;
  font-weight:700;font-size:42px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.readout small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;
  letter-spacing:0;}
.readout.sm{font-size:30px;padding:16px 12px;}
.field{margin-bottom:16px;}
.field-label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:8px;}
.input,.select,.textarea{width:100%;border:1.5px solid transparent;border-radius:16px;
  background:var(--dough);padding:14px 16px;font-family:'Inter',sans-serif;font-size:16px;
  color:var(--ink);min-height:var(--tap);}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);outline:none;}
.input::placeholder,.textarea::placeholder{color:var(--muted);}
.textarea{min-height:90px;resize:none;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--tap);border:none;
  border-radius:16px;background:var(--dough);padding:14px 16px;margin-bottom:8px;text-align:left;
  font-size:14.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;color:var(--ink);}
.opt-row.active{background:var(--ink);color:var(--white);}
.opt-row > span{display:block;flex:1;min-width:0;}
.opt-row small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px;}
.opt-row.active small{color:inherit;opacity:.7;}
.check-row > span:last-child{display:block;flex:1;min-width:0;}
.check-row{display:flex;align-items:center;gap:14px;padding:12px 0;min-height:var(--tap);
  border-bottom:1px solid var(--hair);width:100%;background:none;border-left:none;border-right:none;
  border-top:none;text-align:left;font-size:14.5px;line-height:1.4;color:var(--ink);
  font-family:'Inter',sans-serif;cursor:pointer;}
.check-row:last-of-type{border-bottom:none;}
.cbox{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--key-shadow);
  display:flex;align-items:center;justify-content:center;background:var(--white);}
.check-row.done .cbox{background:var(--green);border-color:var(--green);}
.check-row.done{color:var(--muted);}
.bar{height:5px;border-radius:100px;background:var(--dough);overflow:hidden;margin-bottom:14px;}
.bar span{display:block;height:100%;background:var(--red);border-radius:100px;transition:width .25s;}
.msg{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:13.5px;line-height:1.5;}
.msg b{display:block;font-weight:700;margin-bottom:4px;}
.msg.warn{background:var(--amber-bg);color:var(--amber);}
.msg.high{background:var(--seal-blush);color:var(--on-seal);}
.msg.ok{background:var(--green-bg);color:var(--green);}
.msg.mute{background:var(--dough);color:var(--muted);}
/* passos do assistente: concluído a vermelho, por vir a cinza claro */
.steps{display:flex;gap:6px;margin-bottom:18px;}
.step{flex:1;height:5px;border-radius:100px;background:var(--dough);}
.step.on{background:var(--red);}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:13.5px;line-height:1.5;}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:12px 2px 0;}
.split{display:flex;}
.split > div{flex:1;padding:14px 8px 18px;text-align:center;}
.split > div + div{border-left:1px solid var(--hair);}
.split .n{font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;}
.split .n.ok{color:var(--green);} .split .n.warn{color:var(--amber);}
.split .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px;}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--muted);}
.kv span:last-child{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;}
.kv.tot{border-top:1px solid var(--hair);margin-top:7px;padding-top:10px;color:var(--ink);font-weight:700;}
.kv.warn span:last-child{color:var(--amber);}
.toast{position:absolute;bottom:calc(116px + env(safe-area-inset-bottom));
  left:20px;right:20px;background:var(--ink);color:var(--white);padding:15px 18px;
  font-size:13.5px;z-index:90;line-height:1.45;border-radius:16px;opacity:0;
  transform:translateY(10px);transition:all .22s;pointer-events:none;}
.toast.on{opacity:1;transform:none;}
/* ---- estado de rede / fila de envio ---- */
.netbar{display:flex;align-items:center;gap:12px;padding:13px 16px;margin:0 0 16px;
  border-radius:16px;background:var(--amber-bg);color:var(--amber);font-size:13.5px;
  font-weight:500;line-height:1.4;}
.netbar b{display:block;font-weight:700;}
/* ---- contagem decrescente para o prazo ---- */
.countdown{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:16px;
  border-radius:20px;background:var(--amber-bg);color:var(--amber);}
.countdown.urg{background:var(--red);color:var(--on-red);}
.countdown .n{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.countdown .t{font-size:13.5px;font-weight:600;line-height:1.4;}
.countdown .t small{display:block;font-weight:400;opacity:.9;margin-top:2px;font-size:12.5px;}
.activity-row.pressing .ar-t{font-size:16px;}
.activity-row.pressing{padding:15px 0;}
/* ---- pré-visualização de notificação ---- */
.notif{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:95;border-radius:20px;
  padding:14px 16px;background:var(--white);
  box-shadow:0 12px 34px rgba(20,20,20,.2);transform:translateY(-140%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);display:flex;gap:12px;align-items:flex-start;
  cursor:pointer;}
.notif.on{transform:translateY(0);}
.notif-i{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;}
.notif-t{font-size:14px;font-weight:700;}

<script>
/* ============ ÍCONES — outline, stroke 2, round (como o shell) ============ */

 abertura:{n:'Checklist de abertura',i:[

};

 {id:'f2',n:'BIDFOOD',frio:true,dias:[2,5],de:'07:30',ate:'10:00'},
 {id:'f3',n:'SOGENAVE',frio:true,dias:[3],de:'09:00',ate:'13:00'},
 {id:'f4',n:'SUPER BOCK',frio:false,dias:[4],de:'14:00',ate:'18:00'},

];

];

 '2026-08-15':'Assunção','2026-10-05':'Implantação da República','2026-11-01':'Todos os Santos',

 '2027-01-01':'Ano Novo','2027-03-26':'Sexta-feira Santa','2027-04-25':'Liberdade',

/* ============ ESTADO ============ */
/* DEMO só conta quando DEMO.ativo === true (barra de simulação aberta e
   uma escolha feita). Por omissão a app corre sobre o relógio do telemóvel. */
var DEMO={ativo:false,dia:4,hora:9,min:40};
var user=null,pinBuf='',alvo=null;
var emTurno=false,tIn=null,tick=null,hLog='',hDur='00:00:00',hHora='';
var TAB='hoje',chkAberto=false;
var tmp={},wiz=null,pv=null,mBackFn=null;

/* ============ TEMPO ============
   hm(), ag() e dow() são a ÚNICA porta para a hora: tudo o resto (rondas,
   prazos, pressão, turnos, entregas) corre por cima delas. Em hora real
   leem o relógio do sistema; em hora simulada leem o DEMO. */
function p2(n){return n<10?'0'+n:''+n;}
function agora(){
 var d=new Date();
 if(DEMO.ativo){d.setHours(DEMO.hora,DEMO.min,0,0);}
 return d;
}
function hm(){var d=agora();return p2(d.getHours())+':'+p2(d.getMinutes());}
function mn(s){var a=s.split(':');return +a[0]*60+ +a[1];}
function ag(){var d=agora();return d.getHours()*60+d.getMinutes();}
function dow(){return DEMO.ativo?DEMO.dia:new Date().getDay();}

/* ============ REDE E FILA DE ENVIO ============
   Sem rede a app grava no telemóvel e marca o registo como por enviar.
   Nunca finge que gravou no servidor. */
function rede(){
 NET.online=!NET.online;
 document.getElementById('nBtn').textContent=NET.online?'Rede':'Sem rede';
 if(NET.online&&NET.fila>0){
  var n=NET.fila;
  EQUIP.forEach(function(e){['manha','noite'].forEach(function(r){
   if(e[r])e[r].sync=true;});});
  ENTRADAS.forEach(function(x){x.sync=true;});
  NET.fila=0;render();
  toast(n+' registo'+(n>1?'s':'')+' enviado'+(n>1?'s':'')+' agora que há ligação');
 } else render();
}
function fila(){
 if(NET.online)return '';
 return '<div class="netbar"><span>'+ic('alert','var(--amber)',20)+'</span>'+
  '<span><b>Sem ligação</b>'+(NET.fila
   ?NET.fila+' registo'+(NET.fila>1?'s':'')+' guardado'+(NET.fila>1?'s':'')+
    ' no telemóvel · sobem assim que houver rede'
   :'Podes continuar a trabalhar — nada se perde')+'</span></div>';
}

/* ============ REGRAS DE RONDA ============ */
function tFalta(r){r=r||ronda();return EQUIP.filter(function(e){return !e[r];}).length;}
function tAlerta(r){r=r||ronda();return EQUIP.filter(function(e){return e[r]&&e[r].v>e.lim;}).length;}
function rondaOk(r){var k=r==='manha'?'abertura':'fecho';
 return tFalta(r)===0&&CHK[k].f.length===CHK[k].i.length;}
function est(r){var m=ag(),j=JAN[r];
 if(m<mn(j.abre))return 'fechada';
 if(m<=mn(j.lim))return 'aberta';
 return 'tarde';}
function ronda(){var m=ag();
 if(m<mn('12:00'))return 'manha';
 if(m<mn(JAN.noite.abre))return rondaOk('manha')?'noite':'manha';
 return 'noite';}
function pode(r){return est(r)!=='fechada';}
function faltaPrazo(r){return mn(JAN[r].lim)-ag();}   /* minutos até ao limite */
function pressao(r){
 if(est(r)!=='aberta')return '';
 var m=faltaPrazo(r);
 if(m<=10)return 'urg';
 if(m<=30)return 'warn';
 return '';
}
function tarde(r){return est(r)==='tarde';}
function turno(){
 var m=ag(),b=TURNOS[0],d=1e9;
 TURNOS.forEach(function(t){
  var x=(m>=mn(t.i)-60&&m<=mn(t.f)+60)?0:Math.min(Math.abs(m-mn(t.i)),Math.abs(m-mn(t.f)));
  if(x<d){d=x;b=t;}});
 return b;
}
function entregas(){
 return FORN.filter(function(f){return f.dias.indexOf(dow())>-1;}).map(function(f){
  var r=ENTRADAS.filter(function(e){return e.f===f.n;})[0];
  return {f:f,e:r?'recebida':(ag()>mn(f.ate)?'atraso':'espera'),r:r};});
}

  (right||'')+'</button>';
}

function lancadores(){

/* ============ NAVEGAÇÃO ============ */
/* Hoje ao centro e elevado: é o ecrã de regresso */
var NAV=[['registos','Registos','temp'],['entradas','Entradas','box'],
         ['hoje','Hoje','clock'],
         ['pedidos','Pedidos','note'],['turnos','Turnos','cal']];

   ic(t[2],null,22)+'<span>'+t[1]+'</span></button>';
 }).join('');
}
function go(id){
 TAB=id;chkAberto=false;
 document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
 document.getElementById('sc-'+id).classList.add('active');
 document.querySelector('.main').scrollTop=0;
 render();
}

/* ============ PICAGEM ============ */
function picar(){
 var t=turno();
 if(!emTurno){
  var d=ag()-mn(t.i);
  if(Math.abs(d)>15)return motivo('in',
   d<0?'Faltam '+Math.abs(d)+' min para o turno começar ('+t.i+').'
      :'O turno começou há '+d+' min ('+t.i+').',
   d<0?['Cheguei mais cedo','Vim substituir alguém','O turno mudou']
      :['Cheguei atrasado','Esqueci-me de picar','O turno mudou']);
  entrar(null);
 } else {
  var s=ag()-mn(t.f);
  if(s<-15)return motivo('out','Faltam '+Math.abs(s)+' min para o fim do turno ('+t.f+').',
   ['Fui dispensado','Troquei com colega','Outro motivo']);
  sairTurno(null);
 }
}
function motivo(tipo,txt,ops){
 modal(tipo==='in'?'Entrada fora do previsto':'Saída antecipada',
  '<div class="msg warn"><b>Confere antes de picar</b>'+txt+'</div>'+
  ops.map(function(o){return '<button class="opt-row" onclick="okMotivo(\''+tipo+'\',\''+o+'\')">'+
   '<span>'+o+'</span></button>';}).join('')+
  '<p class="note">O motivo fica no registo. Não bloqueia a picagem.</p>');
}
function okMotivo(t,m){fecharModal();t==='in'?entrar(m):sairTurno(m);}
function entrar(m){
 emTurno=true;tIn=Date.now();hHora=hm();
 hLog='<div class="kv"><span>Entrada</span><span>'+hm()+'</span></div>'+
  (m?'<div class="kv warn"><span>Motivo</span><span>'+m+'</span></div>':'');
 render();toast('Entrada registada às '+hm());
}
function sairTurno(m){
 var el=document.getElementById('cron');hDur=el?el.textContent:hDur;
 emTurno=false;clearInterval(tick);
 hLog+='<div class="kv"><span>Saída</span><span>'+hm()+'</span></div>'+
  (m?'<div class="kv warn"><span>Motivo</span><span>'+m+'</span></div>':'')+
  '<div class="kv tot"><span>Total</span><span>'+hDur+'</span></div>';
 render();toast('Saída registada · '+hDur+' neste turno');
}
function cron(){
 clearInterval(tick);
 tick=setInterval(function(){
  var el=document.getElementById('cron');
  if(!el||!emTurno)return clearInterval(tick);
  var s=Math.floor((Date.now()-tIn)/1000);
  el.textContent=p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60);
 },1000);
}

function abrirChk(k){
 var r=CHK_R[k];
 if(!pode(r))return toast(CHK[k].n+' só abre às '+JAN[r].abre);
 if(TAB!=='registos'){TAB='registos';go('registos');}
 chkAberto=true;renderRegistos();
}
function tog(k,i){
 var f=CHK[k].f,x=f.indexOf(i);
 if(x>-1)f.splice(x,1);else f.push(i);
 chkAberto=true;renderRegistos();renderHoje();
}
function fecharChk(k){
 chkAberto=false;render();
 toast(CHK[k].n+' concluída às '+hm()+(tarde(CHK_R[k])?' · fora de prazo':''));
}
function abrirTemp(id){
 var r=ronda();
 if(!pode(r))return toast('Os registos só abrem às '+JAN[r].abre);
 var e=EQUIP.filter(function(x){return x.id===id;})[0];
 tmp={e:e,v:'',foto:false};
 modal(e.n.split(' ').slice(0,3).join(' '),
  (tarde(r)?'<div class="msg warn"><b>Fora de prazo</b>O prazo era '+JAN[r].lim+
   '. O registo vai ficar assinalado.</div>':'')+
  '<div class="readout" id="ro">--.-°<small>limite '+e.lim+'°</small></div>'+
  '<div class="pad">'+numPad('tk',true)+'</div>'+
  '<div class="field" style="margin-top:18px"><span class="field-label">Foto do termómetro · obrigatória</span>'+
  '<button class="qa-btn" id="fb" onclick="fotoTemp()">'+ic('cam',null,20)+'<span>Tirar foto</span></button></div>'+
  '<button class="btn-add wide" id="tsave" disabled onclick="salvaTemp()">Registar temperatura</button>'+
  '<p class="note">Sem foto o registo não é aceite. Fica em teu nome, com hora automática.</p>');
}
function numPad(fn,neg){
 return ['1','2','3','4','5','6','7','8','9',neg?'−':'','0','←'].map(function(k){
  return k?'<button class="key" onclick="'+fn+'(\''+k+'\')">'+k+'</button>':'<div></div>';}).join('');
}
function tk(k){
 if(k==='←')tmp.v=tmp.v.slice(0,-1);
 else if(k==='−')tmp.v=tmp.v.charAt(0)==='-'?tmp.v.slice(1):'-'+tmp.v;
 else if(tmp.v.replace('-','').length<3)tmp.v+=k;
 var v=tmp.v,s=(v===''||v==='-')?'--.-°'
  :(parseInt(v.replace('-',''),10)/10*(v.charAt(0)==='-'?-1:1)).toFixed(1)+'°';
 document.getElementById('ro').innerHTML=s+'<small>limite '+tmp.e.lim+'°</small>';
 document.getElementById('tsave').disabled=(v===''||v==='-'||!tmp.foto);
}
function fotoTemp(){
 tmp.foto=true;
 var b=document.getElementById('fb');
 b.className='qa-btn primary';b.innerHTML=ic('check','#fff',20)+'<span>Foto guardada</span>';
 document.getElementById('tsave').disabled=(tmp.v===''||tmp.v==='-');
 toast('Foto guardada com o registo');
}
/* Um valor errado é pior do que um valor em falta: parece correcto. */
function plausivel(e,n){
 var ref=e.manha?e.manha.v:e.lim;
 if(e.lim<0)return n>=-40&&n<=-5;
 return n>=-5&&n<=20&&Math.abs(n-ref)<=12;
}
function salvaTemp(){
 var n=parseInt(tmp.v.replace('-',''),10)/10*(tmp.v.charAt(0)==='-'?-1:1);
 if(!plausivel(tmp.e,n))return confirmaTemp(n);
 gravaTemp(n);
}
function confirmaTemp(n){
 var e=tmp.e,ref=e.manha?e.manha.v.toFixed(1)+'° esta manhã':'limite '+e.lim+'°';
 modal('Confirma o valor',
  '<div class="msg warn"><b>'+n.toFixed(1)+'° parece fora do normal</b>'+
  e.n+' costuma andar perto de '+ref+'. Se o valor estiver certo, o equipamento '+
  'pode estar avariado — e isso é para comunicar já.</div>'+
  '<button class="btn-add wide ink" onclick="voltaTeclado()">Corrigir o valor</button>'+
  '<button class="qa-btn" style="margin-top:10px" onclick="gravaTemp('+n+',true)">'+
   ic('check',null,20)+'<span>O valor está certo<small>fica assinalado como anomalia</small></span></button>');
}
function voltaTeclado(){abrirTemp(tmp.e.id);}
function gravaTemp(n,anomalia){
 var r=ronda();
 tmp.e[r]={v:n,h:hm(),fora:tarde(r),sync:NET.online,anom:!!anomalia};
 if(!NET.online)NET.fila++;
 fecharModal();render();
 if(anomalia)toast('Registado '+n.toFixed(1)+'° · anomalia comunicada ao Alfredo');
 else toast((n>tmp.e.lim?'Atenção: '+n.toFixed(1)+'° acima do limite — avisa o Alfredo'
  :'Registado '+n.toFixed(1)+'° · '+tmp.e.n.split(' ')[0])+(NET.online?'':' · por enviar'));
 if(anomalia)PEDIDOS.unshift({t:'Leitura anómala: '+tmp.e.n+' a '+n.toFixed(1)+'°',
  c:'HACCP · equipamento',e:'novo',q:user.n,w:'agora'});
}

function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dc(s){var a=s.split('-');return (+a[2])+' '+MES[+a[1]-1];}
function conta(de,ate){
 var d=new Date(de+'T00:00:00'),f=new Date(ate+'T00:00:00'),cal=0,u=0,fer=[],fds=0;
 while(d<=f){cal++;var i=iso(d),w=d.getDay();
  if(w===0||w===6)fds++;else if(FERIADOS[i])fer.push({i:i,n:FERIADOS[i]});else u++;
  d.setDate(d.getDate()+1);}
 return {cal:cal,u:u,fer:fer,fds:fds};
}

 var box=document.getElementById('fRes'),btn=document.getElementById('fS');
 if(!de||!ate){box.innerHTML='';btn.disabled=true;return;}

  btn.disabled=true;return;}
 var r=conta(de,ate),livre=SALDO.direito-SALDO.gozados-SALDO.marcados;

 if(r.u>livre)h+='<div class="msg warn"><b>Ultrapassa o saldo</b>São '+(r.u-livre)+
  ' dia(s) além do que tens. Podes enviar — o Alfredo decide.</div>';
 if(ant>=0&&ant<15)h+='<div class="msg warn"><b>Pouca antecedência</b>Faltam '+ant+
  ' dias. Pode ser difícil arranjar cobertura.</div>';
 if(ant<0)h+='<div class="msg high"><b>Data no passado</b>O primeiro dia já passou.</div>';
 if(r.u===0)h+='<div class="msg mute"><b>Nada a marcar</b>Só apanhaste fins de semana e feriados.</div>';
 box.innerHTML=h;btn.disabled=(r.u===0||ant<0);

 document.getElementById('notifI').innerHTML=ic('alert','#fff',20);
 document.getElementById('notifT').textContent=titulo;
 document.getElementById('notifS').textContent=texto;
 document.getElementById('notif').classList.add('on');
 clearTimeout(notifT);
 notifT=setTimeout(function(){
  document.getElementById('notif').classList.remove('on');},6000);
 if(navigator.vibrate)navigator.vibrate([14,60,14]);
}
function abrirNotif(){
 document.getElementById('notif').classList.remove('on');
 if(notifAlvo)go(notifAlvo);
}
/* dispara uma vez por ronda, aos 20 minutos do prazo */
function verificaAvisos(){
 var r=ronda();
 if(est(r)!=='aberta')return;
 var m=faltaPrazo(r),k=r==='manha'?'abertura':'fecho';
 var falta=tFalta(r),feita=CHK[k].f.length===CHK[k].i.length;
 if(falta===0&&feita)return;
 var chave=r+'-20';
 if(m<=20&&m>0&&!avisado[chave]){
  avisado[chave]=true;
  var o=[];
  if(falta>0)o.push(falta+' temperatura'+(falta>1?'s':''));
  if(!feita)o.push('checklist de '+(r==='manha'?'abertura':'fecho'));
  notificar('Faltam '+m+' minutos',o.join(' e ')+' por concluir antes das '+JAN[r].lim+'.','registos');
 }
}

/* ============ MODAL / TOAST ============ */
function modal(t,html,back){
 document.getElementById('mTitle').textContent=t;
 document.getElementById('mBody').innerHTML=html;
 mBackFn=back||null;
 document.getElementById('mBack').classList.toggle('hidden',!mBackFn);
 document.getElementById('modal').classList.add('aberto');
 document.getElementById('ovl').classList.add('aberto');
 document.getElementById('modal').scrollTop=0;
}
function modalAberto(){return document.getElementById('modal').classList.contains('aberto');}
function modalBack(){if(mBackFn)mBackFn();}
function fecharModal(){
 document.getElementById('modal').classList.remove('aberto');
 document.getElementById('ovl').classList.remove('aberto');
 mBackFn=null;document.getElementById('mBack').classList.add('hidden');
}
var tt=null;
function toast(m){
 var el=document.getElementById('toast');
 el.textContent=m;el.classList.add('on');
 clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on');},2800);
}

/* ============ ENTRADA ============ */
function ini(n){return n.slice(0,2).toUpperCase();}
function renderPeople(){
 document.getElementById('people').innerHTML=PESSOAS.map(function(p){
  return '<button class="p-row" onclick="escolhe(\''+p.id+'\')">'+
   '<span class="avatar" style="background:'+p.c+'">'+ini(p.n)+'</span>'+
   '<span class="p-n"><b>'+p.n+'</b><small>'+p.f+'</small></span>'+
   ic('chev','var(--muted)',20)+'</button>';}).join('');
 document.getElementById('pBack').innerHTML=ic('back',null,18);
 ctxLogin();
}
function escolhe(id){
 alvo=PESSOAS.filter(function(p){return p.id===id;})[0];pinBuf='';
 document.getElementById('lStep1').style.display='none';
 var e2=document.getElementById('lStep2');
 e2.style.display='block';
 e2.classList.remove('lstep');void e2.offsetWidth;e2.classList.add('lstep');
 var a=document.getElementById('pAv');
 a.textContent=ini(alvo.n);a.style.background=alvo.c;
 document.getElementById('pNome').textContent=alvo.n;
 document.getElementById('pFn').textContent=alvo.f+' · PIN de 6 dígitos';
 dots();
 document.getElementById('pinPad').innerHTML=numPad('kp');
}
/* contexto da loja antes de haver sessão — não revela nada de ninguém */
function ctxLogin(){
 var d=agora(),hh=d.getHours();
 document.getElementById('lSaud').textContent=
  hh<12?'Bom dia':(hh<19?'Boa tarde':'Boa noite');
 document.getElementById('lHora').textContent=
  DIAS[dow()]+', '+d.getDate()+' '+MES[d.getMonth()]+' · '+hm();
 var r=ronda(),e=est(r),j=JAN[r],el=document.getElementById('lCtx');
 var t=turno();
 if(e==='aberta'){
  var m=faltaPrazo(r);
  el.innerHTML=kpi(m<=30?SEAL.mustard:SEAL.sky,j.n,r==='manha'?'sun':'moon',
   {v:m<=30?'Faltam '+m+' min':'Prazo '+j.lim},
   'Turno em curso <b>'+t.i+'–'+t.f+'</b>');
 } else if(e==='fechada'){
  el.innerHTML=kpi(SEAL.cream,j.n,'lock',{v:'Abre às '+j.abre},
   'Os registos desta ronda abrem às '+j.abre+'. Turno <b>'+t.i+'–'+t.f+'</b>.');
 } else {
  el.innerHTML=kpi(SEAL.blush,j.n,'alert',{v:'Fora de prazo'},
   'O prazo era <b>'+j.lim+'</b>. Há registos por concluir.');
 }
}
function dots(){var h='';for(var i=0;i<6;i++)h+='<div class="pdot'+(i<pinBuf.length?' on':'')+'"></div>';
 document.getElementById('pdots').innerHTML=h;}
function kp(k){
 if(k==='←'){if(!pinBuf.length)return voltarPessoas();pinBuf=pinBuf.slice(0,-1);}
 else if(pinBuf.length<6)pinBuf+=k;
 dots();
 if(pinBuf.length===6){
  /* no mockup, 000000 demonstra o PIN errado */
  if(pinBuf==='000000')return setTimeout(pinErrado,180);
  setTimeout(entrarApp,170);
 }
}
function pinErrado(){
 var d=document.getElementById('pdots');
 d.classList.add('erro');
 if(navigator.vibrate)navigator.vibrate([30,60,30]);
 setTimeout(function(){d.classList.remove('erro');pinBuf='';dots();},600);
}
function voltarPessoas(){
 document.getElementById('lStep2').style.display='none';
 var e1=document.getElementById('lStep1');
 e1.style.display='block';
 e1.classList.remove('lstep');void e1.offsetWidth;e1.classList.add('lstep');
 pinBuf='';
}
function entrarApp(){
 user=alvo;
 document.getElementById('login').classList.add('hidden');
 var a=document.getElementById('gAv');
 a.textContent=ini(user.n);a.style.background=user.c;
 boot();
}
function sair(){
 user=null;pinBuf='';emTurno=false;hLog='';hDur='00:00:00';
 if(tick)clearInterval(tick);
 voltarPessoas();
 document.getElementById('login').classList.remove('hidden');
 ctxLogin();TAB='hoje';
 document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
 document.getElementById('sc-hoje').classList.add('active');
}

/* ============ SIMULAÇÃO (escondida por omissão) ============
   5 toques seguidos (< 1,5 s entre cada) na faixa "Versão de teste" ou no
   rodapé abrem a barra. A hora simulada só entra em vigor quando se escolhe
   um dia ou uma hora na barra, e dura até recarregar a página. */
var DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var toques=0,toqueT=null;
function toqueSecreto(){
 toques++;clearTimeout(toqueT);
 toqueT=setTimeout(function(){toques=0;},1500);
 if(toques>=5){toques=0;mostrarDemobar();}
}
function mostrarDemobar(){
 var b=document.getElementById('demobar');
 if(b.classList.contains('on'))return;
 initDemo();b.classList.add('on');
 toast('Barra de simulação aberta · escolhe dia ou hora para simular');
}
function initDemo(){
 var d=agora();
 /* a barra arranca na hora e dia actuais (reais ou já simulados) */
 var dia=dow(),hora=d.getHours(),min=Math.floor(d.getMinutes()/20)*20;
 document.getElementById('dDia').innerHTML=DN.map(function(n,i){
  return '<option value="'+i+'"'+(i===dia?' selected':'')+'>'+n+'</option>';}).join('');
 var h='';
 for(var t=0;t<=23;t++)for(var m=0;m<60;m+=20)
  h+='<option value="'+t+':'+m+'"'+((t===hora&&m===min)?' selected':'')+'>'+
   p2(t)+':'+p2(m)+'</option>';
 document.getElementById('dHora').innerHTML=h;
}
function setDemo(){
 DEMO.ativo=true;
 DEMO.dia=+document.getElementById('dDia').value;
 var a=document.getElementById('dHora').value.split(':');
 DEMO.hora=+a[0];DEMO.min=+a[1];
 refrescar();
}
function tema(){
 var d=document.documentElement.getAttribute('data-theme')==='dark';
 document.documentElement.setAttribute('data-theme',d?'light':'dark');
 document.getElementById('tBtn').textContent=d?'Escuro':'Claro';
}

/* ============ RENDER ============ */
function render(){
 var d=agora();
 document.getElementById('gTitle').textContent=TAB==='hoje'
  ?'Olá, '+user.n:NAV.filter(function(t){return t[0]===TAB;})[0][1];
 document.getElementById('gSub').textContent=DIAS[dow()]+', '+d.getDate()+' '+MES[d.getMonth()]+' · '+hm();
 renderHoje();renderRegistos();renderEntradas();renderPedidos();renderTurnos();renderNav();
 verificaAvisos();
}
function boot(){render();}

/* ============ RELÓGIO ============
   A app actualiza-se sozinha a cada 60 s e quando a página volta a estar
   visível, para o countdown e os estados não ficarem congelados. O render
   só toca nos ecrãs de fundo: uma folha aberta nunca é fechada nem
   redesenhada (o modal vive em #modal, fora dos .screen). */
function refrescar(){
 if(!document.getElementById('login').classList.contains('hidden'))return ctxLogin();
 if(!user)return;
 render();
}
setInterval(refrescar,60000);
document.addEventListener('visibilitychange',function(){
 if(document.visibilityState==='visible')refrescar();
});
renderPeople();
</script>
