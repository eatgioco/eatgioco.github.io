<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<!-- Excepção ao padrão desktop-only do OS: a grelha de turnos tem de ser usável ao balcão/telemóvel -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIOCO · Equipa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
    --green:#1E7A46;
    --amber:#B8860B;
    --blue:#1D5C8A;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .home-link{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--white);
    text-decoration:none;
    border:2px solid var(--white);
    padding:6px 10px;
    white-space:nowrap;
  }

  .home-link:hover{
    background:var(--white);
    color:var(--red);
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:40px 24px 80px;
  }

  .page-title{
    margin:0;
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .page-subtitle{
    margin:8px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .section{
    margin-top:36px;
  }

  .section-title{
    margin:0 0 12px;
    font-size:13px;
    font-family:'Space Mono', monospace;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .empty-state{
    text-align:center;
    padding:20px 16px;
    color:var(--muted);
    font-size:13px;
  }

  .btn-registar{
    padding:11px 20px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    background:var(--black);
    color:var(--white);
    border:2px solid var(--black);
    cursor:pointer;
  }

  .btn-registar:hover{
    background:var(--red);
    border-color:var(--red);
  }

  /* ---------- Pessoas ---------- */
  .pessoas-list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap:12px;
  }

  .pessoa-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--white);
    border:2px solid var(--line);
    padding:12px;
  }

  .pessoa-color-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    flex-shrink:0;
    border:1px solid rgba(0,0,0,0.15);
  }

  .pessoa-info{
    flex:1;
    min-width:0;
  }

  .pessoa-nome{
    font-weight:700;
    font-size:14px;
  }

  .pessoa-funcao{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }

  .pessoa-contacts{
    display:flex;
    gap:14px;
    margin-top:6px;
    flex-wrap:wrap;
  }

  .pessoa-contacts a{
    font-size:12px;
    color:var(--black);
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }

  .pessoa-contacts a:hover{
    border-color:var(--red);
    color:var(--red);
  }

  .btn-editar-pessoa{
    background:none;
    border:2px solid var(--line);
    width:34px;
    height:34px;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }

  .btn-editar-pessoa:hover{
    border-color:var(--black);
  }

  .inactive-details{
    margin-top:16px;
  }

  .inactive-details summary{
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  /* ---------- Turnos ---------- */
  .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
  }

  .week-nav-btn{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
    padding:9px 14px;
    border:2px solid var(--black);
    background:var(--white);
    cursor:pointer;
  }

  .week-nav-btn:hover{
    background:var(--black);
    color:var(--white);
  }

  .week-label{
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    min-width:170px;
    text-align:center;
  }

  .btn-hoje{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:9px 16px;
    border:2px solid var(--black);
    background:var(--white);
    cursor:pointer;
  }

  .btn-hoje:hover{
    background:var(--black);
    color:var(--white);
  }

  /* ---------- Grelha semanal ---------- */
  .grelha-wrap{
    margin-top:14px;
    border:3px solid var(--black);
    background:var(--white);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }

  .grelha{
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
    width:100%;
    min-width:860px;
  }

  .grelha th,
  .grelha td{
    padding:0;
    vertical-align:top;
    border-right:2px solid var(--line);
    border-bottom:2px solid var(--line);
  }

  .grelha tr > *:last-child{
    border-right:none;
  }

  .grelha tbody tr:last-child > *{
    border-bottom:none;
  }

  .col-label{
    width:112px;
  }

  .grelha thead th{
    background:var(--bg);
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    text-align:center;
    padding:10px 6px;
    vertical-align:middle;
  }

  .col-sticky{
    position:sticky;
    left:0;
    z-index:2;
    background:var(--bg);
    border-right:3px solid var(--black);
  }

  .grelha thead .col-sticky{
    z-index:3;
  }

  .dia-abrev{
    display:block;
    font-size:12px;
  }

  .dia-num{
    display:block;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0;
    margin-top:3px;
  }

  .grelha th.hoje{
    color:var(--red);
    box-shadow:inset 0 -3px 0 var(--red);
  }

  .grelha th.hoje .dia-num{
    color:var(--red);
  }

  .grelha td.hoje{
    background:rgba(217,17,36,0.05);
  }

  td.turno-label{
    padding:12px 8px;
  }

  .turno-horario{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
  }

  .turno-duracao{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
  }

  td.celula{
    cursor:pointer;
    position:relative;
  }

  td.celula:hover{
    background:#EDE8DD;
  }

  td.celula.hoje:hover{
    background:#EFDFDD;
  }

  .celula-inner{
    min-height:64px;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .p-chip{
    font-size:11px;
    font-weight:600;
    line-height:1.35;
    padding:3px 6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border:1px solid rgba(0,0,0,0.15);
  }

  /* Chip previsto pelo padrão, ainda sem confirmação manual */
  .p-chip-previsto{
    background:transparent;
    border:1px dashed currentColor;
    opacity:0.75;
    font-style:italic;
  }

  .btn-revert-padrao{
    position:absolute;
    top:3px;
    right:3px;
    width:16px;
    height:16px;
    line-height:14px;
    padding:0;
    font-size:11px;
    text-align:center;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--muted);
    cursor:pointer;
    opacity:0;
    transition:opacity .15s;
  }

  td.celula:hover .btn-revert-padrao{
    opacity:1;
  }

  .btn-revert-padrao:hover{
    border-color:var(--red);
    color:var(--red);
  }

  .celula-vazia{
    font-family:'Space Mono', monospace;
    font-size:16px;
    color:#c4bfb3;
    text-align:center;
    line-height:52px;
  }

  td.celula:hover .celula-vazia{
    color:var(--red);
  }

  /* ---------- Resumo de horas ---------- */
  .resumo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(min(280px, 100%), 1fr));
    gap:18px;
    margin-top:26px;
  }

  .resumo-card{
    background:var(--white);
    border:3px solid var(--black);
    padding:18px 20px;
  }

  .resumo-card h3{
    margin:0 0 12px;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .resumo-table{
    width:100%;
    border-collapse:collapse;
  }

  .resumo-table td{
    padding:7px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }

  .resumo-nome{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .resumo-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    border:1px solid rgba(0,0,0,0.15);
  }

  .resumo-horas{
    text-align:right;
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }

  .resumo-table tr.resumo-total td{
    border-bottom:none;
    border-top:2px solid var(--black);
    padding-top:9px;
    font-weight:700;
  }

  /* ---------- Modal de atribuição ---------- */
  .turno-modal-horario{
    margin:0 0 16px;
    font-family:'Space Mono', monospace;
    font-size:18px;
    font-weight:700;
  }

  .check-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-height:320px;
    overflow-y:auto;
  }

  .check-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border:2px solid var(--line);
    background:var(--white);
    font-size:14px;
    cursor:pointer;
  }

  .check-item:hover{
    border-color:var(--black);
  }

  .check-item input{
    width:18px;
    height:18px;
    flex-shrink:0;
  }

  .check-item-inativo{
    font-size:11px;
    color:var(--muted);
    margin-left:auto;
    font-family:'Space Mono', monospace;
  }

  /* ---------- Modal (shared pattern with fornecedores.html / mrn-dashboard.html) ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,20,20,0.6);
    z-index:100;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
  }

  .modal-overlay.open{
    display:flex;
  }

  .modal{
    background:var(--bg);
    border:3px solid var(--black);
    max-width:480px;
    width:100%;
    padding:28px;
    cursor:default;
  }

  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }

  .modal-header h2{
    margin:0;
    font-size:20px;
  }

  .modal-close{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    line-height:1;
  }

  .field{
    margin-bottom:14px;
  }

  .field-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .field input,
  .field select{
    width:100%;
    padding:10px 12px;
    border:2px solid var(--line);
    background:var(--bg);
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--black);
  }

  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--black);
  }

  .field input[type="color"]{
    padding:5px;
    height:40px;
    cursor:pointer;
  }

  .field-checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    margin-bottom:18px;
  }

  .field-checkbox input{
    width:20px;
    height:20px;
  }

  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:22px;
    flex-wrap:wrap;
  }

  .btn{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    border:2px solid var(--black);
    background:var(--white);
    color:var(--black);
    padding:9px 14px;
    cursor:pointer;
    letter-spacing:0.3px;
    white-space:nowrap;
  }

  .btn:hover{
    background:var(--black);
    color:var(--white);
  }

  .btn-primary{
    background:var(--red);
    border-color:var(--red);
    color:var(--white);
  }

  .btn-primary:hover{
    background:var(--black);
    border-color:var(--black);
  }

  .btn-mr-auto{
    margin-right:auto;
  }

  /* ---------- Padrão semanal (dentro do modal de pessoa) ---------- */
  .padrao-grid-wrap{
    overflow-x:auto;
    margin-top:4px;
  }

  .padrao-table{
    width:100%;
    min-width:280px;
    border-collapse:collapse;
  }

  .padrao-table th,
  .padrao-table td{
    text-align:center;
    padding:5px 2px;
    border:1px solid var(--line);
  }

  .padrao-table th{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:10px;
    background:var(--bg);
    text-transform:uppercase;
  }

  .padrao-turno-label{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:10px;
    background:var(--bg);
    white-space:nowrap;
  }

  .padrao-table input[type="checkbox"]{
    width:16px;
    height:16px;
    cursor:pointer;
  }

  .padrao-hint{
    margin:6px 0 0;
    font-size:11px;
    color:var(--muted);
  }

  /* ---------- Mini-calendário mensal ---------- */
  .cal-modal{
    max-width:360px;
  }

  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:14px;
  }

  .cal-month-label{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
    min-width:150px;
    text-align:center;
    text-transform:capitalize;
  }

  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:3px;
    margin-bottom:4px;
  }

  .cal-weekdays span{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--muted);
    text-align:center;
    text-transform:uppercase;
  }

  .cal-days{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:3px;
  }

  .cal-day{
    aspect-ratio:1;
    border:1px solid var(--line);
    background:var(--white);
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--black);
    cursor:pointer;
    padding:0;
  }

  .cal-day:hover{
    background:var(--bg);
    border-color:var(--black);
  }

  .cal-day-out{
    color:#c4bfb3;
    background:var(--bg);
  }

  .cal-day-semana{
    background:#EDE8DD;
  }

  .cal-day-today{
    border:2px solid var(--red);
    font-weight:700;
  }

  .cal-day-semana.cal-day-today{
    background:#EFDFDD;
  }

  .btn-vista-mensal{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:9px 16px;
    border:2px solid var(--black);
    background:var(--white);
    cursor:pointer;
    white-space:nowrap;
  }

  .btn-vista-mensal:hover{
    background:var(--black);
    color:var(--white);
  }

  /* ---------- Editar semana (edição em lote) ---------- */
  .modal-lg{
    max-width:760px;
    max-height:calc(100vh - 80px);
    display:flex;
    flex-direction:column;
  }

  .modal-lg .modal-header{
    flex-shrink:0;
  }

  .modal-body-scroll{
    overflow-y:auto;
    flex:1;
    min-height:0;
  }

  .modal-lg .modal-actions{
    flex-shrink:0;
  }

  .semana-pessoa-bloco{
    border:2px solid var(--line);
    background:var(--white);
    padding:14px;
    margin-bottom:14px;
  }

  .semana-pessoa-bloco:last-child{
    margin-bottom:0;
  }

  .semana-pessoa-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }

  .semana-pessoa-nome{
    font-weight:700;
    font-size:14px;
  }

  .semana-grid-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }

  .semana-mini-grelha{
    border-collapse:collapse;
    width:100%;
    min-width:480px;
  }

  .semana-mini-grelha th,
  .semana-mini-grelha td{
    border:1px solid var(--line);
    text-align:center;
    padding:5px 4px;
  }

  .semana-mini-grelha th{
    font-family:'Space Mono', monospace;
    font-size:9px;
    font-weight:700;
    line-height:1.4;
    background:var(--bg);
  }

  .semana-turno-label{
    font-family:'Space Mono', monospace;
    font-size:9px;
    font-weight:700;
    background:var(--bg);
    white-space:nowrap;
  }

  .semana-mini-grelha input[type="checkbox"]{
    width:16px;
    height:16px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="home-link">🏠 Home</a>
    <span class="brand-mark"><span style="color:var(--black);">●</span> GIOCO®</span>
  </div>
</header>

<main>
  <h1 class="page-title">GIOCO · Equipa</h1>
  <p class="page-subtitle">Turnos e Pessoas</p>

  <div class="section">
    <p class="section-title">Pessoas</p>
    <div class="pessoas-list" id="pessoasList"></div>
    <button type="button" class="btn-registar" id="btnNovaPessoa" style="margin-top:14px;">+ Nova pessoa</button>

    <details class="inactive-details" id="inativosDetails" style="display:none;">
      <summary id="inativosSummary">Pessoas inativas (0)</summary>
      <div class="pessoas-list" id="pessoasInativasList" style="margin-top:10px;"></div>
    </details>
  </div>

  <div class="section">
    <p class="section-title">Turnos</p>
    <div class="week-nav">
      <button type="button" class="week-nav-btn" id="prevWeekBtn" title="Semana anterior" aria-label="Semana anterior">←</button>
      <span class="week-label" id="weekLabel"></span>
      <button type="button" class="week-nav-btn" id="nextWeekBtn" title="Semana seguinte" aria-label="Semana seguinte">→</button>
      <button type="button" class="btn-hoje" id="btnHoje">Hoje</button>
      <button type="button" class="btn-vista-mensal" id="btnVistaMensal">📅 Vista mensal</button>
      <button type="button" class="btn-vista-mensal" id="btnEditarSemana">✏️ Editar semana</button>
    </div>

    <div class="grelha-wrap">
      <table class="grelha" id="grelhaTurnos"></table>
    </div>

    <div class="resumo-grid">
      <div class="resumo-card">
        <h3 class="mono">Esta semana</h3>
        <div id="resumoSemana"></div>
      </div>
      <div class="resumo-card">
        <h3 class="mono">Este mês · <span id="mesLabel"></span></h3>
        <div id="resumoMes"></div>
      </div>
    </div>

</main>

<script>
  var firebaseConfig = {
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var pessoasRef = db.ref('pessoas');
  var turnosRef = db.ref('turnos');
  var padroesRef = db.ref('padroes');

  var pessoas = {};
  var pessoasCarregadas = false;
  var turnos = {};
  var padroes = {};
  var weekOffset = 0;

  var editingPessoaId = null;
  var turnoModalData = null;
  var turnoModalTurnoId = null;

  var calViewYear = null;
  var calViewMonth = null;

  var DIA_NOMES = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
  var DIA_ABREV = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var MES_NOMES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  /* Chaves dos dias tal como guardadas em 'padroes/{pessoaId}', por ordem de segunda a domingo */
  var DIA_KEYS_UI = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab', 'dom'];
  var DIA_LABELS_UI = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  /* Mesmas chaves, mas indexadas por Date.getDay() (0 = domingo) */
  var DIA_KEYS_BY_GETDAY = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];

  /* Turnos fixos, por ordem cronológica */
  var TURNOS = [
    { id:'t1', horario:'11:00–16:00', horas:5 },
    { id:'t3', horario:'16:00–17:30', horas:1.5 },
    { id:'t2', horario:'17:30–23:00', horas:5.5 }
  ];

  function escapeHtml(str){
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pad2(n){
    return n < 10 ? '0' + n : String(n);
  }

  /* ---------- Pessoas ---------- */
  function pessoasAtivasArray(){
    return Object.keys(pessoas)
      .map(function(id){ return Object.assign({ id: id }, pessoas[id]); })
      .filter(function(p){ return p.ativo !== false; })
      .sort(function(a, b){ return (a.nome || '').localeCompare(b.nome || ''); });
  }

  function pessoasInativasArray(){
    return Object.keys(pessoas)
      .map(function(id){ return Object.assign({ id: id }, pessoas[id]); })
      .filter(function(p){ return p.ativo === false; })
      .sort(function(a, b){ return (a.nome || '').localeCompare(b.nome || ''); });
  }

  function renderPessoaCard(p){
    var html = '<div class="pessoa-card">';
    html += '  <span class="pessoa-color-dot" style="background:' + (p.cor || '#999') + '"></span>';
    html += '  <div class="pessoa-info">';
    html += '    <div class="pessoa-nome">' + escapeHtml(p.nome) + '</div>';
    if (p.funcao) html += '    <div class="pessoa-funcao">' + escapeHtml(p.funcao) + '</div>';
    html += '    <div class="pessoa-contacts">';
    if (p.telefone) html += '<a href="tel:' + escapeHtml(p.telefone) + '">📞 ' + escapeHtml(p.telefone) + '</a>';
    if (p.email) html += '<a href="mailto:' + escapeHtml(p.email) + '">✉️ ' + escapeHtml(p.email) + '</a>';
    html += '    </div>';
    html += '  </div>';
    html += '  <button type="button" class="btn-editar-pessoa" onclick="editPessoa(\'' + p.id + '\')">✎</button>';
    html += '</div>';
    return html;
  }

  function renderPessoas(){
    var ativas = pessoasAtivasArray();
    var inativas = pessoasInativasArray();

    document.getElementById('pessoasList').innerHTML = ativas.length
      ? ativas.map(renderPessoaCard).join('')
      : '<p class="empty-state">Sem pessoas ativas.</p>';

    var inativosDetails = document.getElementById('inativosDetails');
    if (inativas.length){
      inativosDetails.style.display = 'block';
      document.getElementById('inativosSummary').textContent = 'Pessoas inativas (' + inativas.length + ')';
      document.getElementById('pessoasInativasList').innerHTML = inativas.map(renderPessoaCard).join('');
    } else {
      inativosDetails.style.display = 'none';
    }
  }

  /* ---------- Padrão semanal (dentro do modal de pessoa) ---------- */
  function buildPadraoTableHtml(pad){
    pad = pad || {};
    var html = '<table class="padrao-table"><thead><tr><th></th>';
    DIA_LABELS_UI.forEach(function(l){ html += '<th>' + l + '</th>'; });
    html += '</tr></thead><tbody>';
    TURNOS.forEach(function(t){
      html += '<tr><td class="padrao-turno-label" title="' + t.horario + '">' + t.id.toUpperCase() + '</td>';
      DIA_KEYS_UI.forEach(function(diaKey){
        var checked = pad[diaKey] && pad[diaKey].indexOf(t.id) !== -1;
        html += '<td><input type="checkbox" data-dia="' + diaKey + '" data-turno="' + t.id + '"' + (checked ? ' checked' : '') + '></td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function lerPadraoDoFormulario(){
    var pad = {};
    DIA_KEYS_UI.forEach(function(diaKey){ pad[diaKey] = []; });
    var checks = document.querySelectorAll('#padraoGridWrap input[type="checkbox"]');
    Array.prototype.forEach.call(checks, function(c){
      if (c.checked) pad[c.getAttribute('data-dia')].push(c.getAttribute('data-turno'));
    });
    return pad;
  }

  function salvarPadrao(pessoaId, pad){
    var temAlgum = Object.keys(pad).some(function(k){ return pad[k].length; });
    return temAlgum ? padroesRef.child(pessoaId).set(pad) : padroesRef.child(pessoaId).remove();
  }

  function openPessoaModal(id){
    editingPessoaId = id || null;
    var p = id ? Object.assign({ id: id }, pessoas[id]) : null;
    document.getElementById('pessoaModalTitle').textContent = p ? 'Editar pessoa' : 'Nova pessoa';
    document.getElementById('pessoaNome').value = p ? (p.nome || '') : '';
    document.getElementById('pessoaFuncao').value = p ? (p.funcao || '') : '';
    document.getElementById('pessoaTelefone').value = p ? (p.telefone || '') : '';
    document.getElementById('pessoaEmail').value = p ? (p.email || '') : '';
    document.getElementById('pessoaCor').value = (p && p.cor) ? p.cor : '#D91124';
    document.getElementById('pessoaAtivo').checked = p ? (p.ativo !== false) : true;
    document.getElementById('btnDesativarPessoa').style.display = (p && p.ativo !== false) ? 'inline-block' : 'none';
    document.getElementById('padraoGridWrap').innerHTML = buildPadraoTableHtml(id ? padroes[id] : null);
    document.getElementById('pessoaModalOverlay').classList.add('open');
  }
  window.editPessoa = function(id){ openPessoaModal(id); };

  function closePessoaModal(){
    document.getElementById('pessoaModalOverlay').classList.remove('open');
    editingPessoaId = null;
  }

  document.getElementById('btnNovaPessoa').addEventListener('click', function(){ openPessoaModal(null); });
  document.getElementById('pessoaModalClose').addEventListener('click', closePessoaModal);
  document.getElementById('pessoaModalCancel').addEventListener('click', closePessoaModal);
  document.getElementById('pessoaModalOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('pessoaModalOverlay')) closePessoaModal();
  });

  document.getElementById('btnGuardarPessoa').addEventListener('click', function(){
    var nome = document.getElementById('pessoaNome').value.trim();
    if (!nome){
      alert('Indica o nome.');
      return;
    }

    var dados = {
      nome: nome,
      funcao: document.getElementById('pessoaFuncao').value.trim(),
      telefone: document.getElementById('pessoaTelefone').value.trim(),
      email: document.getElementById('pessoaEmail').value.trim(),
      cor: document.getElementById('pessoaCor').value,
      ativo: document.getElementById('pessoaAtivo').checked
    };
    var pad = lerPadraoDoFormulario();

    var pessoaId = editingPessoaId;
    var promise;
    if (pessoaId){
      promise = pessoasRef.child(pessoaId).update(dados);
    } else {
      var novaRef = pessoasRef.push();
      pessoaId = novaRef.key;
      promise = novaRef.set(dados);
    }

    promise.then(function(){
      return salvarPadrao(pessoaId, pad);
    }).then(closePessoaModal).catch(function(err){
      alert('Erro ao guardar pessoa: ' + err.message);
    });
  });

  document.getElementById('btnDesativarPessoa').addEventListener('click', function(){
    if (!editingPessoaId) return;
    if (!confirm('Desativar esta pessoa? Deixa de aparecer nos dropdowns, mas os registos antigos mantêm-se.')) return;
    pessoasRef.child(editingPessoaId).update({ ativo: false }).then(closePessoaModal).catch(function(err){
      alert('Erro ao desativar: ' + err.message);
    });
  });

  pessoasRef.on('value', function(snapshot){
    var val = snapshot.val();
    if (!val){
      pessoasRef.push({ nome: 'Manel', funcao: 'Fundador', telefone: '', email: '', cor: '#D91124', ativo: true });
      pessoasRef.push({ nome: 'Alfredo', funcao: 'Head of Operations', telefone: '', email: '', cor: '#1D5C8A', ativo: true });
      return;
    }
    pessoas = val;
    pessoasCarregadas = true;
    renderPessoas();
    renderGrelha();
  });

  padroesRef.on('value', function(snapshot){
    padroes = snapshot.val() || {};
    renderGrelha();
  });

  /* ---------- Turnos ---------- */
  function toDateStr(d){
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function getMonday(d){
    var date = new Date(d);
    var day = date.getDay();
    var diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function getWeekStart(){
    var monday = getMonday(new Date());
    monday.setDate(monday.getDate() + weekOffset * 7);
    return monday;
  }

  function formatWeekLabel(monday){
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    var fmt = function(d){ return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1); };
    return fmt(monday) + ' – ' + fmt(sunday);
  }

  function parseDataStr(dStr){
    var parts = dStr.split('-');
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  function formatDataLonga(dStr){
    var d = parseDataStr(dStr);
    return DIA_NOMES[d.getDay()] + ', ' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  document.getElementById('prevWeekBtn').addEventListener('click', function(){ weekOffset--; renderGrelha(); });
  document.getElementById('nextWeekBtn').addEventListener('click', function(){ weekOffset++; renderGrelha(); });
  document.getElementById('btnHoje').addEventListener('click', function(){ weekOffset = 0; renderGrelha(); });

  function turnoDef(turnoId){
    for (var i = 0; i < TURNOS.length; i++){
      if (TURNOS[i].id === turnoId) return TURNOS[i];
    }
    return null;
  }

  function chaveTurno(dStr, turnoId){
    return dStr + '_' + turnoId;
  }

  /* Firebase pode devolver o array como array ou como objecto indexado */
  function normalizaPessoas(registo){
    if (!registo || !registo.pessoas) return [];
    var raw = registo.pessoas;
    var arr = Array.isArray(raw) ? raw : Object.keys(raw).map(function(k){ return raw[k]; });
    return arr.filter(function(p){ return p && p.pessoaId; });
  }

  function pessoasDoTurno(dStr, turnoId){
    return normalizaPessoas(turnos[chaveTurno(dStr, turnoId)]);
  }

  /* Pessoas previstas pelo padrão semanal para esta data+turno (só pessoas ativas) */
  function pessoasDoPadrao(dStr, turnoId){
    var diaKey = DIA_KEYS_BY_GETDAY[parseDataStr(dStr).getDay()];
    var out = [];
    pessoasAtivasArray().forEach(function(p){
      var pad = padroes[p.id];
      if (pad && Array.isArray(pad[diaKey]) && pad[diaKey].indexOf(turnoId) !== -1){
        out.push({ pessoaId: p.id, nome: p.nome, cor: p.cor });
      }
    });
    return out;
  }

  /* Resolve o efetivo de uma célula: confirmação manual tem sempre prioridade sobre o padrão */
  function efetivoDoTurno(dStr, turnoId){
    var key = chaveTurno(dStr, turnoId);
    if (turnos[key]) return { pessoas: normalizaPessoas(turnos[key]), confirmado: true };
    return { pessoas: pessoasDoPadrao(dStr, turnoId), confirmado: false };
  }

  /* Nome/cor actuais da pessoa; cai para o snapshot guardado se já não existir */
  function dadosPessoa(entrada){
    var live = pessoas[entrada.pessoaId];
    return {
      nome: live ? (live.nome || '—') : (entrada.nome || 'Pessoa removida'),
      cor: (live ? live.cor : entrada.cor) || '#999999'
    };
  }

  function primeiroNome(nome){
    return String(nome || '').trim().split(/\s+/)[0] || '—';
  }

  function iniciais(nome){
    var partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return '—';
    var out = partes[0].charAt(0);
    if (partes.length > 1) out += partes[partes.length - 1].charAt(0);
    return out.toUpperCase();
  }

  /* Texto preto ou branco consoante a luminância da cor da pessoa */
  function textoContraste(hex){
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if (h.length !== 6) return '#FFFFFF';
    var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#141414' : '#FFFFFF';
  }

  function fmtHoras(h){
    var min = Math.round(h * 60);
    var hh = Math.floor(min / 60);
    var mm = min % 60;
    return hh + 'h' + (mm ? pad2(mm) : '');
  }

  function renderGrelha(){
    var monday = getWeekStart();
    document.getElementById('weekLabel').textContent = formatWeekLabel(monday);

    var todayStr = toDateStr(new Date());
    var dias = [];
    for (var i = 0; i < 7; i++){
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dias.push(d);
    }

    var html = '<colgroup><col class="col-label">';
    for (i = 0; i < 7; i++) html += '<col>';
    html += '</colgroup>';

    html += '<thead><tr><th class="col-sticky">Turno</th>';
    dias.forEach(function(d){
      var isToday = toDateStr(d) === todayStr;
      html += '<th class="' + (isToday ? 'hoje' : '') + '">';
      html += '<span class="dia-abrev">' + DIA_ABREV[d.getDay()] + '</span>';
      html += '<span class="dia-num">' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '</span>';
      html += '</th>';
    });
    html += '</tr></thead><tbody>';

    TURNOS.forEach(function(t){
      html += '<tr>';
      html += '<td class="col-sticky turno-label">';
      html += '<span class="turno-horario">' + t.horario + '</span>';
      html += '<span class="turno-duracao">' + fmtHoras(t.horas) + '</span>';
      html += '</td>';

      dias.forEach(function(d){
        var dStr = toDateStr(d);
        var isToday = dStr === todayStr;
        var efet = efetivoDoTurno(dStr, t.id);
        var lista = efet.pessoas;

        html += '<td class="celula' + (isToday ? ' hoje' : '') + '" onclick="openTurnoModal(\'' + dStr + '\',\'' + t.id + '\')">';
        if (efet.confirmado){
          html += '<button type="button" class="btn-revert-padrao" title="Reverter ao padrão" onclick="revertParaPadrao(\'' + dStr + '\',\'' + t.id + '\',event)">↺</button>';
        }
        html += '<div class="celula-inner">';
        if (lista.length){
          var curto = lista.length >= 4;
          lista.forEach(function(entrada){
            var info = dadosPessoa(entrada);
            var label = curto ? iniciais(info.nome) : primeiroNome(info.nome);
            if (efet.confirmado){
              html += '<span class="p-chip" title="' + escapeHtml(info.nome) + '"';
              html += ' style="background:' + info.cor + ';color:' + textoContraste(info.cor) + '">';
              html += escapeHtml(label) + '</span>';
            } else {
              html += '<span class="p-chip p-chip-previsto" title="' + escapeHtml(info.nome) + ' (previsto pelo padrão)"';
              html += ' style="color:' + info.cor + ';border-color:' + info.cor + '">';
              html += escapeHtml(label) + '</span>';
            }
          });
        } else {
          html += '<span class="celula-vazia">+</span>';
        }
        html += '</div></td>';
      });

      html += '</tr>';
    });
    html += '</tbody>';

    document.getElementById('grelhaTurnos').innerHTML = html;
    renderResumos(dias);
  }

  /* ---------- Resumo de horas ---------- */
  function acumula(mapa, entrada, horas){
    var info = dadosPessoa(entrada);
    if (!mapa[entrada.pessoaId]) mapa[entrada.pessoaId] = { nome: info.nome, cor: info.cor, horas: 0 };
    mapa[entrada.pessoaId].horas += horas;
  }

  function renderResumoTabela(mapa, elId){
    var arr = Object.keys(mapa).map(function(id){ return mapa[id]; }).sort(function(a, b){
      return (b.horas - a.horas) || a.nome.localeCompare(b.nome);
    });

    var el = document.getElementById(elId);
    if (!arr.length){
      el.innerHTML = '<p class="empty-state">Sem turnos atribuídos.</p>';
      return;
    }

    var total = 0;
    var html = '<table class="resumo-table"><tbody>';
    arr.forEach(function(p){
      total += p.horas;
      html += '<tr><td><span class="resumo-nome">';
      html += '<span class="resumo-dot" style="background:' + p.cor + '"></span>' + escapeHtml(p.nome);
      html += '</span></td><td class="resumo-horas">' + fmtHoras(p.horas) + '</td></tr>';
    });
    html += '<tr class="resumo-total"><td>Total</td><td class="resumo-horas">' + fmtHoras(total) + '</td></tr>';
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function renderResumos(dias){
    /* Semana visível: 21 células, sempre pelo efetivo (padrão + confirmações) */
    var semana = {};
    dias.forEach(function(d){
      var dStr = toDateStr(d);
      TURNOS.forEach(function(t){
        efetivoDoTurno(dStr, t.id).pessoas.forEach(function(entrada){ acumula(semana, entrada, t.horas); });
      });
    });
    renderResumoTabela(semana, 'resumoSemana');

    /* Mês corrente: percorre todos os dias do mês x 3 turnos, resolvendo o efetivo de cada célula */
    var hoje = new Date();
    var ano = hoje.getFullYear();
    var mesIdx = hoje.getMonth();
    document.getElementById('mesLabel').textContent = MES_NOMES[mesIdx];

    var diasNoMes = new Date(ano, mesIdx + 1, 0).getDate();
    var mes = {};
    for (var dia = 1; dia <= diasNoMes; dia++){
      var dStr = toDateStr(new Date(ano, mesIdx, dia));
      TURNOS.forEach(function(t){
        efetivoDoTurno(dStr, t.id).pessoas.forEach(function(entrada){ acumula(mes, entrada, t.horas); });
      });
    }
    renderResumoTabela(mes, 'resumoMes');
  }

  function revertParaPadrao(dStr, turnoId, ev){
    if (ev) ev.stopPropagation();
    if (!confirm('Reverter esta célula ao padrão? A confirmação manual é apagada.')) return;
    turnosRef.child(chaveTurno(dStr, turnoId)).remove().catch(function(err){
      alert('Erro ao reverter: ' + err.message);
    });
  }
  window.revertParaPadrao = revertParaPadrao;

  /* ---------- Modal de atribuição ---------- */
  function openTurnoModal(dStr, turnoId){
    turnoModalData = dStr;
    turnoModalTurnoId = turnoId;

    var def = turnoDef(turnoId);
    document.getElementById('turnoModalData').textContent = formatDataLonga(dStr);
    document.getElementById('turnoModalHorario').textContent = def ? def.horario : '';

    var el = document.getElementById('turnoPessoasList');
    if (!pessoasCarregadas){
      el.innerHTML = '<p class="empty-state">A carregar…</p>';
    } else {
      var atribuidos = {};
      efetivoDoTurno(dStr, turnoId).pessoas.forEach(function(entrada){ atribuidos[entrada.pessoaId] = entrada; });

      var lista = pessoasAtivasArray();
      /* Inclui quem está atribuído mas já não está activo, para não o perder ao guardar */
      pessoasInativasArray().forEach(function(p){ if (atribuidos[p.id]) lista.push(p); });

      if (!lista.length){
        el.innerHTML = '<p class="empty-state">Sem pessoas ativas.</p>';
      } else {
        el.innerHTML = lista.map(function(p){
          var out = '<label class="check-item">';
          out += '<input type="checkbox" value="' + p.id + '"' + (atribuidos[p.id] ? ' checked' : '') + '>';
          out += '<span class="resumo-dot" style="background:' + (p.cor || '#999999') + '"></span>';
          out += escapeHtml(p.nome);
          if (p.ativo === false) out += '<span class="check-item-inativo">inativo</span>';
          out += '</label>';
          return out;
        }).join('');
      }
    }

    document.getElementById('turnoModalOverlay').classList.add('open');
  }
  window.openTurnoModal = openTurnoModal;

  function closeTurnoModal(){
    document.getElementById('turnoModalOverlay').classList.remove('open');
    turnoModalData = null;
    turnoModalTurnoId = null;
  }

  document.getElementById('turnoModalClose').addEventListener('click', closeTurnoModal);
  document.getElementById('turnoModalCancel').addEventListener('click', closeTurnoModal);
  document.getElementById('turnoModalOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('turnoModalOverlay')) closeTurnoModal();
  });

  document.getElementById('btnGuardarTurno').addEventListener('click', function(){
    if (!turnoModalData || !turnoModalTurnoId) return;

    var checks = document.querySelectorAll('#turnoPessoasList input[type="checkbox"]');
    var arr = [];
    Array.prototype.forEach.call(checks, function(c){
      if (!c.checked) return;
      var p = pessoas[c.value] || {};
      arr.push({ pessoaId: c.value, nome: p.nome || 'Pessoa removida', cor: p.cor || '#999999' });
    });

    /* Grava sempre como confirmação explícita (mesmo array vazio), para travar a célula contra o padrão */
    var key = chaveTurno(turnoModalData, turnoModalTurnoId);
    turnosRef.child(key).set({ data: turnoModalData, turno: turnoModalTurnoId, pessoas: arr })
      .then(closeTurnoModal).catch(function(err){
        alert('Erro ao guardar turno: ' + err.message);
      });
  });

  turnosRef.on('value', function(snapshot){
    turnos = snapshot.val() || {};
    renderGrelha();
  });

  /* ---------- Mini-calendário mensal (só navegação, sem dados de turnos) ---------- */
  document.getElementById('calWeekdays').innerHTML = DIA_LABELS_UI.map(function(l){ return '<span>' + l + '</span>'; }).join('');

  function renderCalModal(){
    document.getElementById('calModalLabel').textContent = MES_NOMES[calViewMonth] + ' ' + calViewYear;

    var first = new Date(calViewYear, calViewMonth, 1);
    var offsetInicio = first.getDay() === 0 ? 6 : first.getDay() - 1; /* dias antes do 1º para chegar a segunda */
    var gridStart = new Date(calViewYear, calViewMonth, 1 - offsetInicio);

    var todayStr = toDateStr(new Date());
    var semanaAtualMonday = toDateStr(getWeekStart());

    var html = '';
    for (var i = 0; i < 42; i++){
      var d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      var dStr = toDateStr(d);
      var cls = 'cal-day';
      if (d.getMonth() !== calViewMonth) cls += ' cal-day-out';
      if (toDateStr(getMonday(d)) === semanaAtualMonday) cls += ' cal-day-semana';
      if (dStr === todayStr) cls += ' cal-day-today';
      html += '<button type="button" class="' + cls + '" onclick="irParaDia(\'' + dStr + '\')">' + d.getDate() + '</button>';
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function openCalModal(){
    var monday = getWeekStart();
    calViewYear = monday.getFullYear();
    calViewMonth = monday.getMonth();
    renderCalModal();
    document.getElementById('calModalOverlay').classList.add('open');
  }

  function closeCalModal(){
    document.getElementById('calModalOverlay').classList.remove('open');
  }

  function irParaDia(dStr){
    var targetMonday = getMonday(parseDataStr(dStr));
    var todayMonday = getMonday(new Date());
    weekOffset = Math.round((targetMonday - todayMonday) / (7 * 86400000));
    closeCalModal();
    renderGrelha();
  }
  window.irParaDia = irParaDia;

  document.getElementById('btnVistaMensal').addEventListener('click', openCalModal);
  document.getElementById('calModalClose').addEventListener('click', closeCalModal);
  document.getElementById('calModalOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('calModalOverlay')) closeCalModal();
  });
  document.getElementById('calPrevMonth').addEventListener('click', function(){
    calViewMonth--;
    if (calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
    renderCalModal();
  });
  document.getElementById('calNextMonth').addEventListener('click', function(){
    calViewMonth++;
    if (calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
    renderCalModal();
  });

  /* ---------- Editar semana (preenchimento em lote) ---------- */
  var editarSemanaDias = null;
  var editarSemanaEstadoInicial = {};

  function buildEditarSemanaHtml(dias){
    editarSemanaEstadoInicial = {};
    dias.forEach(function(d){
      var dStr = toDateStr(d);
      TURNOS.forEach(function(t){
        editarSemanaEstadoInicial[chaveTurno(dStr, t.id)] = efetivoDoTurno(dStr, t.id).pessoas
          .map(function(e){ return e.pessoaId; })
          .sort();
      });
    });

    var ativas = pessoasAtivasArray();
    if (!ativas.length) return '<p class="empty-state">Sem pessoas ativas.</p>';

    return ativas.map(function(p){
      var html = '<div class="semana-pessoa-bloco">';
      html += '<div class="semana-pessoa-header"><span class="pessoa-color-dot" style="background:' + (p.cor || '#999') + '"></span>';
      html += '<span class="semana-pessoa-nome">' + escapeHtml(p.nome) + '</span></div>';
      html += '<div class="semana-grid-wrap"><table class="semana-mini-grelha"><thead><tr><th></th>';
      dias.forEach(function(d){
        html += '<th>' + DIA_ABREV[d.getDay()] + '<br>' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '</th>';
      });
      html += '</tr></thead><tbody>';
      TURNOS.forEach(function(t){
        html += '<tr><td class="semana-turno-label" title="' + t.horario + '">' + t.id.toUpperCase() + '</td>';
        dias.forEach(function(d){
          var dStr = toDateStr(d);
          var checked = editarSemanaEstadoInicial[chaveTurno(dStr, t.id)].indexOf(p.id) !== -1;
          html += '<td><input type="checkbox" data-pessoa="' + p.id + '" data-data="' + dStr + '" data-turno="' + t.id + '"' + (checked ? ' checked' : '') + '></td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
      return html;
    }).join('');
  }

  function openEditarSemanaModal(){
    var monday = getWeekStart();
    var dias = [];
    for (var i = 0; i < 7; i++){
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dias.push(d);
    }
    editarSemanaDias = dias;

    var fmt = function(d){ return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1); };
    document.getElementById('editarSemanaTitulo').textContent = 'Editar turnos — semana de ' + fmt(dias[0]) + ' a ' + fmt(dias[6]);
    document.getElementById('editarSemanaBody').innerHTML = buildEditarSemanaHtml(dias);
    document.getElementById('editarSemanaOverlay').classList.add('open');
  }

  function closeEditarSemanaModal(){
    document.getElementById('editarSemanaOverlay').classList.remove('open');
    editarSemanaDias = null;
    editarSemanaEstadoInicial = {};
  }

  document.getElementById('btnEditarSemana').addEventListener('click', openEditarSemanaModal);
  document.getElementById('editarSemanaClose').addEventListener('click', closeEditarSemanaModal);
  document.getElementById('editarSemanaCancel').addEventListener('click', closeEditarSemanaModal);
  document.getElementById('editarSemanaOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('editarSemanaOverlay')) closeEditarSemanaModal();
  });

  document.getElementById('btnGuardarSemana').addEventListener('click', function(){
    if (!editarSemanaDias) return;

    var promises = [];
    editarSemanaDias.forEach(function(d){
      var dStr = toDateStr(d);
      TURNOS.forEach(function(t){
        var key = chaveTurno(dStr, t.id);
        var checks = document.querySelectorAll('#editarSemanaBody input[data-data="' + dStr + '"][data-turno="' + t.id + '"]');
        var novosIds = [];
        Array.prototype.forEach.call(checks, function(c){ if (c.checked) novosIds.push(c.getAttribute('data-pessoa')); });
        novosIds.sort();

        var iniciais = editarSemanaEstadoInicial[key] || [];
        var mudou = novosIds.length !== iniciais.length || novosIds.some(function(id, idx){ return id !== iniciais[idx]; });
        if (!mudou) return;

        var arr = novosIds.map(function(id){
          var p = pessoas[id] || {};
          return { pessoaId: id, nome: p.nome || 'Pessoa removida', cor: p.cor || '#999999' };
        });
        promises.push(turnosRef.child(key).set({ data: dStr, turno: t.id, pessoas: arr }));
      });
    });

    if (!promises.length){
      closeEditarSemanaModal();
      return;
    }

    Promise.all(promises).then(closeEditarSemanaModal).catch(function(err){
      alert('Erro ao guardar alterações: ' + err.message);
    });
  });

  renderGrelha();
</script>

</body>
</html>
