<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>GIOCO — Ingredientes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono,button,.field-label{
    font-family:'Space Mono', monospace;
  }

  /* Header */
  header{
    padding:20px 28px;
    background:var(--white);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
  }

  .header-left{
    display:flex;
    align-items:center;
    gap:16px;
  }

  .home-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border-radius:8px;
    border:1px solid var(--line);
    color:var(--black);
    text-decoration:none;
    font-size:16px;
    background:var(--white);
    transition:background .12s ease, border-color .12s ease;
  }

  .home-link:hover{
    background:var(--bg);
    border-color:var(--black);
  }

  .brand-eyebrow{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--red);
    margin:0 0 2px;
  }

  h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.3px;
  }

  /* Layout */
  .page{
    max-width:1200px;
    margin:0 auto;
    padding:28px;
  }

  /* Stats */
  .stats-bar{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:14px;
    margin-bottom:24px;
  }

  .stat-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
  }

  .stat-value{
    font-family:'Space Mono', monospace;
    font-size:26px;
    font-weight:700;
    line-height:1.1;
  }

  .stat-card.accent .stat-value{
    color:var(--red);
  }

  .stat-label{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
  }

  /* Toolbar */
  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
  }

  .search-wrap{
    position:relative;
    flex:1 1 260px;
  }

  .search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    font-size:14px;
    color:var(--muted);
    pointer-events:none;
  }

  .search-input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--black);
  }

  .search-input:focus{
    outline:none;
    border-color:var(--red);
  }

  .view-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--white);
  }

  .view-toggle button{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:10px 16px;
    border:none;
    background:var(--white);
    color:var(--muted);
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }

  .view-toggle button + button{
    border-left:1px solid var(--line);
  }

  .view-toggle button.active{
    background:var(--black);
    color:var(--white);
  }

  /* Category tabs */
  .cat-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }

  .cat-tab{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }

  .cat-tab:hover{
    border-color:var(--black);
    color:var(--black);
  }

  .cat-tab.active{
    background:var(--black);
    border-color:var(--black);
    color:var(--white);
  }

  .cat-tab .count{
    opacity:0.6;
    margin-left:2px;
  }

  .status-msg{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:14px;
  }

  /* Groups */
  .group{
    margin-bottom:28px;
  }

  .group.group-hidden{
    display:none;
  }

  .group-header{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding-bottom:8px;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }

  /* List mode */
  .ingredient-list{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(20,20,20,0.04);
  }

  .ingredient-list-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:13px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .1s ease;
  }

  .ingredient-list-row:last-child{
    border-bottom:none;
  }

  .ingredient-list-row:hover{
    background:var(--bg);
  }

  .ingredient-list-row .chevron{
    color:var(--line);
    font-size:14px;
    transition:transform .12s ease, color .12s ease;
  }

  .ingredient-list-row:hover .chevron{
    color:var(--red);
    transform:translateX(2px);
  }

  .ingredient-list-row.row-hidden{
    display:none;
  }

  /* Card mode */
  .ingredient-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:12px;
  }

  .ingredient-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(20,20,20,0.04);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }

  .ingredient-card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(20,20,20,0.1);
    border-color:var(--black);
  }

  .ingredient-card.row-hidden{
    display:none;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'Space Mono', monospace;
  }

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,20,20,0.55);
    z-index:100;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
  }

  .modal-overlay.open{
    display:flex;
  }

  .modal{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    max-width:560px;
    width:100%;
    padding:28px;
    box-shadow:0 20px 50px rgba(20,20,20,0.25);
  }

  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }

  .modal-header h2{
    margin:0;
    font-size:19px;
  }

  .modal-close{
    background:none;
    border:none;
    font-size:20px;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    line-height:1;
    color:var(--muted);
    width:32px;
    height:32px;
    border-radius:8px;
    transition:background .12s ease, color .12s ease;
  }

  .modal-close:hover{
    background:var(--bg);
    color:var(--black);
  }

  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .field.full{
    grid-column:1 / -1;
  }

  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
  }

  .field input, .field select{
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--black);
    width:100%;
  }

  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--red);
  }

  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    gap:12px;
  }

  .btn{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.3px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--black);
    padding:11px 20px;
    cursor:pointer;
    transition:all .15s ease;
  }

  .btn:hover{
    background:var(--bg);
    border-color:var(--black);
  }

  .btn-primary{
    background:var(--red);
    border-color:var(--red);
    color:var(--white);
  }

  .btn-primary:hover{
    background:#b30d1d;
    border-color:#b30d1d;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <a href="index.html" class="home-link" title="Home">🏠</a>
      <div>
        <p class="brand-eyebrow">GIOCO OS</p>
        <h1>Ingredientes</h1>
      </div>
    </div>
    <div class="view-toggle">
      <button type="button" id="btnViewList" class="active">☰ Lista</button>
      <button type="button" id="btnViewCards">▦ Cartões</button>
    </div>
  </div>
</header>

<div class="page">
  <div class="stats-bar" id="statsBar"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Pesquisar ingrediente...">
    </div>
  </div>

  <div class="cat-tabs" id="catFilters"></div>

  <div class="status-msg" id="statusMsg">A ligar à base de dados...</div>

  <div id="content"></div>
  <div class="empty-state" id="emptyState" style="display:none;">Nenhum ingrediente encontrado.</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Editar Ingrediente</h2>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <form id="ingredientForm">
      <input type="hidden" id="fId">
      <div class="form-grid">
        <div class="field full">
          <label class="field-label">Nome</label>
          <input type="text" id="fNome" required>
        </div>
        <div class="field">
          <label class="field-label">Categoria</label>
          <select id="fCategoria"></select>
        </div>
        <div class="field">
          <label class="field-label">Unidade</label>
          <input type="text" id="fUnidade" placeholder="ex: kg, un, lt">
        </div>
        <div class="field">
          <label class="field-label">Código Legado</label>
          <input type="text" id="fCodLegado">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var firebaseConfig = {
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var ingredientesRef = db.ref('ingredientes');

  var CATEGORIAS = {
    CH: "Queijos e Laticínios",
    MT: "Carnes e Enchidos",
    PR: "Conservas",
    VG: "Vegetais e Hortícolas",
    FI: "Peixe",
    GR: "Mercearia",
    BR: "Bases (preparados)",
    SA: "Molhos e Preparados internos",
    WT: "Águas",
    BE: "Cerveja (pressão)",
    DR: "Sidra e Vinho (pressão)",
    WI: "Vinhos",
    SD: "Refrigerantes",
    SP: "Licores e Spirits",
    CF: "Café"
  };

  var allIngredientes = {};
  var currentCategoria = "Todas";
  var currentSearch = "";
  var currentView = "list";

  var statsBar = document.getElementById('statsBar');
  var catFilters = document.getElementById('catFilters');
  var content = document.getElementById('content');
  var emptyState = document.getElementById('emptyState');
  var statusMsg = document.getElementById('statusMsg');
  var searchInput = document.getElementById('searchInput');
  var btnViewList = document.getElementById('btnViewList');
  var btnViewCards = document.getElementById('btnViewCards');

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function groupByCategoria() {
    var grupos = {};
    Object.keys(allIngredientes).forEach(function (id) {
      var ing = allIngredientes[id];
      var cat = ing.categoria || null;
      if (!grupos[cat]) grupos[cat] = [];
      grupos[cat].push(Object.assign({ id: id }, ing));
    });
    return grupos;
  }

  function sortedCatKeys(grupos) {
    var catKeys = Object.keys(grupos).filter(function (c) { return c !== 'null'; });
    catKeys.sort(function (a, b) {
      return (CATEGORIAS[a] || a).localeCompare(CATEGORIAS[b] || b);
    });
    if (grupos['null']) catKeys.push('null');
    return catKeys;
  }

  function renderStats() {
    var ids = Object.keys(allIngredientes);
    var total = ids.length;
    var semFornecedor = ids.filter(function (id) { return !allIngredientes[id].fornecedor; }).length;
    var grupos = groupByCategoria();
    var numCategorias = sortedCatKeys(grupos).length;

    var html = '';
    html += '<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">Total de ingredientes</div></div>';
    html += '<div class="stat-card accent"><div class="stat-value">' + semFornecedor + '</div><div class="stat-label">Sem fornecedor atribuído</div></div>';
    html += '<div class="stat-card"><div class="stat-value">' + numCategorias + '</div><div class="stat-label">Categorias</div></div>';
    statsBar.innerHTML = html;
  }

  function renderFilters() {
    var grupos = groupByCategoria();
    var catKeys = sortedCatKeys(grupos);
    var total = Object.keys(allIngredientes).length;

    var html = '';
    html += '<button type="button" class="cat-tab' + (currentCategoria === 'Todas' ? ' active' : '') + '" data-cat="Todas">Todas <span class="count">(' + total + ')</span></button>';

    catKeys.forEach(function (catKey) {
      var label = catKey === 'null' ? 'Sem categoria' : (CATEGORIAS[catKey] || catKey);
      var count = grupos[catKey].length;
      html += '<button type="button" class="cat-tab' + (currentCategoria === catKey ? ' active' : '') + '" data-cat="' + escapeHtml(catKey) + '">' + escapeHtml(label) + ' <span class="count">(' + count + ')</span></button>';
    });

    catFilters.innerHTML = html;

    catFilters.querySelectorAll('.cat-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentCategoria = btn.getAttribute('data-cat');
        renderFilters();
        renderContent();
      });
    });
  }

  function ingredientNode(ing) {
    if (currentView === 'cards') {
      return '<div class="ingredient-card" data-id="' + escapeHtml(ing.id) + '" data-nome="' + escapeHtml((ing.nome || '').toLowerCase()) + '">' + escapeHtml(ing.nome) + '</div>';
    }
    return '<div class="ingredient-list-row" data-id="' + escapeHtml(ing.id) + '" data-nome="' + escapeHtml((ing.nome || '').toLowerCase()) + '">' +
      '<span>' + escapeHtml(ing.nome) + '</span><span class="chevron">›</span></div>';
  }

  function wrapItems(items) {
    if (currentView === 'cards') {
      return '<div class="ingredient-cards">' + items.map(ingredientNode).join('') + '</div>';
    }
    return '<div class="ingredient-list">' + items.map(ingredientNode).join('') + '</div>';
  }

  function renderContent() {
    var grupos = groupByCategoria();

    if (Object.keys(allIngredientes).length === 0) {
      content.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = '';

    if (currentCategoria === 'Todas') {
      var catKeys = sortedCatKeys(grupos);
      catKeys.forEach(function (catKey) {
        var label = catKey === 'null' ? 'Sem categoria' : (CATEGORIAS[catKey] || catKey);
        var items = grupos[catKey].slice().sort(function (a, b) {
          return (a.nome || '').localeCompare(b.nome || '');
        });
        html += '<div class="group" data-cat="' + escapeHtml(catKey) + '">';
        html += '<div class="group-header">' + escapeHtml(label) + '</div>';
        html += wrapItems(items);
        html += '</div>';
      });
    } else {
      var items = (grupos[currentCategoria] || []).slice().sort(function (a, b) {
        return (a.nome || '').localeCompare(b.nome || '');
      });
      html += '<div class="group" data-cat="' + escapeHtml(currentCategoria) + '">';
      html += wrapItems(items);
      html += '</div>';
    }

    content.innerHTML = html;
    applySearchFilter();

    content.querySelectorAll('.ingredient-list-row, .ingredient-card').forEach(function (el) {
      el.addEventListener('click', function () {
        openModal(el.getAttribute('data-id'));
      });
    });
  }

  function applySearchFilter() {
    var search = currentSearch;
    content.querySelectorAll('.ingredient-list-row, .ingredient-card').forEach(function (el) {
      var nome = el.getAttribute('data-nome') || '';
      var visible = !search || nome.indexOf(search) !== -1;
      el.classList.toggle('row-hidden', !visible);
    });

    content.querySelectorAll('.group').forEach(function (grp) {
      var anyVisible = grp.querySelectorAll('.ingredient-list-row:not(.row-hidden), .ingredient-card:not(.row-hidden)').length > 0;
      grp.classList.toggle('group-hidden', !anyVisible);
    });
  }

  searchInput.addEventListener('input', function () {
    currentSearch = searchInput.value.trim().toLowerCase();
    applySearchFilter();
  });

  btnViewList.addEventListener('click', function () {
    if (currentView === 'list') return;
    currentView = 'list';
    btnViewList.classList.add('active');
    btnViewCards.classList.remove('active');
    renderContent();
  });

  btnViewCards.addEventListener('click', function () {
    if (currentView === 'cards') return;
    currentView = 'cards';
    btnViewCards.classList.add('active');
    btnViewList.classList.remove('active');
    renderContent();
  });

  ingredientesRef.on('value', function (snapshot) {
    allIngredientes = snapshot.val() || {};
    statusMsg.textContent = "";
    renderStats();
    renderFilters();
    renderContent();
  }, function (error) {
    statusMsg.textContent = "Erro de ligação à base de dados: " + error.message;
  });

  // Modal de edição
  var modalOverlay = document.getElementById('modalOverlay');
  var modalClose = document.getElementById('modalClose');
  var btnCancelar = document.getElementById('btnCancelar');
  var ingredientForm = document.getElementById('ingredientForm');
  var fCategoria = document.getElementById('fCategoria');

  var catOptionsHtml = '<option value="">Sem categoria</option>' + Object.keys(CATEGORIAS).map(function (key) {
    return '<option value="' + escapeHtml(key) + '">' + escapeHtml(CATEGORIAS[key]) + '</option>';
  }).join('');
  fCategoria.innerHTML = catOptionsHtml;

  function openModal(id) {
    var ing = allIngredientes[id];
    if (!ing) return;
    document.getElementById('fId').value = id;
    document.getElementById('fNome').value = ing.nome || "";
    fCategoria.value = ing.categoria || "";
    document.getElementById('fUnidade').value = ing.unidade || "";
    document.getElementById('fCodLegado').value = ing.codLegado || "";
    modalOverlay.classList.add('open');
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
  }

  modalClose.addEventListener('click', closeModal);
  btnCancelar.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  ingredientForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('fId').value;
    if (!id) return;
    var data = {
      nome: document.getElementById('fNome').value.trim(),
      categoria: fCategoria.value || null,
      unidade: document.getElementById('fUnidade').value.trim() || null,
      codLegado: document.getElementById('fCodLegado').value.trim() || null
    };
    if (!data.nome) return;
    ingredientesRef.child(id).update(data);
    closeModal();
  });

});
</script>

</body>
</html>
