<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIOCO — Ingredientes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono,.field-label{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  .home-link{
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--white);
    text-decoration:none;
    border:2px solid var(--white);
    padding:6px 10px;
    white-space:nowrap;
  }

  .home-link:hover{
    background:var(--white);
    color:var(--red);
  }

  .page-title{
    font-family:'Space Mono', monospace;
    font-size:14px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .layout{
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:flex-start;
    min-height:calc(100vh - 73px);
  }

  /* Sidebar */
  .sidebar{
    width:190px;
    flex:0 0 190px;
    background:var(--white);
    border-right:1px solid #e0ddd4;
    min-height:calc(100vh - 73px);
    padding:20px 0;
  }

  .sidebar-title{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#888;
    letter-spacing:0.5px;
    padding:0 14px 10px;
  }

  .cat-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    font-size:13px;
    padding:8px 14px;
    color:#333;
    cursor:pointer;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
    font-family:'Inter', sans-serif;
  }

  .cat-item:hover{
    background:#f2ede4;
  }

  .cat-item.active{
    background:var(--red);
    color:var(--white);
  }

  .cat-item.active:hover{
    background:var(--red);
  }

  /* Panel */
  .panel{
    flex:1 1 auto;
    padding:24px 28px;
    min-width:0;
  }

  .toolbar{
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
  }

  .search-input{
    flex:1 1 260px;
    padding:10px 14px;
    border:1px solid #ccc;
    background:var(--white);
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--black);
  }

  .search-input:focus{
    outline:none;
    border-color:var(--red);
  }

  .view-toggle{
    display:flex;
    border:1px solid #ccc;
    overflow:hidden;
  }

  .view-toggle button{
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:10px 16px;
    border:none;
    background:var(--white);
    color:#666;
    cursor:pointer;
  }

  .view-toggle button.active{
    background:var(--black);
    color:var(--white);
  }

  .status-msg{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:14px;
  }

  .group{
    margin-bottom:22px;
  }

  .group.group-hidden{
    display:none;
  }

  .group-header{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:400;
    color:#b0a99a;
    letter-spacing:0.5px;
    padding-bottom:6px;
    margin-bottom:10px;
    border-bottom:1px solid #e3ddd0;
  }

  /* List mode */
  .ingredient-list-row{
    font-size:13px;
    padding:5px 0;
    border-bottom:1px solid #eee;
  }

  .ingredient-list-row.row-hidden{
    display:none;
  }

  /* Card mode */
  .ingredient-cards{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }

  .ingredient-card{
    background:var(--white);
    border:1px solid #e0ddd4;
    border-radius:6px;
    padding:10px;
    font-size:13px;
    font-weight:500;
  }

  .ingredient-card.row-hidden{
    display:none;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'Space Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="home-link">🏠 Home</a>
    <span class="brand-mark">● GIOCO®</span>
    <span class="page-title">Ingredientes</span>
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">CATEGORIAS</div>
    <div id="catList"></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="Pesquisar ingrediente...">
      <div class="view-toggle">
        <button type="button" id="btnViewList" class="active">☰ Lista</button>
        <button type="button" id="btnViewCards">▦ Cartões</button>
      </div>
    </div>

    <div class="status-msg" id="statusMsg">A ligar à base de dados...</div>

    <div id="content"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Nenhum ingrediente encontrado.</div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var firebaseConfig = {
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var ingredientesRef = db.ref('ingredientes');

  var CATEGORIAS = {
    CH: "Queijos e Laticínios",
    MT: "Carnes e Enchidos",
    PR: "Conservas",
    VG: "Vegetais e Hortícolas",
    FI: "Peixe",
    GR: "Mercearia",
    BR: "Bases (preparados)",
    SA: "Molhos e Preparados internos",
    WT: "Águas",
    BE: "Cerveja (pressão)",
    DR: "Sidra e Vinho (pressão)",
    WI: "Vinhos",
    SD: "Refrigerantes",
    SP: "Licores e Spirits",
    CF: "Café"
  };

  var allIngredientes = {};
  var currentCategoria = "Todas";
  var currentSearch = "";
  var currentView = "list";

  var sidebar = document.getElementById('catList');
  var content = document.getElementById('content');
  var emptyState = document.getElementById('emptyState');
  var statusMsg = document.getElementById('statusMsg');
  var searchInput = document.getElementById('searchInput');
  var btnViewList = document.getElementById('btnViewList');
  var btnViewCards = document.getElementById('btnViewCards');

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function groupByCategoria() {
    var grupos = {};
    Object.keys(allIngredientes).forEach(function (id) {
      var ing = allIngredientes[id];
      var cat = ing.categoria || null;
      if (!grupos[cat]) grupos[cat] = [];
      grupos[cat].push(Object.assign({ id: id }, ing));
    });
    return grupos;
  }

  function sortedCatKeys(grupos) {
    var catKeys = Object.keys(grupos).filter(function (c) { return c !== 'null'; });
    catKeys.sort(function (a, b) {
      return (CATEGORIAS[a] || a).localeCompare(CATEGORIAS[b] || b);
    });
    if (grupos['null']) catKeys.push('null');
    return catKeys;
  }

  function renderSidebar() {
    var grupos = groupByCategoria();
    var catKeys = sortedCatKeys(grupos);
    var total = Object.keys(allIngredientes).length;

    var html = '';
    html += '<button type="button" class="cat-item' + (currentCategoria === 'Todas' ? ' active' : '') + '" data-cat="Todas">' +
      '<span>Todas</span><span>(' + total + ')</span></button>';

    catKeys.forEach(function (catKey) {
      var label = catKey === 'null' ? 'Sem categoria' : (CATEGORIAS[catKey] || catKey);
      var count = grupos[catKey].length;
      html += '<button type="button" class="cat-item' + (currentCategoria === catKey ? ' active' : '') + '" data-cat="' + escapeHtml(catKey) + '">' +
        '<span>' + escapeHtml(label) + '</span><span>(' + count + ')</span></button>';
    });

    sidebar.innerHTML = html;

    sidebar.querySelectorAll('.cat-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentCategoria = btn.getAttribute('data-cat');
        renderSidebar();
        renderContent();
      });
    });
  }

  function ingredientNode(ing) {
    if (currentView === 'cards') {
      return '<div class="ingredient-card" data-nome="' + escapeHtml((ing.nome || '').toLowerCase()) + '">' + escapeHtml(ing.nome) + '</div>';
    }
    return '<div class="ingredient-list-row" data-nome="' + escapeHtml((ing.nome || '').toLowerCase()) + '">' + escapeHtml(ing.nome) + '</div>';
  }

  function wrapItems(items) {
    if (currentView === 'cards') {
      return '<div class="ingredient-cards">' + items.map(ingredientNode).join('') + '</div>';
    }
    return items.map(ingredientNode).join('');
  }

  function renderContent() {
    var grupos = groupByCategoria();

    if (Object.keys(allIngredientes).length === 0) {
      content.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = '';

    if (currentCategoria === 'Todas') {
      var catKeys = sortedCatKeys(grupos);
      catKeys.forEach(function (catKey) {
        var label = catKey === 'null' ? 'Sem categoria' : (CATEGORIAS[catKey] || catKey);
        var items = grupos[catKey].slice().sort(function (a, b) {
          return (a.nome || '').localeCompare(b.nome || '');
        });
        html += '<div class="group" data-cat="' + escapeHtml(catKey) + '">';
        html += '<div class="group-header">' + escapeHtml(label) + '</div>';
        html += wrapItems(items);
        html += '</div>';
      });
    } else {
      var items = (grupos[currentCategoria] || []).slice().sort(function (a, b) {
        return (a.nome || '').localeCompare(b.nome || '');
      });
      html += '<div class="group" data-cat="' + escapeHtml(currentCategoria) + '">';
      html += wrapItems(items);
      html += '</div>';
    }

    content.innerHTML = html;
    applySearchFilter();
  }

  function applySearchFilter() {
    var search = currentSearch;
    content.querySelectorAll('.ingredient-list-row, .ingredient-card').forEach(function (el) {
      var nome = el.getAttribute('data-nome') || '';
      var visible = !search || nome.indexOf(search) !== -1;
      el.classList.toggle('row-hidden', !visible);
    });

    content.querySelectorAll('.group').forEach(function (grp) {
      var anyVisible = grp.querySelectorAll('.ingredient-list-row:not(.row-hidden), .ingredient-card:not(.row-hidden)').length > 0;
      grp.classList.toggle('group-hidden', !anyVisible);
    });
  }

  searchInput.addEventListener('input', function () {
    currentSearch = searchInput.value.trim().toLowerCase();
    applySearchFilter();
  });

  btnViewList.addEventListener('click', function () {
    if (currentView === 'list') return;
    currentView = 'list';
    btnViewList.classList.add('active');
    btnViewCards.classList.remove('active');
    renderContent();
  });

  btnViewCards.addEventListener('click', function () {
    if (currentView === 'cards') return;
    currentView = 'cards';
    btnViewCards.classList.add('active');
    btnViewList.classList.remove('active');
    renderContent();
  });

  ingredientesRef.on('value', function (snapshot) {
    allIngredientes = snapshot.val() || {};
    statusMsg.textContent = "";
    renderSidebar();
    renderContent();
  }, function (error) {
    statusMsg.textContent = "Erro de ligação à base de dados: " + error.message;
  });

});
</script>

</body>
</html>
