<html lang="pt-PT">
<head>

<meta charset="UTF-8">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta name="apple-mobile-web-app-title" content="Calendário">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="gioco-compromissos.js"></script>
<script src="gioco-pagamentos.js"></script>
<script src="gioco-eventos.js"></script>
<!-- MSAL Browser 2.38.2 (CDN da Microsoft, mesma classe de confiança do gstatic
     de onde já vem o Firebase). Versão FIXA e integrity obrigatório: os bytes
     deste URL foram conferidos contra o tarball oficial do npm. Nunca "latest".
     É a única dependência de terceiros do OS fora do Firebase/pdf.js. -->
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"
        integrity="sha384-hhkHFODse2T75wPL7oJ0RZ+0CgRa74LNPhgx6wO6DMNEhU3/fSbTZdVzxsgyUelp"
        crossorigin="anonymous"></script>
<script src="gioco-outlook.js"></script>

<style>
  body{ -webkit-font-smoothing:antialiased; }

  .page-subtitle{ margin:0 0 4px; font-size:13px; color:var(--muted); }

  /* ---------- Erro de autenticação (padrão do OS) ---------- */
  #authErro{ display:none; margin:18px 0 0; }
  #authErro.on{ display:block; }
  .auth-box{ border-left:4px solid var(--red); background:var(--white); border-radius:12px; padding:20px 22px; }
  .auth-box h2{ margin:0 0 8px; font-family:'Inter',sans-serif; font-size:15px; font-weight:700; color:var(--red-ink); }
  .auth-box p{ margin:0 0 16px; font-size:13.5px; color:var(--muted); line-height:1.55; }

  /* O ::before do .glass-light pinta por cima do conteúdo estático: empurrar
     o conteúdo para z-index:1 (mesmo truque do shell na sidebar). */
  .cal-bar > *, .cal-vista > *, .dia-painel > *{ position:relative; z-index:1; }

  /* ---------- Barra de controlo ---------- */
  .cal-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:18px 0 10px; padding:14px 18px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav .icon-btn{ padding:0; font:inherit; }
  .cal-titulo{ flex:1; text-align:center; font-family:'Inter',sans-serif; font-weight:600; font-size:17px; color:var(--ink); min-width:220px; }
  .cal-dir{ display:flex; align-items:center; gap:10px; }

  /* Botão outline local (padrão .btn da pagamentos.html — não é classe do shell). */
  .btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:var(--white); color:var(--ink);
    border:1.5px solid var(--line); border-radius:100px;
    padding:9px 18px; cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, background .15s ease, color .15s ease;
  }
  .btn:hover{ border-color:var(--red); }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-add .icon{ width:14px; height:14px; }

  /* Toggle da camada de pagamentos: pílula com círculo --blush. */
  .camada-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:var(--white); color:var(--ink); border:1.5px solid var(--line); border-radius:100px;
    padding:7px 14px 7px 9px; cursor:pointer; transition:border-color .15s ease, opacity .15s ease;
  }
  .camada-btn i{ width:12px; height:12px; border-radius:50%; background:var(--blush); display:inline-block; }
  .camada-btn:hover{ border-color:var(--red); }
  .camada-btn[aria-pressed="false"]{ opacity:.55; }
  .camada-btn[aria-pressed="false"] i{ background:transparent; box-shadow:inset 0 0 0 2px var(--blush); }
  /* ---------- Camada Outlook ----------
     Par neutro derivado da família --line / --muted do shell: as seis
     superfícies de selo (lime, navy, mustard, red, blush, sky) estão todas
     tomadas pelas categorias e o --blush é dos pagamentos, por isso a camada
     de leitura do Outlook é cinzenta de propósito — informativa, não
     acionável, e imediatamente distinta das outras duas. Par claro/escuro
     obrigatório: é superfície COM texto por cima. */
  :root{ --out-bg:#ddd8cf; --out-ink:#33302a; }
  [data-theme="dark"]{ --out-bg:#37332c; --out-ink:#e6e0d4; }

  .camada-btn.out i{ background:var(--out-bg); box-shadow:inset 0 0 0 1px var(--muted); }
  /* Sem sessão Microsoft o mesmo botão vira "Ligar Outlook": sem ponto de
     camada e sem o esbatido do aria-pressed="false" (que só faz sentido
     quando já há camada para ligar/desligar). */
  .camada-btn.ligar{ opacity:1; padding-left:14px; }
  .camada-btn.ligar i{ display:none; }
  .camada-btn.out[aria-pressed="false"] i{ background:transparent; box-shadow:inset 0 0 0 2px var(--out-bg); }
  /* Abre o painel da conta Microsoft (giocoModal). Colado ao chip da camada. */
  .camada-mais{
    background:var(--white); color:var(--muted); border:1.5px solid var(--line);
    border-radius:100px; width:28px; height:28px; padding:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; margin-left:-4px;
  }
  .camada-mais:hover{ border-color:var(--red); color:var(--ink); }
  /* O display:inline-flex das classes acima vence o [hidden] do browser:
     sem estas duas regras, esconder por hidden não fazia nada. */
  .camada-btn[hidden], .camada-mais[hidden]{ display:none; }
  .camada-mais .icon{ width:14px; height:14px; }
  /* Erro do Graph / do login: discreto ao lado da camada, e CLICÁVEL — no
     telemóvel não há hover nem consola, por isso o detalhe tem de abrir num
     painel em vez de viver só num title=. */
  .out-erro{
    font-size:11.5px; color:var(--red-ink); cursor:pointer;
    background:none; border:none; padding:0; font-family:'Inter',sans-serif;
    text-decoration:underline; text-underline-offset:2px;
  }
  .out-erro:hover{ color:var(--ink); }
  .out-erro[hidden]{ display:none; }
  /* Painel de diagnóstico do login. */
  .diag{ color:var(--ink); font-size:13px; }
  .diag p{ margin:0 0 12px; color:var(--muted); font-size:12.5px; line-height:1.5; }
  .diag pre{
    margin:0 0 14px; padding:12px; border-radius:10px;
    background:var(--dough); border:1px solid var(--line);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto;
    color:var(--ink); -webkit-user-select:text; user-select:text;
  }
  .out-conta{ color:var(--ink); font-size:13px; }
  .out-conta .out-email{ font-weight:600; margin:0 0 4px; }
  .out-conta p{ margin:0 0 14px; color:var(--muted); font-size:12.5px; line-height:1.5; }

  .ev-chip.out{ background:var(--out-bg); color:var(--out-ink); }
  .ev-bloco.out{ background:var(--out-bg); color:var(--out-ink); }

  .sem-data{ font-size:11.5px; color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--muted); }
  .sem-data:hover{ color:var(--red-ink); border-bottom-color:var(--red-ink); }

  .seg{ display:inline-flex; border:1.5px solid var(--line); border-radius:100px; padding:3px; background:var(--white); }
  .seg button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:transparent; color:var(--ink); border:none; border-radius:100px;
    padding:6px 14px; cursor:pointer;
  }
  .seg button.active{ background:var(--ink); color:var(--dough); }

  .cal-legenda{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; font-size:11.5px; color:var(--muted); margin:0 6px 16px; }
  .cal-legenda span{ display:inline-flex; align-items:center; gap:6px; }
  .cal-legenda i{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  /* ---------- Vista ---------- */
  .cal-vista{ padding:16px; color:var(--ink); }
  .cal-vista:hover{ transform:none; }
  /* Na vista Mês o painel do dia é sticky: o overflow:hidden do .glass-light
     prendia-o ao cartão, por isso aqui fica visível (o ::before já tem raio). */
  .cal-vista.vista-mes{ overflow:visible; }

  /* Chip de evento (mês e faixa dia-inteiro da semana). Cores de texto fixas
     por categoria (como .status.* do shell), nunca var(--ink). */
  .ev-chip{
    display:block; height:20px; line-height:20px; border-radius:6px; padding:0 7px;
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; border:none; width:100%; text-align:left;
  }
  .ev-chip:hover{ filter:brightness(0.94); }
  .ev-chip .num{ font-weight:500; margin-right:3px; }
  /* Evento nascido de um pedido da loja (ligacao.tipo 'lojaPedido'): ícone store antes do título. */
  .ev-chip .icon, .ev-bloco .icon, .dia-item-t .icon{ width:14px; height:14px; vertical-align:-2px; margin-right:4px; }
  /* Chip de pagamento (fonte 'pagamentos'): --blush + texto fixo; pago = ✓ e esbatido. */
  .ev-chip.pag{ background:var(--blush); color:#141414; }
  .ev-chip.pag .num{ margin:0 0 0 4px; opacity:.85; }
  .ev-chip.pago{ opacity:.55; }

  /* ---------- Mês ---------- */
  .mes-cab{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin-bottom:6px; }
  .mes-cab div{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:center; padding:2px 0 4px; }
  .mes-grelha{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); grid-template-rows:repeat(6, 108px); gap:6px; }
  .mes-cel{
    position:relative; border-radius:10px; padding:6px 6px 4px;
    background:var(--white); border:1.5px solid var(--line); color:var(--ink);
    display:flex; flex-direction:column; gap:3px; cursor:pointer; overflow:hidden;
    transition:border-color .15s ease;
  }
  .mes-cel:hover{ border-color:var(--ink); }
  /* Dia selecionado (painel aberto): anel de 2px --ink por dentro nos DOIS temas
     (o --ink já inverte com o tema), sem tocar na pílula de hoje. */
  .mes-cel.sel{ box-shadow:inset 0 0 0 2px var(--ink); }
  /* Grelha + painel de detalhe lado a lado (mesmo padrão da padroes.html). */
  .mes-layout{ display:flex; gap:16px; align-items:flex-start; }
  .mes-grelha-wrap{ flex:1; min-width:640px; }
  .mes-layout .dia-painel{ width:auto; min-width:300px; max-width:360px; flex:0 1 360px; position:sticky; top:16px; }
  /* Na vista Mês, clicar em qualquer zona livre do painel abre a vista Dia. */
  .dia-painel[data-abrir-dia]{ cursor:pointer; }
  .mes-cel.fds{ background:var(--dough); }
  .mes-cel.fora{ opacity:.4; }
  .mes-num{ align-self:flex-start; font-size:11.5px; font-weight:600; color:var(--muted); padding:1px 6px; border-radius:100px; line-height:16px; cursor:pointer; user-select:none; }
  .mes-cel.hoje .mes-num{ background:var(--red); color:var(--on-red); }
  .mes-mais{ font-size:11px; font-weight:600; color:var(--muted); background:none; border:none; padding:0 7px; text-align:left; cursor:pointer; font-family:'Inter',sans-serif; }
  .mes-mais:hover{ color:var(--red-ink); }

  /* ---------- Semana / Dia (grelha horária) ---------- */
  .sem-cab{ display:grid; grid-template-columns:56px repeat(var(--ncols,7), minmax(0,1fr)); gap:0; margin-bottom:4px; }
  .sem-cab .sem-dia{ text-align:center; font-size:12px; font-weight:600; color:var(--muted); padding:2px 0 6px; }
  .sem-cab .sem-dia b{ font-weight:700; color:var(--ink); padding:1px 7px; border-radius:100px; }
  .sem-cab .sem-dia.hoje b{ background:var(--red); color:var(--on-red); }
  .sem-inteiro{ display:grid; grid-template-columns:56px repeat(var(--ncols,7), minmax(0,1fr)); gap:0; border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:4px; }
  .sem-inteiro .sem-lbl{ font-size:10.5px; color:var(--muted); padding-top:2px; }
  .sem-inteiro .sem-di-col{ display:flex; flex-direction:column; gap:3px; padding:0 3px; min-height:22px; cursor:pointer; }
  .sem-scroll{ max-height:600px; overflow-y:auto; overflow-x:hidden; border-radius:8px; }
  .sem-grelha{ display:grid; grid-template-columns:56px repeat(var(--ncols,7), minmax(0,1fr)); gap:0; height:816px; }
  .hora-col{ position:relative; height:816px; }
  .hora-lbl{ position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--muted); }
  .dia-col{ position:relative; height:816px; border-left:1px solid var(--line); }
  .dia-col.fds{ background:var(--dough); }
  .hora-cel{ position:absolute; left:0; right:0; height:48px; border-top:1px solid var(--line); cursor:pointer; }
  .hora-cel:hover{ background:rgba(217,17,36,0.06); }
  .ev-bloco{
    position:absolute; border-radius:8px; padding:3px 6px; overflow:hidden; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:11.5px; line-height:1.25;
    border:none; text-align:left; box-shadow:0 1px 0 rgba(0,0,0,0.08);
  }
  .ev-bloco:hover{ filter:brightness(0.94); }
  .ev-bloco b{ display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev-bloco .num{ font-size:10.5px; opacity:.85; }

  /* ---------- Dia ---------- */
  .dia-layout{ display:flex; gap:16px; align-items:flex-start; }
  .dia-grelha{ flex:1; min-width:0; }
  .dia-painel{ min-width:300px; width:300px; flex-shrink:0; padding:16px; color:var(--ink); }
  .dia-painel:hover{ transform:none; }
  .dia-painel-cab{ display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .dia-painel-cab h3{ flex:1; min-width:0; margin:0; font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dia-painel-cab .icon-btn{ width:32px; height:32px; padding:0; flex-shrink:0; font:inherit; }
  .dia-rodape{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .dia-abrir{ font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); background:none; border:none; padding:0; cursor:pointer; }
  .dia-abrir:hover{ color:var(--red-ink); }
  .dia-item{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--ink); font-family:'Inter',sans-serif; }
  .dia-item:last-child{ border-bottom:none; }
  .dia-item:hover .dia-item-t{ color:var(--red-ink); }
  .dia-item i{ width:4px; border-radius:2px; flex-shrink:0; align-self:stretch; }
  .dia-item-t{ font-size:13px; font-weight:600; }
  .dia-item-h{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .dia-item-n{ font-size:12px; color:var(--muted); margin-top:4px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; }
  .dia-vazio{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .dia-sec{ margin:16px 0 6px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .dia-pag{ display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--ink); font-family:'Inter',sans-serif; }
  .dia-pag:last-of-type{ border-bottom:none; }
  .dia-pag i{ width:4px; border-radius:2px; flex-shrink:0; align-self:stretch; background:var(--blush); min-height:28px; }
  .dia-pag .dia-pag-t{ flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dia-pag:hover .dia-pag-t{ color:var(--red-ink); }
  .dia-pag .dia-pag-v{ font-size:12.5px; font-weight:600; }
  .dia-pag.pago .dia-pag-t, .dia-pag.pago .dia-pag-v{ opacity:.6; }
  .dia-pag-total{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:8px; }
  .dia-pag-total b{ color:var(--ink); }

  /* Detalhe só de leitura de um pagamento (giocoModal). */
  .pag-detalhe{ color:var(--ink); font-size:13px; }
  .pag-detalhe .pag-titulo{ font-size:15px; font-weight:700; margin:0 0 6px; }
  .pag-detalhe .pag-valor{ font-size:28px; font-weight:700; margin:0 0 10px; }
  .pag-detalhe .pag-kv{ display:flex; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
  .pag-detalhe .pag-kv span:first-child{ width:90px; flex-shrink:0; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; padding-top:2px; }
  .pag-detalhe .pag-notas{ white-space:pre-line; line-height:1.45; }
  /* O detalhe do Outlook tem o rotulo "Videochamada", que nao cabe nos 90px
     da coluna de labels (o span tem flex-shrink:0 e transbordava por cima do
     valor). Modificador so para este modal — o dos pagamentos fica igual. */
  .pag-detalhe.out-detalhe .pag-kv span:first-child{ width:112px; }
  a.btn-add{ text-decoration:none; }

  /* O formulário do modal de evento vive em gioco-eventos.css (.ev-*). */

  /* ======================================================================
     PEÇAS DE TELEMÓVEL — estado de base (desktop): NÃO EXISTEM.
     Tudo o que é só de telemóvel fica display:none aqui e só ganha layout
     dentro do @media (max-width:767px) no fim deste <style>. Assim, em
     >=768px a página fica byte a byte o que era: nem barra de datas, nem
     bottom sheets, nem botão flutuante, nem vista Agenda.
     ====================================================================== */
  .mob-bar, .mob-bg, .mob-sheet, .mob-sheet-cab, .fab, .cal-camadas-btn{ display:none; }
  /* Wrapper dos toggles de camadas: em desktop é a linha de chips de sempre
     (o gap:10px do antigo .cal-dir, para o espaçamento não mudar). */
  .cal-camadas{ display:flex; align-items:center; gap:10px; }

  /* ======================================================================
     TELEMÓVEL (< 768px) — esqueleto de navegação do Outlook mobile, com o
     design system GIOCO (Set/2026, 2.ª versão: a dos pontos foi rejeitada).
     Regra única para o calendário inteiro. Nada aqui toca no gioco-shell.css
     nem no gioco-eventos.css — as únicas classes do shell que se redefinem
     são as do giocoModal (ecrã inteiro), e só dentro desta query.

     Peças: .mob-bar (sticky) = linha 1 (mês + camadas + Hoje) + faixa de
     datas (.mob-faixa: 1 semana, ou o mês inteiro quando expandida) +
     puxador + selector Agenda / Dia / Mês. A barra de desktop (.cal-bar),
     a legenda e a vista Semana deixam de existir abaixo de 768px.
     ====================================================================== */
  @media (max-width: 767px){

    .cal-bar, .cal-legenda{ display:none; }
    .page-subtitle{ display:none; }

    /* ---------- Barra de datas sticky ---------- */
    .mob-bar{
      display:block; position:sticky; top:0; z-index:40;
      /* Sangra até às margens do .main (16px no shell-mobile) para a barra
         ir de lado a lado e o conteúdo passar por baixo sem se ver. */
      margin:6px -16px 10px; padding:6px 12px 0;
      background:var(--dough); color:var(--ink);
      border-bottom:1px solid var(--line);
    }
    .mob-l1{ display:flex; align-items:center; gap:8px; min-height:44px; }
    .mob-titulo{
      flex:1; min-width:0; display:inline-flex; align-items:center; gap:4px;
      background:none; border:none; padding:0 4px; min-height:44px; cursor:pointer;
      font-family:'Inter',sans-serif; font-size:19px; font-weight:700; color:var(--ink);
      text-align:left;
    }
    .mob-titulo span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mob-titulo .icon{ width:18px; height:18px; flex-shrink:0; color:var(--muted); transition:transform .18s ease; }
    .mob-bar.expandida .mob-titulo .icon{ transform:rotate(180deg); }
    .mob-l1-dir{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .cal-camadas-btn{
      display:inline-flex; align-items:center; justify-content:center;
      width:44px; height:44px; padding:0; flex-shrink:0;
      background:var(--white); color:var(--ink);
      border:1.5px solid var(--line); border-radius:100px; cursor:pointer;
    }
    .cal-camadas-btn[aria-expanded="true"]{ border-color:var(--red); color:var(--red-ink); }
    .mob-hoje{ min-height:44px; padding:9px 16px; }

    /* Faixa: cabeçalho de iniciais + 1 linha (semana) ou 5–6 linhas (mês). */
    .mob-faixa{ touch-action:none; -webkit-user-select:none; user-select:none; padding:2px 0 0; }
    .mob-faixa-cab, .mob-faixa-linha{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:2px; }
    .mob-faixa-cab span{ text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--muted); padding:2px 0; }
    .mob-dia{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      min-height:44px; padding:2px 0; background:none; border:none; cursor:pointer;
      font-family:'Inter',sans-serif; color:var(--ink);
    }
    .mob-dia b{
      display:inline-flex; align-items:center; justify-content:center;
      width:32px; height:32px; border-radius:50%;
      font-size:15px; font-weight:600; line-height:1;
      box-sizing:border-box;
    }
    .mob-dia.fora b{ color:var(--muted); opacity:.55; }
    /* Seleccionado: contorno --ink. Hoje: pílula --red com número branco.
       Hoje E seleccionado: pílula vermelha com o anel por fora. */
    .mob-dia.sel b{ box-shadow:inset 0 0 0 2px var(--ink); }
    .mob-dia.hoje b{ background:var(--red); color:var(--on-red); box-shadow:none; }
    .mob-dia.hoje.sel b{ box-shadow:0 0 0 2px var(--dough), 0 0 0 4px var(--ink); }
    /* Ponto de 4px: o dia tem pelo menos um item nas camadas activas. */
    .mob-dia i{ width:4px; height:4px; border-radius:50%; background:var(--muted); opacity:0; }
    .mob-dia.tem i{ opacity:1; }
    .mob-dia.hoje.tem i{ background:var(--red); }

    /* Puxador: toque alterna, arrasto para baixo expande, para cima colapsa. */
    .mob-puxador{
      display:flex; align-items:center; justify-content:center;
      width:100%; height:26px; margin:0; padding:0;
      background:none; border:none; cursor:grab; touch-action:none;
    }
    .mob-puxador span{ width:40px; height:4px; border-radius:2px; background:var(--line); }
    .mob-puxador:active span{ background:var(--muted); }

    /* Selector de vistas: segmentado a toda a largura (a mesma .seg local). */
    .mob-seg{ display:flex; width:100%; margin:0 0 8px; }
    .mob-seg button{ flex:1 1 0; min-width:0; min-height:44px; font-size:13px; }

    .cal-vista{ padding:10px; }
    /* A vista Agenda tem cabeçalhos de dia sticky: o overflow:hidden do
       .glass-light prendia-os (mesma razão da .vista-mes em desktop). */
    .cal-vista.vista-agenda{ overflow:visible; padding:0 12px 6px; }

    /* ---------- Vista Agenda ---------- */
    .ag-cab{
      position:sticky; top:var(--mob-bar-h, 168px); z-index:2;
      display:flex; align-items:baseline; gap:6px; width:100%;
      margin:0; padding:10px 4px 6px; cursor:pointer;
      background:var(--white); border:none; border-bottom:1px solid var(--line);
      font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--muted); text-align:left;
    }
    .ag-cab b{ font-size:15px; font-weight:700; color:var(--ink); }
    .ag-dia.hoje .ag-cab b{ color:var(--red-ink); }
    .ag-dia.hoje .ag-cab::after{ content:'Hoje'; margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--red-ink); }
    .ag-item{ display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 4px; }
    .ag-item .ag-hora{ width:46px; flex-shrink:0; display:flex; flex-direction:column; line-height:1.15; }
    .ag-item .ag-hora b{ font-size:13px; font-weight:600; color:var(--ink); }
    .ag-item .ag-hora small{ font-size:11px; color:var(--muted); }
    .ag-item .ag-ponto{ width:8px; height:8px; border-radius:50%; flex-shrink:0; align-self:center; }
    .ag-item .ag-txt{ flex:1; min-width:0; }
    .ag-item .dia-item-t{ font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ag-item .dia-item-h{ font-size:12px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ag-item .dia-pag-v{ font-weight:600; color:var(--ink); }
    .ag-item.pago .dia-item-t, .ag-item.pago .dia-item-h{ opacity:.6; }
    .ag-vazio{ padding:28px 4px; text-align:center; }
    .ag-fim{ display:flex; justify-content:center; padding:14px 0 8px; }
    .ag-fim .btn{ min-height:44px; }

    /* Anulados / cancelados (qualquer fonte que os traga marcados). */
    .dia-item.cancelado .dia-item-t, .dia-pag.cancelado .dia-pag-t{ text-decoration:line-through; }
    .dia-item.cancelado, .dia-pag.cancelado{ opacity:.55; }
    .ev-chip.cancelado{
      background:transparent !important; color:var(--red) !important;
      box-shadow:inset 0 0 0 1.5px var(--red); text-decoration:line-through;
    }

    /* ---------- Vista Mês: chips de texto, altura do ecrã ---------- */
    .mes-layout{ display:block; }
    .mes-grelha-wrap{ min-width:0; }
    /* O painel lateral não existe em telemóvel: o dia abre em bottom sheet. */
    .mes-layout .dia-painel{ display:none; }
    .mes-cab{ gap:2px; margin-bottom:2px; }
    .mes-cab div{ font-size:9.5px; letter-spacing:.04em; padding:0 0 2px; }
    /* A altura é escrita pelo JS (ajustarAlturaMes) = o que sobra do ecrã;
       as 6 linhas partilham-na em partes iguais e as células cortam o que
       não cabe. grid-template-rows:auto é só o fallback antes do JS. */
    .mes-grelha{ gap:2px; grid-template-rows:repeat(6, minmax(0,1fr)); }
    .mes-cel{ padding:3px 2px 2px; gap:2px; border-width:1px; border-radius:6px; min-height:0; }
    .mes-cel.fds{ background:var(--white); }
    .mes-cel.col-sel{ background:rgba(20,20,20,0.06); }
    [data-theme="dark"] .mes-cel.col-sel{ background:rgba(255,255,255,0.07); }
    .mes-cel.sel{ box-shadow:inset 0 0 0 2px var(--ink); }
    .mes-num{ font-size:12px; padding:1px 5px; line-height:16px; }
    .mes-cel .ev-chip{ height:16px; line-height:16px; font-size:10px; padding:0 4px; border-radius:4px; }
    .mes-cel .ev-chip .num, .mes-cel .ev-chip .icon{ display:none; }
    .mes-cel .mes-mais{ font-size:10px; padding:0 4px; line-height:14px; }

    /* ---------- Vista Dia: uma coluna, "Todo o dia" no topo ---------- */
    .dia-layout{ display:block; }
    .dia-painel{ width:auto; min-width:0; margin-top:12px; padding:14px; }
    .sem-cab{ display:none; }
    .sem-inteiro .sem-lbl{ font-size:0; }
    .sem-inteiro .sem-lbl::before{ content:'Todo o dia'; font-size:10.5px; }
    .sem-inteiro .sem-di-col{ min-height:24px; }
    .sem-scroll{ max-height:calc(100dvh - var(--mob-bar-h, 168px) - 120px); min-height:320px; }
    .hora-cel:hover{ background:none; }

    /* Alvos de toque: 44px efectivos nas listas. */
    .dia-item, .dia-pag{ min-height:44px; padding:11px 0; align-items:center; }

    /* ---------- Bottom sheets ----------
       Um fundo partilhado e duas folhas: o dia (#diaSheet) e as camadas
       (o próprio #calCamadas, que em desktop é a linha de chips). */
    /* A linha de chips sai da barra: ao telemóvel este elemento só existe
       como folha, aberta pelo botão de camadas. */
    .cal-camadas{ display:none; }
    .mob-bg.aberto{
      display:block; position:fixed; inset:0;
      background:rgba(20,20,20,0.45); z-index:75;
    }
    .mob-sheet.aberta, .cal-camadas.aberta{
      display:flex; flex-direction:column; align-items:stretch;
      position:fixed; left:0; right:0; bottom:0; z-index:76;
      max-height:82dvh;
      padding:0 0 calc(8px + env(safe-area-inset-bottom));
      background:var(--white); color:var(--ink);
      border-top:1px solid var(--line);
      border-radius:18px 18px 0 0;
      box-shadow:0 -18px 50px rgba(0,0,0,0.28);
      /* O arrasto escreve --mob-y; sem arrasto é 0. */
      transform:translateY(var(--mob-y, 0px));
    }
    .cal-camadas.aberta{ gap:10px; padding:0 16px calc(14px + env(safe-area-inset-bottom)); }
    .cal-camadas.aberta .camada-btn, .cal-camadas.aberta .camada-mais{ min-height:44px; }
    .cal-camadas.aberta .camada-btn{ justify-content:flex-start; }
    .cal-camadas.aberta .camada-mais{ width:auto; padding:0 16px; margin-left:0; }
    /* São botões/links: sem isto o texto ficava centrado na folha. O erro
       do Outlook mostra o texto completo, a quebrar linha — no telemóvel é
       o único sítio onde o Manel o vê. */
    .cal-camadas.aberta .out-erro, .cal-camadas.aberta .sem-data{ padding:10px 0; text-align:left; align-self:flex-start; }
    .cal-camadas.aberta .out-erro{ white-space:normal; line-height:1.45; font-size:12.5px; }
    .mob-sheet-cab{
      display:flex; align-items:center; gap:10px;
      padding:14px 16px 10px; margin:0 -16px 0;
      border-bottom:1px solid var(--line);
      touch-action:none; cursor:grab;
    }
    .mob-sheet .mob-sheet-cab{ margin:0; }
    .mob-sheet-cab h3{
      flex:1; min-width:0; margin:0;
      font-family:'Inter',sans-serif; font-size:14.5px; font-weight:700; color:var(--ink);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .mob-sheet-cab .icon-btn{ width:40px; height:40px; padding:0; flex-shrink:0; font:inherit; }
    /* Puxador: o affordance de arrastar para baixo. */
    .mob-sheet-cab .mob-sheet-puxador{
      position:absolute; top:6px; left:50%; transform:translateX(-50%);
      width:38px; height:4px; border-radius:2px; background:var(--line);
    }
    .mob-sheet-cab{ position:relative; }
    .mob-sheet-corpo{
      flex:1 1 auto; min-height:0; overflow-y:auto;
      -webkit-overflow-scrolling:touch; padding:4px 16px 12px;
    }
    /* Dentro da folha o painel do dia é conteúdo, não cartão. */
    .mob-sheet-corpo .dia-painel{
      margin:0; padding:0; background:none; border:none;
      box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none;
    }
    .mob-sheet-corpo .dia-painel::before{ display:none; }

    /* ---------- Botão flutuante "Novo evento" ---------- */
    .fab{
      display:flex; align-items:center; justify-content:center;
      position:fixed; right:16px; z-index:60;
      bottom:calc(16px + env(safe-area-inset-bottom));
      width:56px; height:56px; border-radius:50%;
      background:var(--red); color:var(--on-red);
      border:none; cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,0.28);
    }
    .fab:active{ transform:scale(0.94); }
    /* Com a barra do shell no fundo (só em ecrãs sem hover) o botão sobe. */
    body.shell-touch .fab{ bottom:calc(70px + env(safe-area-inset-bottom)); }

    /* ---------- giocoModal em ecrã inteiro ----------
       Única redefinição de classes do shell nesta página, confinada a esta
       media query: ao telemóvel um modal centrado com 88dvh e margens deixava
       o formulário de evento a meio do ecrã e com os botões fora de vista. */
    .gioco-modal-overlay{ padding:0; align-items:stretch; }
    .gioco-modal{
      width:100%; max-width:none;
      height:100dvh; max-height:100dvh;
      border-radius:0; padding:0; overflow:hidden;
      display:flex; flex-direction:column;
    }
    .gioco-modal-head{
      margin:0; padding:14px 16px; flex-shrink:0;
      border-bottom:1px solid var(--line);
      padding-top:calc(14px + env(safe-area-inset-top));
    }
    .gioco-modal-close{ width:40px; height:40px; }
    .gioco-modal-body{
      flex:1 1 auto; min-height:0; overflow-y:auto;
      -webkit-overflow-scrolling:touch; padding:16px;
    }
    /* Botões de acção sempre à vista, no fundo do corpo que faz scroll.
       Duas peças: o corpo vira coluna e o conteúdo estica (para o
       margin-top:auto encostar as acções ao fundo quando o formulário é
       curto) e o sticky trata do caso em que o conteúdo passa o ecrã. Só uma
       das duas não chegava — sem a coluna ficava um vazio branco por baixo
       dos botões, sem o sticky os botões saíam do ecrã ao fazer scroll. */
    .gioco-modal-body{ display:flex; flex-direction:column; }
    .gioco-modal-body > div{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
    .gioco-modal-body .ev-form{ flex:1 1 auto; min-height:0; }
    .ev-actions{
      /* margin-top:auto encosta ao fundo; -16px anula o padding do corpo. */
      position:sticky; bottom:0; margin:auto -16px -16px; padding:12px 16px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
      background:var(--white); border-top:1px solid var(--line);
    }
    .ev-actions .btn-add, .ev-actions .ev-btn-outline, .ev-actions a.btn-add{ min-height:44px; }
    .ev-form input, .ev-form select, .ev-form textarea{ font-size:16px; min-height:44px; }
    .ev-swatch{ min-width:44px; min-height:44px; justify-content:center; }
  }
</style>
</head>
