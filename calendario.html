  window.addEventListener('resize', function () { if (ehMobile() && vistaEfetiva() === 'mes') ajustarAlturaMes(); });

  /* ---------- Render ---------- */
  var vistaEl = document.getElementById('calVista');
  var tituloEl = document.getElementById('calTitulo');
  var ultimoScrollChave = null;

  function render() {
    indexarEventos();   // a lista depende da vista (meses visíveis) e da camada
    var vista = vistaEfetiva();
    tituloEl.textContent = tituloPeriodo(vista, estado.dataRef);
    var btnCamada = document.getElementById('camadaPag');
    btnCamada.setAttribute('aria-pressed', camadaPag ? 'true' : 'false');
    renderCamadaOutlook();
    atualizarOutlook();
    var semData = document.getElementById('semData');
    var nSem = linhasSemData();
    semData.hidden = nSem === 0;
    semData.textContent = nSem + ' sem data';
    // Os dois selectores (desktop e telemóvel) reflectem a vista EFECTIVA.
    var botoes = document.querySelectorAll('#segVista button, #mobSeg button');
    for (var i = 0; i < botoes.length; i++) botoes[i].classList.toggle('active', botoes[i].getAttribute('data-vista') === vista);
    vistaEl.classList.toggle('vista-mes', vista === 'mes');
    vistaEl.classList.toggle('vista-agenda', vista === 'agenda');
    if (vista === 'mes') renderMes();
    else if (vista === 'semana') renderGrelhaHoraria(semanaDe(estado.dataRef));
    else if (vista === 'agenda') renderAgenda();
    else renderDia();
    renderFaixa();
    atualizarSheetDia();
    var btnCam = document.getElementById('btnCamadas');
    if (btnCam) btnCam.setAttribute('aria-expanded', camadasAbertas() ? 'true' : 'false');
  }

  /* paleta(item): a cor de um item por FONTE, num só sítio.
     Manual → a cor da categoria; Outlook → o par neutro --out-*.
     Os pagamentos não passam por aqui (têm chip próprio, --blush). */
  function paleta(ev) {
    if (ehOutlook(ev)) return { cor: 'var(--out-bg)', texto: 'var(--out-ink)', label: 'Outlook', classe: ' out' };
    var c = categoria(ev.categoria);
    return { cor: c.cor, texto: c.texto, label: c.label, classe: '' };
  }

  /* Barra: o mesmo botão serve de toggle da camada e, sem sessão, de
     "Ligar Outlook". O botão ao lado abre o painel da conta (giocoModal). */
  function renderCamadaOutlook() {
    var btn = document.getElementById('camadaOut');
    var txt = document.getElementById('camadaOutTxt');
    var mais = document.getElementById('outConta');
    var erro = document.getElementById('outErro');
    if (!btn) return;
    var est = GiocoOutlook.estado();
    var ligado = est === 'ligado';
    btn.hidden = false;
    btn.disabled = false;
    mais.hidden = !ligado;
    erro.hidden = true;

    /* 'webview': a Microsoft bloqueia o login dentro de browsers embutidos.
       Não se tenta nada — diz-se o que fazer, e o detalhe abre no painel. */
    if (est === 'webview') {
      btn.classList.add('ligar');
      btn.removeAttribute('aria-pressed');
      btn.disabled = true;
      btn.title = 'Abre a página no Safari para ligares o Outlook';
      txt.textContent = 'Abre no Safari';
      erro.hidden = false;
      erro.textContent = 'Porquê?';
      return;
    }
    if (est === 'indisponivel') {
      btn.hidden = true;
      erro.hidden = false;
      erro.textContent = 'Outlook indisponível';
      return;
    }
    /* 'a-verificar': o handleRedirectPromise ainda não assentou. NUNCA dizer
       aqui que não há sessão — era isso que, no regresso do redirect, punha o
       botão a pedir login por cima de um login que tinha corrido bem. */
    if (est === 'a-verificar') {
      btn.classList.add('ligar');
      btn.removeAttribute('aria-pressed');
      btn.disabled = true;
      btn.title = 'A verificar a sessão da Microsoft…';
      txt.textContent = 'A verificar…';
      return;
    }
    if (est === 'desligado') {
      btn.classList.add('ligar');
      btn.removeAttribute('aria-pressed');
      btn.title = 'Ligar a conta Microsoft para ver o calendário do Outlook';
      txt.textContent = 'Ligar Outlook';
    } else {
      btn.classList.remove('ligar');
      btn.setAttribute('aria-pressed', camadaOut ? 'true' : 'false');
      btn.title = 'Mostrar ou esconder o calendário do Outlook (só leitura)';
      txt.textContent = 'Outlook';
    }
    // Erro (login, regresso do redirect ou Graph): clicável e com o TEXTO do
    // erro à vista (Set/2026 — antes dizia três palavras e o detalhe só se
    // via abrindo o painel; no telemóvel ninguém o abria). Nunca bloqueia o
    // render. O objecto inteiro fica em outErroObj para o diagnóstico.
    if (outErro) {
      erro.hidden = false;
      var prefixo = outErroObj && outErroObj.__login ? 'Login falhou' : 'Outlook sem resposta';
      var detalhe = String(outErro).replace(/\s+/g, ' ').trim();
      if (detalhe.length > 140) detalhe = detalhe.slice(0, 140) + '…';
      erro.textContent = prefixo + (detalhe ? ': ' + detalhe : '');
      erro.title = 'Ver o diagnóstico completo';
    }
  }
  /* Um erro de login ou de Graph passa SEMPRE por aqui: consola com o
     objecto inteiro + estado para o #outErro e para o painel de diagnóstico. */
  function registarErroOutlook(e, login) {
    console.error('[outlook]' + (login ? ' login:' : ''), e);
    if (e && login) { try { e.__login = true; } catch (err) {} }
    outErroObj = e || null;
    GiocoOutlook.guardarErro(e);
    outErro = (e && (e.errorMessage || e.message)) ? String(e.errorMessage || e.message) : (login ? 'Falha no login.' : 'Falha a ler o calendário.');
    if (e && e.errorCode && outErro.indexOf(e.errorCode) < 0) outErro = e.errorCode + ' — ' + outErro;
  }

  /* chipDe(item): o único sítio onde um chip sabe de que fonte vem. */
  function chipDe(ev) {
    if (ehPagamento(ev)) {
      var pago = ev.extra.estado === 'pago';
      var titulo = ev.titulo + ' · ' + formatEuro(ev.extra.valor);
      return '<button type="button" class="ev-chip pag' + (pago ? ' pago' : '') + '" data-id="' + escapeHtml(ev.id) + '" title="' + escapeHtml(titulo) + '">' +
        (pago ? '✓ ' : '') + escapeHtml(ev.titulo) + ' ·<span class="num">' + escapeHtml(formatEuro(ev.extra.valor)) + '</span></button>';
    }
    var c = paleta(ev);
    var hora = ev.diaInteiro || !ev.horaInicio ? '' : '<span class="num">' + ev.horaInicio + '</span>';
    var dica = ev.titulo + (temReuniao(ev) ? ' · ' + ev.extra.reuniao.servico : '');
    return '<button type="button" class="ev-chip' + c.classe + classeCancelado(ev) + '" data-id="' + escapeHtml(ev.id) + '" style="background:' + c.cor + ';color:' + c.texto + '" title="' + escapeHtml(dica) + '">' +
      hora + iconeLigacao(ev) + iconeReuniao(ev) + escapeHtml(ev.titulo) + '</button>';
  }
  var chipHtml = chipDe;
  /* Item anulado/cancelado, de QUALQUER fonte que o traga marcado (anulado
     na fonte manual, cancelado/extra.cancelado numa fonte futura). Hoje as
     duas fontes filtram-nos antes de chegarem à lista (EV.normalizar devolve
     null a um anulado; o gioco-outlook.js salta os isCancelled), por isso a
     classe só existe para o dia em que se decidir mostrá-los riscados — o
     CSS (line-through + esbatido; chip só com contorno --red) já lá está. */
  function ehCancelado(ev) { return !!(ev && (ev.anulado === true || ev.cancelado === true || (ev.extra && ev.extra.cancelado === true))); }
  function classeCancelado(ev) { return ehCancelado(ev) ? ' cancelado' : ''; }
  // Evento ligado a um pedido da loja: ícone store (14px) antes do título, sem categoria nova.
  function ehPedidoLoja(ev) { return !!(ev && ev.ligacao && ev.ligacao.tipo === 'lojaPedido'); }
  function iconeLigacao(ev) { return ehPedidoLoja(ev) ? '<svg class="icon" width="14" height="14"><use href="#i-store"/></svg>' : ''; }
  /* Evento do Outlook com link de videochamada (extra.reuniao, detectado no
     gioco-outlook.js): ícone i-video pela mesma porta do i-store — 14px inline,
     já com CSS em `.ev-chip .icon, .ev-bloco .icon, .dia-item-t .icon`. Não
     empurra o texto: o chip trunca com ellipsis, como sempre. */
  function temReuniao(ev) { return !!(ev && ev.extra && ev.extra.reuniao && ev.extra.reuniao.url); }
  function iconeReuniao(ev) {
    if (!temReuniao(ev)) return '';
    return '<svg class="icon" width="14" height="14"><use href="#i-video"/></svg>';
  }

  /* Ao telemóvel a célula é mais pequena: 2 chips de texto truncado e, com
     mais, uma terceira linha "+N" (em desktop 3 chips, ou 2 + "+N mais"). A
     coluna do dia seleccionado (o da faixa de datas) leva .col-sel. Ambas as
     coisas só quando ehMobile(): o DOM de desktop fica exactamente o mesmo. */
  var MAX_CHIPS_MES_MOBILE = 2;
  function renderMes() {
    var ref = estado.dataRef, hoje = hojeISO(), mes = mesDe(ref), mob = ehMobile();
    var dias = monthGrid(parseInt(anoDe(ref), 10), mes);
    // A seleção sobrevive à mudança de mês só enquanto o dia continuar na grelha.
    if (estado.diaSelecionado && dias.indexOf(estado.diaSelecionado) < 0) estado.diaSelecionado = null;
    var sel = estado.diaSelecionado;
    var colSel = mob ? (parseISO(ref).getDay() + 6) % 7 : -1;
    var html = '<div class="mes-layout"><div class="mes-grelha-wrap"><div class="mes-cab">';
    DIAS_CURTOS.forEach(function (d) { html += '<div>' + d + '</div>'; });
    html += '</div><div class="mes-grelha">';
    dias.forEach(function (iso, i) {
      var cls = 'mes-cel';
      if (i % 7 >= 5) cls += ' fds';
      if (mesDe(iso) !== mes) cls += ' fora';
      if (iso === hoje) cls += ' hoje';
      if (iso === sel) cls += ' sel';
      if (i % 7 === colSel) cls += ' col-sel';
      var evs = eventosDoDia(iso);
      html += '<div class="' + cls + '" data-dia="' + iso + '">';
      html += '<span class="mes-num num" data-dia-num="' + iso + '">' + diaDe(iso) + '</span>';
      var visiveis;
      if (mob) visiveis = Math.min(MAX_CHIPS_MES_MOBILE, evs.length);
      else visiveis = evs.length > MAX_CHIPS_MES ? MAX_CHIPS_MES - 1 : evs.length;
      for (var k = 0; k < visiveis; k++) html += chipHtml(evs[k]);
      if (evs.length > visiveis) html += '<button type="button" class="mes-mais" data-mais="' + iso + '">+' + (evs.length - visiveis) + (mob ? '' : ' mais') + '</button>';
      html += '</div>';
    });
    html += '</div></div>';
    if (sel) html += renderPainelDia(sel, { fechar: true, abrirDia: true });
    html += '</div>';
    vistaEl.innerHTML = html;
    if (mob) ajustarAlturaMes();
  }
  /* Telemóvel: a grelha do mês enche o que sobra do ecrã por baixo da barra
     sticky (sem scroll vertical dentro da vista, nem horizontal). A altura
     é medida em runtime: a barra de datas muda de altura ao expandir, e a
     barra do shell no fundo (shell-touch) só existe sem hover. */
  function ajustarAlturaMes() {
    var g = vistaEl.querySelector('.mes-grelha');
    if (!g) return;
    if (!ehMobile()) { g.style.removeProperty('height'); return; }
    var topo = g.getBoundingClientRect().top;
    var fundo = (document.body.classList.contains('shell-touch') ? 64 : 12) + 16;
    var alto = Math.floor(window.innerHeight - topo - fundo);
    g.style.height = Math.max(300, alto) + 'px';
  }

  /* ---------- Vista Agenda (telemóvel) ----------
     Lista vertical contínua a partir do dia seleccionado na faixa (dataRef):
     só os dias COM conteúdo aparecem, cada um com cabeçalho sticky e as
     linhas no MESMO componente do painel do dia (itemDiaHtml / pagDiaHtml,
     em modo agenda) — respeita as camadas activas e abre os mesmos modais.
     Um sentinela no fim (IntersectionObserver) pede mais 30 dias ao chegar
     lá; sem observer, o botão "Ver mais dias" faz o mesmo. */
  function renderAgenda() {
    var ref = estado.dataRef, n = agendaDiasDe(ref), hoje = hojeISO();
    var html = '<div class="ag-lista">', dias = 0;
    for (var i = 0; i < n; i++) {
      var iso = addDays(ref, i), evs = eventosDoDia(iso);
      if (!evs.length) continue;
      dias++;
      html += '<div class="ag-dia' + (iso === hoje ? ' hoje' : '') + '">' +
        '<button type="button" class="ag-cab" data-acao="abrir-dia" data-dia="' + iso + '" title="Abrir vista Dia">' +
          '<span>' + diaSemanaCurto(iso) + ',</span><b class="num">' + diaDe(iso) + '</b><span>' + escapeHtml(mesCurto(iso)) + '</span>' +
        '</button>';
      html += evs.map(function (ev) { return itemDiaHtml(ev, { agenda: true }); }).join('');
      html += '</div>';
    }
    var ultimo = addDays(ref, n - 1);
    if (!dias) html += '<p class="dia-vazio ag-vazio">Sem eventos entre ' + diaDe(ref) + ' ' + escapeHtml(mesCurto(ref)) + ' e ' + diaDe(ultimo) + ' ' + escapeHtml(mesCurto(ultimo)) + '.</p>';
    if (n < AGENDA_MAX) html += '<div class="ag-fim" id="agFim"><button type="button" class="btn" data-acao="agenda-mais">Ver mais dias</button></div>';
    vistaEl.innerHTML = html + '</div>';
    observarFimAgenda();
  }
  var agObserver = null;
  function observarFimAgenda() {
    if (agObserver) { agObserver.disconnect(); agObserver = null; }
    var fim = document.getElementById('agFim');
    if (!fim || !window.IntersectionObserver) return;
    agObserver = new IntersectionObserver(function (entradas) {
      if (!entradas.some(function (e) { return e.isIntersecting; })) return;
      if (vistaEfetiva() !== 'agenda') return;
      // Só cresce sozinha quando há mesmo scroll a fazer: com a lista mais
      // curta que o ecrã o sentinela está sempre à vista e a lista crescia
      // em cascata até ao tecto (12 pedidos ao Graph com a camada Outlook
      // ligada). Aí fica o botão "Ver mais dias".
      if (document.documentElement.scrollHeight <= window.innerHeight + 40) return;
      agendaMais();
    }, { rootMargin: '200px 0px' });
    agObserver.observe(fim);
  }
  function agendaMais() {
    if (agendaDias >= AGENDA_MAX) return;
    agendaDias = Math.min(AGENDA_MAX, agendaDias + AGENDA_PASSO);
    render();
  }
  // "45m", "1h", "1h30" — a duração em texto curto da vista Agenda.
  function duracaoCurta(hi, hf) {
    if (!hi || !hf) return '';
    var m = minutos(hf) - minutos(hi);
    if (m <= 0) return '';
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h' + (m % 60 ? pad2(m % 60) : '');
  }
  // Segunda linha discreta de um item da Agenda: pessoa / local / notas.
  function subtituloAgenda(ev) {
    if (ehOutlook(ev)) {
      var x = ev.extra || {};
      var localSoLink = !!(x.reuniao && String(x.local || '').trim() === x.reuniao.url);
      var partes = [];
      if (x.local && !localSoLink) partes.push(x.local);
      else if (x.reuniao) partes.push(x.reuniao.servico);
      if (x.organizador) partes.push(x.organizador);
      return partes.join(' · ') || 'Outlook';
    }
    if (ev.notas) return String(ev.notas).split('\n')[0];
    return paleta(ev).label;
  }

  function selecionarDia(iso) {
    estado.diaSelecionado = iso;
    // Ao telemóvel o painel lateral está display:none: o dia abre em folha,
    // e o dia seleccionado passa também a ser o da faixa de datas.
    if (ehMobile()) estado.dataRef = iso;
    render();
    if (ehMobile()) abrirSheetDia(iso);
  }

  /* ---------- Faixa de datas (telemóvel) ----------
     A peça central da navegação ao telemóvel: 7 dias da semana de dataRef
     (colapsada) ou o mês inteiro de dataRef (expandida). Hoje = pílula
     --red; seleccionado (= dataRef) = anel --ink; ponto quando o dia tem
     itens nas camadas activas. Tocar num dia muda dataRef e a vista activa
     acompanha. O estado expandida/colapsada persiste em localStorage. */
  var faixaEl = document.getElementById('mobFaixa');
  var mobBarEl = document.getElementById('mobBar');
  var faixaExpandida = false;
  try { faixaExpandida = localStorage.getItem('calendario.mob.faixa') === '1'; } catch (e) {}
  function setFaixaExpandida(on) {
    faixaExpandida = !!on;
    try { localStorage.setItem('calendario.mob.faixa', faixaExpandida ? '1' : '0'); } catch (e) {}
    renderFaixa();
    if (vistaEfetiva() === 'mes') ajustarAlturaMes();
  }
  var INICIAIS = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
  function renderFaixa() {
    if (!faixaEl || !ehMobile()) return;
    var ref = estado.dataRef, hoje = hojeISO(), mes = mesDe(ref);
    var dias;
    if (faixaExpandida) {
      dias = monthGrid(parseInt(anoDe(ref), 10), mes);
      // A 6.ª linha só quando tem pelo menos um dia do mês.
      if (mesDe(dias[35]) !== mes) dias = dias.slice(0, 35);
    } else dias = semanaDe(ref);
    var html = '<div class="mob-faixa-cab" aria-hidden="true">';
    INICIAIS.forEach(function (l) { html += '<span>' + l + '</span>'; });
    html += '</div>';
    for (var i = 0; i < dias.length; i += 7) {
      html += '<div class="mob-faixa-linha">';
      for (var k = i; k < i + 7; k++) {
        var iso = dias[k], cls = 'mob-dia';
        if (iso === hoje) cls += ' hoje';
        if (iso === ref) cls += ' sel';
        if (faixaExpandida && mesDe(iso) !== mes) cls += ' fora';
        if (eventosDoDia(iso).length) cls += ' tem';
        html += '<button type="button" class="' + cls + '" data-faixa-dia="' + iso + '" aria-label="' + escapeHtml(tituloDia(iso)) + '"' + (iso === ref ? ' aria-current="date"' : '') + '><b class="num">' + diaDe(iso) + '</b><i></i></button>';
      }
      html += '</div>';
    }
    faixaEl.innerHTML = html;
    document.getElementById('mobTituloTxt').textContent = mesLongo(ref) + ' ' + anoDe(ref);
    document.getElementById('mobTitulo').setAttribute('aria-expanded', faixaExpandida ? 'true' : 'false');
    mobBarEl.classList.toggle('expandida', faixaExpandida);
    // Os cabeçalhos sticky da Agenda e a grelha do Dia dependem da altura da barra.
    document.documentElement.style.setProperty('--mob-bar-h', mobBarEl.offsetHeight + 'px');
  }
  // Swipe horizontal na faixa: uma semana (colapsada) ou um mês (expandida).
  function navegarFaixa(dir) {
    setDataRef(faixaExpandida ? addMonths(estado.dataRef, dir) : addDays(estado.dataRef, 7 * dir));
  }
  /* Gestos: swipe horizontal na faixa navega; arrastar para baixo (faixa ou
     puxador) expande, para cima colapsa; toque no puxador ou no título
     alterna. Pointer events cobrem toque, rato e caneta. Depois de um gesto
     o click que o browser dispara a seguir é ignorado (gestoAte). */
  var gestoAte = 0;
  function tocarDiaFaixa(iso) {
    // Na vista Mês tocar num dia da faixa também abre o painel do dia (folha).
    if (vistaEfetiva() === 'mes') { selecionarDia(iso); return; }
    setDataRef(iso);
  }
  /* O toque num dia é resolvido AQUI, no pointerup, e não no click: com o
     ponteiro capturado o browser retarget-a o click para o elemento que
     capturou (a faixa), e o botão do dia nunca era encontrado. O handler de
     click fica só para o teclado (Enter/Espaço não geram pointer events). */
  function ligarGestosFaixa(alvo, aoTocar) {
    if (!alvo) return;
    var x0 = 0, y0 = 0, activo = false, alvoToque = null;
    alvo.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      activo = true; x0 = e.clientX; y0 = e.clientY;
      alvoToque = e.target.closest ? e.target.closest('[data-faixa-dia]') : null;
      try { alvo.setPointerCapture(e.pointerId); } catch (err) {}
    });
    function largar(e) {
      if (!activo) return;
      activo = false;
      var dx = e.clientX - x0, dy = e.clientY - y0;
      var horizontal = Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2;
      var vertical = Math.abs(dy) > 36 && Math.abs(dy) > Math.abs(dx) * 1.2;
      gestoAte = performance.now() + 400;
      if (horizontal) { navegarFaixa(dx < 0 ? 1 : -1); return; }
      if (vertical) { setFaixaExpandida(dy > 0); return; }
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) return;   // arrasto curto: nada
      if (alvoToque) tocarDiaFaixa(alvoToque.getAttribute('data-faixa-dia'));
      else if (aoTocar) aoTocar();
    }
    alvo.addEventListener('pointerup', largar);
    alvo.addEventListener('pointercancel', function () { activo = false; alvoToque = null; });
  }
  ligarGestosFaixa(faixaEl, null);
  ligarGestosFaixa(document.getElementById('mobPuxador'), function () { setFaixaExpandida(!faixaExpandida); });
  if (faixaEl) faixaEl.addEventListener('click', function (e) {
    if (performance.now() < gestoAte) return;   // já tratado no pointerup
    var b = e.target.closest('[data-faixa-dia]');
    if (b) tocarDiaFaixa(b.getAttribute('data-faixa-dia'));
  });
  document.getElementById('mobPuxador').addEventListener('click', function () {
    if (performance.now() < gestoAte) return;
    setFaixaExpandida(!faixaExpandida);
  });
  document.getElementById('mobTitulo').addEventListener('click', function () { setFaixaExpandida(!faixaExpandida); });
  document.getElementById('mobHoje').addEventListener('click', function () { setDataRef(hojeISO()); });
  document.getElementById('mobSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vista]');
    if (b) setVista(b.getAttribute('data-vista'));
  });
  function fecharPainelDia() {
    if (sheetDiaAberta()) { fecharSheetDia(); return; }
    if (estado.diaSelecionado) { estado.diaSelecionado = null; render(); }
  }

  /* ---------- Bottom sheets de telemóvel ----------
     Duas folhas e um fundo partilhado, definidos no HTML e sem layout nenhum
     fora da @media (max-width:767px). A do dia usa renderPainelDia() tal e
     qual — nenhuma lógica de render é duplicada — e o clique dentro dela
     passa pelo MESMO handler delegado das vistas (cliqueVista). */
  var mobBg = document.getElementById('mobBg');
  var diaSheet = document.getElementById('diaSheet');
  var diaSheetCorpo = document.getElementById('diaSheetCorpo');
  var diaSheetTitulo = document.getElementById('diaSheetTitulo');
  var calCamadas = document.getElementById('calCamadas');
  /* O #calCamadas TEM de sair da barra para ser folha: o .cal-bar é
     .glass-light (backdrop-filter) e, em telemóvel, sticky com z-index — as
     duas coisas fazem dele o bloco contentor de um position:fixed filho e
     prendem-no ao seu nível de empilhamento, por isso a folha aparecia dentro
     da barra e por baixo do fundo escurecido. Move-se para o <body> ao abrir e
     volta ao lugar exacto (antes do #btnCamadas) ao fechar — os botões são os
     mesmos elementos, com os mesmos handlers, e em desktop nada muda. */
  var camadasCasa = calCamadas ? calCamadas.parentNode : null;
  // O vizinho é o selector de vistas de desktop (o #btnCamadas vive na
  // .mob-bar desde Set/2026).
  var camadasVizinho = document.getElementById('segVista');
  function camadasParaFolha() { if (calCamadas && calCamadas.parentNode !== document.body) document.body.appendChild(calCamadas); }
  function camadasParaBarra() { if (calCamadas && camadasCasa && calCamadas.parentNode !== camadasCasa) camadasCasa.insertBefore(calCamadas, camadasVizinho); }

  function sheetDiaAberta() { return !!(diaSheet && diaSheet.classList.contains('aberta')); }
  function camadasAbertas() { return !!(calCamadas && calCamadas.classList.contains('aberta')); }
  function atualizarFundo() {
    if (mobBg) mobBg.classList.toggle('aberto', sheetDiaAberta() || camadasAbertas());
  }
  function limparArrasto(el) { if (el) el.style.removeProperty('--mob-y'); }

  function abrirSheetDia(iso) {
    if (!diaSheet) return;
    fecharCamadas();
    diaSheetTitulo.textContent = tituloDia(iso);
    diaSheetCorpo.innerHTML = renderPainelDia(iso, { abrirDia: true, semCab: true, semZonaLivre: true });
    diaSheetCorpo.scrollTop = 0;
    limparArrasto(diaSheet);
    diaSheet.classList.add('aberta');
    atualizarFundo();
  }
  function fecharSheetDia() {
    if (!sheetDiaAberta()) return;
    diaSheet.classList.remove('aberta');
    limparArrasto(diaSheet);
    estado.diaSelecionado = null;
    atualizarFundo();
    render();
  }
  // Um render (mudança de camada, snapshot novo do Firebase) tem de refrescar
  // o conteúdo da folha aberta, senão ficava a mostrar dados velhos.
  function atualizarSheetDia() {
    if (!sheetDiaAberta()) return;
    if (!ehMobile() || !estado.diaSelecionado) { fecharSheetDia(); return; }
    diaSheetTitulo.textContent = tituloDia(estado.diaSelecionado);
    diaSheetCorpo.innerHTML = renderPainelDia(estado.diaSelecionado, { abrirDia: true, semCab: true, semZonaLivre: true });
  }
  function abrirCamadas() {
    if (!calCamadas) return;
    fecharSheetDia();
    camadasParaFolha();
    limparArrasto(calCamadas);
    calCamadas.classList.add('aberta');
    atualizarFundo();
    var b = document.getElementById('btnCamadas');
    if (b) b.setAttribute('aria-expanded', 'true');
  }
  function fecharCamadas() {
    if (!camadasAbertas()) return;
    calCamadas.classList.remove('aberta');
    limparArrasto(calCamadas);
    camadasParaBarra();
    atualizarFundo();
    var b = document.getElementById('btnCamadas');
    if (b) b.setAttribute('aria-expanded', 'false');
  }
  function fecharSheets() { fecharCamadas(); camadasParaBarra(); if (sheetDiaAberta()) { diaSheet.classList.remove('aberta'); limparArrasto(diaSheet); } atualizarFundo(); }

  if (mobBg) mobBg.addEventListener('click', function () { fecharCamadas(); fecharSheetDia(); });

  /* Arrastar o cabeçalho para baixo fecha a folha (> 80px, ou um gesto
     rápido). Pointer events: cobre toque, rato e caneta com um só código. */
  function ligarArrasto(folha, fechar) {
    var cab = folha ? folha.querySelector('.mob-sheet-cab') : null;
    if (!cab) return;
    var y0 = 0, t0 = 0, arrastando = false;
    cab.addEventListener('pointerdown', function (e) {
      if (e.target.closest('[data-acao]')) return;   // o × é botão, não puxador
      arrastando = true; y0 = e.clientY; t0 = Date.now();
      try { cab.setPointerCapture(e.pointerId); } catch (err) {}
    });
    cab.addEventListener('pointermove', function (e) {
      if (!arrastando) return;
      var dy = Math.max(0, e.clientY - y0);
      folha.style.setProperty('--mob-y', dy + 'px');
    });
    function largar(e) {
      if (!arrastando) return;
      arrastando = false;
      var dy = Math.max(0, e.clientY - y0), dt = Date.now() - t0;
      folha.style.removeProperty('--mob-y');
      if (dy > 80 || (dy > 30 && dt < 250)) fechar();
    }
    cab.addEventListener('pointerup', largar);
    cab.addEventListener('pointercancel', function () { arrastando = false; folha.style.removeProperty('--mob-y'); });
  }
  ligarArrasto(diaSheet, fecharSheetDia);
  ligarArrasto(calCamadas, fecharCamadas);

  /* Colunas por clusters de sobreposição: eventos que se tocam no tempo
     partilham a largura em partes iguais. */
  function layoutColunas(evs) {
    var itens = evs.filter(function (e) { return !e.diaInteiro && e.horaInicio; }).map(function (e) {
      var ini = minutos(e.horaInicio);
      var fim = e.horaFim ? minutos(e.horaFim) : ini + 60;
      if (fim <= ini) fim = ini + 60;
      return { ev: e, ini: ini, fim: fim, col: 0, ncols: 1 };
    }).sort(function (a, b) { return a.ini - b.ini || a.fim - b.fim; });
    var cluster = [], clusterFim = -1, fimCols = [];
    function fecharCluster() {
      var n = fimCols.length || 1;
      cluster.forEach(function (it) { it.ncols = n; });
      cluster = []; fimCols = []; clusterFim = -1;
    }
    itens.forEach(function (it) {
      if (cluster.length && it.ini >= clusterFim) fecharCluster();
      var col = -1;
      for (var c = 0; c < fimCols.length; c++) if (fimCols[c] <= it.ini) { col = c; break; }
      if (col < 0) { col = fimCols.length; fimCols.push(0); }
      fimCols[col] = it.fim;
      it.col = col;
      cluster.push(it);
      clusterFim = Math.max(clusterFim, it.fim);
    });
    fecharCluster();
    return itens;
  }

  /* blocoDe(item): bloco na grelha horária (só itens com hora; os pagamentos são de dia inteiro). */
  function blocoDe(it) {
    var c = paleta(it.ev);
    var base = HORA_INICIO_GRELHA * 60;
    var top = Math.max(0, (it.ini - base) / 60 * PX_HORA);
    var altura = Math.max(24, (it.fim - Math.max(it.ini, base)) / 60 * PX_HORA);
    if (it.ini < base) altura = Math.max(24, (it.fim - base) / 60 * PX_HORA);
    if (top + altura > ALTURA_GRELHA) altura = Math.max(24, ALTURA_GRELHA - top);
    var largura = 100 / it.ncols, left = largura * it.col;
    var horas = it.ev.horaInicio + (it.ev.horaFim ? '–' + it.ev.horaFim : '');
    return '<button type="button" class="ev-bloco' + c.classe + '" data-id="' + escapeHtml(it.ev.id) + '" style="top:' + top + 'px;height:' + altura + 'px;left:calc(' + left + '% + 2px);width:calc(' + largura + '% - 4px);background:' + c.cor + ';color:' + c.texto + '" title="' + escapeHtml(it.ev.titulo) + '">' +
      '<b>' + iconeLigacao(it.ev) + iconeReuniao(it.ev) + escapeHtml(it.ev.titulo) + '</b><span class="num">' + horas + '</span></button>';
  }

  function horaColHtml() {
    var html = '<div class="hora-col">';
    for (var h = HORA_INICIO_GRELHA; h <= HORA_FIM_GRELHA; h++) {
      html += '<div class="hora-lbl num" style="top:' + ((h - HORA_INICIO_GRELHA) * PX_HORA) + 'px">' + pad2(h) + ':00</div>';
    }
    return html + '</div>';
  }

  function diaColHtml(iso, fds) {
    var html = '<div class="dia-col' + (fds ? ' fds' : '') + '" data-dia="' + iso + '">';
    for (var h = HORA_INICIO_GRELHA; h < HORA_FIM_GRELHA; h++) {
      html += '<div class="hora-cel" data-hora="' + pad2(h) + ':00" style="top:' + ((h - HORA_INICIO_GRELHA) * PX_HORA) + 'px"></div>';
    }
    layoutColunas(eventosDoDia(iso)).forEach(function (it) { html += blocoDe(it); });
    return html + '</div>';
  }

  function grelhaHorariaHtml(dias) {
    var hoje = hojeISO();
    var html = '<div class="sem-cab" style="--ncols:' + dias.length + '"><div></div>';
    dias.forEach(function (iso) {
      html += '<div class="sem-dia' + (iso === hoje ? ' hoje' : '') + '">' + diaSemanaCurto(iso) + ' <b class="num">' + diaDe(iso) + '</b></div>';
    });
    html += '</div><div class="sem-inteiro" style="--ncols:' + dias.length + '"><div class="sem-lbl">dia inteiro</div>';
    dias.forEach(function (iso) {
      html += '<div class="sem-di-col" data-dia-inteiro="' + iso + '">';
      eventosDoDia(iso).forEach(function (ev) { if (ev.diaInteiro) html += chipHtml(ev); });
      html += '</div>';
    });
    html += '</div><div class="sem-scroll" id="semScroll"><div class="sem-grelha" style="--ncols:' + dias.length + '">' + horaColHtml();
    dias.forEach(function (iso, i) { html += diaColHtml(iso, dias.length === 7 && i >= 5); });
    return html + '</div></div>';
  }

  function scrollInicial(dias) {
    var chave = estado.vista + '|' + estado.dataRef;
    var sc = document.getElementById('semScroll');
    if (!sc) return;
    if (chave === ultimoScrollChave) { sc.scrollTop = ultimoScrollTop; return; }
    ultimoScrollChave = chave;
    var alvo = 8 * 60;
    /* Telemóvel, vista Dia de HOJE: começa 1 hora antes da hora actual (ou
       no primeiro evento do dia, se for mais cedo — o Math.min a seguir). */
    if (ehMobile() && dias.length === 1 && dias[0] === hojeISO()) {
      var agora = new Date();
      alvo = Math.max(HORA_INICIO_GRELHA * 60, agora.getHours() * 60 + agora.getMinutes() - 60);
    }
    dias.forEach(function (iso) {
      eventosDoDia(iso).forEach(function (ev) { if (!ev.diaInteiro && ev.horaInicio) alvo = Math.min(alvo, minutos(ev.horaInicio)); });
    });
    sc.scrollTop = Math.max(0, (alvo - HORA_INICIO_GRELHA * 60) / 60 * PX_HORA);
    ultimoScrollTop = sc.scrollTop;
  }
  var ultimoScrollTop = 0;

  function renderGrelhaHoraria(dias) {
    vistaEl.innerHTML = grelhaHorariaHtml(dias);
    scrollInicial(dias);
    ligarScroll();
  }
  function ligarScroll() {
    var sc = document.getElementById('semScroll');
    if (sc) sc.addEventListener('scroll', function () { ultimoScrollTop = sc.scrollTop; });
  }

  function seccaoPagamentosHtml(pags) {
    if (!pags.length) return '';
    var pendente = 0, h = '<div class="dia-sec">Pagamentos</div>';
    pags.forEach(function (ev) {
      var pago = ev.extra.estado === 'pago';
      if (!pago) pendente += ev.extra.valor;
      h += pagDiaHtml(ev);
    });
    h += '<div class="dia-pag-total"><span>Pendente no dia</span><b class="num">' + escapeHtml(formatEuro(pendente)) + '</b></div>';
    return h;
  }

  /* Painel "Neste dia" — o mesmo nas vistas Mês (lateral, com ×) e Dia.
     opts.fechar → botão × (só faz sentido no Mês); opts.abrirDia → link para a vista Dia. */
  function tituloDia(iso) { return diaSemanaLongo(iso) + ', ' + diaDe(iso) + ' ' + mesCurto(iso); }
  /* Linha de um item no painel do dia. Extraído em Set/2026 para a vista
     Semana de telemóvel (faixas empilhadas) reutilizar o MESMO componente —
     nenhum markup de evento é duplicado por vista. */
  /* opts.agenda (telemóvel, vista Agenda): o MESMO item, noutra arrumação —
     hora + duração à esquerda, ponto de 8px com a cor da camada, título a
     peso médio e uma segunda linha discreta. Sem opts, o markup de sempre. */
  function itemDiaHtml(ev, opts) {
    if (ehPagamento(ev)) return pagDiaHtml(ev, opts);
    var c = paleta(ev);
    var titulo = iconeLigacao(ev) + iconeReuniao(ev) + escapeHtml(ev.titulo);
    if (opts && opts.agenda) {
      var hora = ev.diaInteiro || !ev.horaInicio
        ? '<b>Dia</b><small>inteiro</small>'
        : '<b>' + escapeHtml(ev.horaInicio) + '</b><small>' + escapeHtml(duracaoCurta(ev.horaInicio, ev.horaFim)) + '</small>';
      return '<button type="button" class="dia-item ag-item' + classeCancelado(ev) + '" data-id="' + escapeHtml(ev.id) + '">' +
        '<span class="ag-hora num">' + hora + '</span><i class="ag-ponto" style="background:' + c.cor + '"></i>' +
        '<div class="ag-txt"><div class="dia-item-t">' + titulo + '</div>' +
        '<div class="dia-item-h">' + escapeHtml(subtituloAgenda(ev)) + '</div></div></button>';
    }
    var horas = ev.diaInteiro ? 'Dia inteiro' : (ev.horaInicio || '') + (ev.horaFim ? '–' + ev.horaFim : '');
    return '<button type="button" class="dia-item' + classeCancelado(ev) + '" data-id="' + escapeHtml(ev.id) + '"><i style="background:' + c.cor + '"></i><div style="min-width:0;flex:1">' +
      '<div class="dia-item-t">' + titulo + '</div>' +
      '<div class="dia-item-h num">' + escapeHtml(horas) + ' · ' + c.label + '</div>' +
      (ev.notas ? '<div class="dia-item-n">' + escapeHtml(ev.notas) + '</div>' : '') +
      '</div></button>';
  }
  function pagDiaHtml(ev, opts) {
    var pago = ev.extra.estado === 'pago';
    if (opts && opts.agenda) {
      return '<button type="button" class="dia-pag ag-item' + (pago ? ' pago' : '') + classeCancelado(ev) + '" data-id="' + escapeHtml(ev.id) + '">' +
        '<span class="ag-hora num"><b>Dia</b><small>inteiro</small></span><i class="ag-ponto" style="background:var(--blush)"></i>' +
        '<div class="ag-txt"><div class="dia-item-t">' + (pago ? '✓ ' : '') + escapeHtml(ev.titulo) + '</div>' +
        '<div class="dia-item-h"><span class="dia-pag-v num">' + escapeHtml(formatEuro(ev.extra.valor)) + '</span> · ' + (pago ? 'Pago' : 'Pendente') + '</div></div></button>';
    }
    return '<button type="button" class="dia-pag' + (pago ? ' pago' : '') + classeCancelado(ev) + '" data-id="' + escapeHtml(ev.id) + '"><i></i>' +
      '<span class="dia-pag-t">' + escapeHtml(ev.titulo) + '</span>' +
      '<span class="dia-pag-v num">' + escapeHtml(formatEuro(ev.extra.valor)) + '</span>' +
      '<span class="status ' + (pago ? 'ok' : 'warn') + '">' + (pago ? 'Pago' : 'Pendente') + '</span></button>';
  }
  function renderPainelDia(iso, opts) {
    opts = opts || {};
    var todos = eventosDoDia(iso);
    var evs = todos.filter(function (ev) { return !ehPagamento(ev); });
    var pags = todos.filter(ehPagamento);
    var lista = '';
    if (!evs.length) {
      lista = '<p class="dia-vazio">Sem eventos neste dia.</p>';
    } else {
      evs.forEach(function (ev) { lista += itemDiaHtml(ev); });
    }
    /* opts.semCab: na bottom sheet de telemóvel o título da data já vive no
       cabeçalho da folha — dois títulos seguidos era ruído. */
    var cab = opts.semCab ? '' : ('<div class="dia-painel-cab"><h3>' + escapeHtml(tituloDia(iso)) + '</h3>' +
      (opts.fechar ? '<button type="button" class="icon-btn" data-acao="fechar" title="Fechar (Esc)" aria-label="Fechar"><svg class="icon" width="14" height="14"><use href="#i-x"/></svg></button>' : '') +
      '</div>');
    var rodape = '<div class="dia-rodape">' +
      '<button type="button" class="btn-add" data-acao="novo" data-dia="' + iso + '"><svg class="icon" width="14" height="14"><use href="#i-plus"/></svg> Novo evento</button>' +
      (opts.abrirDia ? '<button type="button" class="dia-abrir" data-acao="abrir-dia" data-dia="' + iso + '">Abrir vista Dia →</button>' : '') +
      '</div>';
    /* opts.semZonaLivre: dentro da folha do dia a zona livre NÃO abre a vista
       Dia — ao toque, um toque a meio da lista caía nessa zona sem querer. O
       botão "Abrir vista Dia →" do rodapé continua lá. */
    var zonaLivre = opts.abrirDia && !opts.semZonaLivre;
    return '<div class="panel glass-light dia-painel"' + (zonaLivre ? ' data-abrir-dia="' + iso + '" title="Abrir vista Dia"' : '') + '>' + cab + lista + seccaoPagamentosHtml(pags) + rodape + '</div>';
  }

  // Novo evento a partir do painel: se for hoje, começa na próxima hora cheia.
  function novoNoDia(iso) {
    var pre = { data: iso };
    if (iso === hojeISO()) {
      var h = Math.min(23, new Date().getHours() + 1);
      pre.horaInicio = pad2(h) + ':00';
    }
    abrirNovo(pre);
  }

  function renderDia() {
    var iso = estado.dataRef;
    vistaEl.innerHTML = '<div class="dia-layout"><div class="dia-grelha">' + grelhaHorariaHtml([iso]) + '</div>' +
      renderPainelDia(iso, {}) + '</div>';
    scrollInicial([iso]);
    ligarScroll();
  }

  /* ---------- Legenda ---------- */
  document.getElementById('calLegenda').innerHTML = CATEGORIAS.map(function (c) {
    return '<span><i style="background:' + c.cor + '"></i>' + c.label + '</span>';
  }).join('') + '<span><i style="background:var(--blush)"></i>Pagamentos (Tesouraria, só leitura)</span>' +
    '<span><i style="background:var(--out-bg)"></i>Outlook (só leitura)</span>';

  /* ---------- Interação nas vistas ---------- */
  /* Handler delegado das vistas. Ligado a #calVista E ao corpo da bottom
     sheet do dia — a folha mostra o mesmo markup do painel, por isso responde
     aos mesmos data-id / data-acao sem uma linha de lógica duplicada. */
  function cliqueVista(e) {
    var chip = e.target.closest('[data-id]');
    if (chip) {
      e.stopPropagation();
      // Ramifica por ORIGEM (e não por !editavel): a próxima camada só de
      // leitura acrescenta um ramo aqui, sem mexer nas outras.
      var item = itensPorId[chip.getAttribute('data-id')];
      var org = item ? item.origem : 'manual';
      if (org === 'pagamentos') abrirDetalhePagamento(item);
      else if (org === 'outlook') abrirDetalheOutlook(item);
      else abrirEditar(chip.getAttribute('data-id'));
      return;
    }
    var acao = e.target.closest('[data-acao]');
    if (acao) {
      e.stopPropagation();
      var a = acao.getAttribute('data-acao'), d = acao.getAttribute('data-dia');
      if (a === 'fechar' || a === 'fechar-dia-sheet') fecharPainelDia();
      else if (a === 'novo') novoNoDia(d);
      else if (a === 'abrir-dia') { fecharSheets(); estado.dataRef = d; setVista('dia'); render(); }
      else if (a === 'agenda-mais') agendaMais();
      return;
    }
    // Zona livre do painel (fora de chips, botões e ×): abre a vista Dia.
    var painel = e.target.closest('.dia-painel[data-abrir-dia]');
    if (painel) { e.stopPropagation(); estado.dataRef = painel.getAttribute('data-abrir-dia'); setVista('dia'); render(); return; }
    // "+N mais" seleciona o dia e abre o painel lateral.
    var mais = e.target.closest('[data-mais]');
    if (mais) { e.stopPropagation(); selecionarDia(mais.getAttribute('data-mais')); return; }
    var cel = e.target.closest('.hora-cel');
    if (cel) {
      var col = cel.closest('.dia-col');
      abrirNovo({ data: col.getAttribute('data-dia'), horaInicio: cel.getAttribute('data-hora') });
      return;
    }
    var di = e.target.closest('[data-dia-inteiro]');
    if (di) { abrirNovo({ data: di.getAttribute('data-dia-inteiro'), diaInteiro: true }); return; }
    // Clique vazio na célula (ou no número) seleciona o dia; clicar no já
    // selecionado não fecha. Criar evento passa a ser pelo painel ou pelo N.
    var mesCel = e.target.closest('.mes-cel');
    if (mesCel) { selecionarDia(mesCel.getAttribute('data-dia')); }
  }
  vistaEl.addEventListener('click', cliqueVista);
  if (diaSheetCorpo) diaSheetCorpo.addEventListener('click', cliqueVista);
  if (diaSheet) diaSheet.addEventListener('click', function (e) {
    var a = e.target.closest('[data-acao="fechar-dia-sheet"]');
    if (a) { e.stopPropagation(); fecharSheetDia(); }
  });
  if (calCamadas) calCamadas.addEventListener('click', function (e) {
    var a = e.target.closest('[data-acao="fechar-camadas"]');
    if (a) { e.stopPropagation(); fecharCamadas(); }
  });
  vistaEl.addEventListener('dblclick', function (e) {
    var num = e.target.closest('[data-dia-num]');
    if (num) { e.stopPropagation(); estado.dataRef = num.getAttribute('data-dia-num'); setVista('dia'); render(); }
  });

  document.getElementById('btnAnterior').addEventListener('click', function () { navegar(-1); });
  document.getElementById('btnSeguinte').addEventListener('click', function () { navegar(1); });
  document.getElementById('btnHoje').addEventListener('click', function () { setDataRef(hojeISO()); });
  document.getElementById('btnNovo').addEventListener('click', function () { abrirNovo({ data: estado.dataRef }); });
  document.getElementById('camadaPag').addEventListener('click', function () { setCamadaPag(!camadaPag); });
  document.getElementById('outConta').addEventListener('click', abrirContaOutlook);
  document.getElementById('outErro').addEventListener('click', abrirDiagnosticoOutlook);
  document.getElementById('camadaOut').addEventListener('click', function () {
    var est = GiocoOutlook.estado();
    // 'a-verificar', 'webview' e 'indisponivel' não fazem nada: o botão está
    // desactivado nesses estados e o detalhe abre pelo link ao lado.
    if (est !== 'ligado' && est !== 'desligado') return;
    if (est === 'ligado') { setCamadaOut(!camadaOut); return; }
    // Sem sessão: o botão é "Ligar Outlook". Um erro aqui fica na barra e
    // não mexe em mais nada do calendário.
    var btn = this, txt = document.getElementById('camadaOutTxt');
    btn.disabled = true; txt.textContent = 'A ligar…';
    outErro = ''; outErroObj = null;
    GiocoOutlook.ligar().then(function (c) {
      btn.disabled = false;
      if (c) setCamadaOut(true);   // ligou agora: mostra logo a camada
      else render();               // caiu para redirect: a página vai embora
    })['catch'](function (e) {
      btn.disabled = false;
      // Guarda-se o objecto INTEIRO: o errorMessage do MSAL é o que diz mesmo
      // o que se passou, e antes era deitado fora em favor do errorCode.
      registarErroOutlook(e, true);
      render();
    });
  });
  /* Telemóvel: o botão de camadas (na .mob-bar) abre/fecha a folha com os
     MESMOS toggles (#calCamadas), e o flutuante cria no dia selecionado (ou
     no dia de referência). O formulário é o do gioco-eventos.js, como em
     desktop. */
  document.getElementById('btnCamadas').addEventListener('click', function () {
    if (camadasAbertas()) fecharCamadas(); else abrirCamadas();
  });
  document.getElementById('fabNovo').addEventListener('click', function () {
    novoNoDia(estado.diaSelecionado || estado.dataRef);
  });
  document.getElementById('segVista').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vista]');
    if (b) setVista(b.getAttribute('data-vista'));
  });

  document.addEventListener('keydown', function (e) {
    if (window.giocoModal && giocoModal.isOpen()) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'Escape') {
      if (camadasAbertas()) { e.preventDefault(); fecharCamadas(); }
      else if (sheetDiaAberta()) { e.preventDefault(); fecharSheetDia(); }
      else if (estado.vista === 'mes' && estado.diaSelecionado) { e.preventDefault(); fecharPainelDia(); }
    }
    else if (k === 'ArrowLeft') { e.preventDefault(); navegar(-1); }
    else if (k === 'ArrowRight') { e.preventDefault(); navegar(1); }
    else if (k === 't' || k === 'T') { e.preventDefault(); setDataRef(hojeISO()); }
    else if (k === 'm' || k === 'M') { e.preventDefault(); setVista('mes'); }
    else if (k === 's' || k === 'S') { e.preventDefault(); setVista('semana'); }
    else if (k === 'd' || k === 'D') { e.preventDefault(); setVista('dia'); }
    // preventDefault: sem isto o "n" era escrito no título acabado de focar.
    // Com um dia selecionado na vista Mês, o N cria nesse dia.
    else if (k === 'n' || k === 'N') { e.preventDefault(); abrirNovo({ data: (estado.vista === 'mes' && estado.diaSelecionado) || estado.dataRef }); }
  });

  /* ---------- Detalhe só de leitura de um pagamento (fonte 'pagamentos') ---------- */
  function abrirDetalhePagamento(item) {
    var x = item.extra || {};
    var pago = x.estado === 'pago';
    var corpo = el('div', { 'class': 'pag-detalhe' });
    corpo.appendChild(el('p', { 'class': 'pag-titulo', text: item.titulo }));
    corpo.appendChild(el('p', { 'class': 'pag-valor num', text: formatEuro(x.valor) }));
    function kv(k, v) { corpo.appendChild(el('div', { 'class': 'pag-kv' }, [el('span', { text: k }), v])); }
    kv('Estado', el('span', { 'class': 'status ' + (pago ? 'ok' : 'warn'), text: pago ? 'Pago' : 'Pendente' }));
    kv('Tipo', el('span', { text: x.tipo === 'pedido' ? item.notas.split(' · ')[0] : 'Compromisso fixo' }));
    kv('Data', el('span', { 'class': 'num', text: diaSemanaLongo(item.data) + ', ' + diaDe(item.data) + ' ' + mesCurto(item.data) + ' ' + anoDe(item.data) }));
    if (item.notas) kv('Notas', el('span', { 'class': 'pag-notas', text: item.notas }));
    var href = 'tesouraria.html?dia=' + encodeURIComponent(item.data) + '&chave=' + encodeURIComponent(x.chaveTesouraria || '');
    var abrir = el('a', { 'class': 'btn-add', href: href, text: 'Abrir na Tesouraria' });
    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, [fechar, abrir])]));
    giocoModal.open({ titulo: 'Pagamento', conteudo: corpo });
  }

  /* ---------- Detalhe só de leitura de um evento do Outlook ----------
     Mesmo padrão do detalhe dos pagamentos (.pag-detalhe + .ev-actions).
     NUNCA abre o formulário de edição: a fonte é o Outlook, e o OS não
     escreve lá nem copia o evento para o nó eventos/. */
  function abrirDetalheOutlook(item) {
    var x = item.extra || {};
    var corpo = el('div', { 'class': 'pag-detalhe out-detalhe' });
    corpo.appendChild(el('p', { 'class': 'pag-titulo', text: item.titulo }));
    function kv(k, v) { corpo.appendChild(el('div', { 'class': 'pag-kv' }, [el('span', { text: k }), v])); }
    var dia = diaSemanaLongo(item.data) + ', ' + diaDe(item.data) + ' ' + mesCurto(item.data) + ' ' + anoDe(item.data);
    var horas = item.diaInteiro ? 'Dia inteiro' : (item.horaInicio || '') + (item.horaFim ? '–' + item.horaFim : '');
    kv('Quando', el('span', { 'class': 'num', text: dia + ' · ' + horas }));
    /* O campo Local quando é SÓ o URL da reunião não se mostra: fica
       redundante ao lado do botão "Entrar na reunião". Com texto à volta
       ("Sala 2 · https://…"), mostra-se o texto como sempre. */
    var localSoLink = !!(x.reuniao && String(x.local || '').trim() === x.reuniao.url);
    if (x.local && !localSoLink) kv('Local', el('span', { text: x.local }));
    if (x.reuniao) kv('Videochamada', el('span', { text: x.reuniao.servico }));
    if (x.organizador) kv('Organizador', el('span', { text: x.organizador }));
    kv('Origem', el('span', { text: 'Outlook · só leitura' }));

    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    /* Ordem visual: [Fechar] [Entrar na reunião] [Abrir no Outlook].
       Com link de reunião, a acção provável é ENTRAR, não ir ver o convite:
       o "Entrar" fica com o .btn-add cheio e o "Abrir no Outlook" desce a
       .ev-btn-outline, para não haver dois botões vermelhos indistintos. Sem
       reunião, o "Abrir no Outlook" continua a ser o primário, como sempre. */
    var direita = [fechar];
    if (x.reuniao) {
      direita.push(el('a', {
        'class': 'btn-add', href: x.reuniao.url, target: '_blank', rel: 'noopener noreferrer',
        title: 'Abrir ' + x.reuniao.servico + ' em nova janela', text: 'Entrar na reunião'
      }));
    }
    if (x.webLink) {
      direita.push(el('a', {
        'class': x.reuniao ? 'ev-btn-outline' : 'btn-add',
        href: x.webLink, target: '_blank', rel: 'noopener noreferrer', text: 'Abrir no Outlook'
      }));
    }
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, direita)]));
    giocoModal.open({ titulo: 'Evento do Outlook', conteudo: corpo });
  }

  /* Painel de diagnóstico do Outlook (giocoModal).
     Existe porque o telemóvel não tem consola nem hover: sem isto, um login
     falhado em iOS mostrava três palavras e mais nada. Mostra o errorCode E o
     errorMessage completos, o redirectUri resolvido em runtime (a causa número
     um de redirect_uri_mismatch), o ambiente detectado e o user agent. */
  function textoDiagnostico() {
    var d = GiocoOutlook.diagnostico();
    var e = outErroObj || {};
    var linhas = [
      'GIOCO OS · diagnóstico do Outlook',
      new Date().toISOString(),
      '',
      'errorCode:    ' + (e.errorCode || d.errorCode || '—'),
      'errorMessage: ' + (e.errorMessage || e.message || d.errorMessage || '—'),
      'subError:     ' + (e.subError || d.subError || '—'),
      'correlationId:' + (e.correlationId || d.correlationId || '—'),
      '',
      'estado:       ' + d.estado,
      'redirectUri:  ' + d.redirectUri,
      'href:         ' + window.location.href,
      'ambiente:     ios=' + d.ambiente.ios + ' webview=' + d.ambiente.webview +
        (d.ambiente.motivo ? ' (' + d.ambiente.motivo + ')' : ''),
      'MSAL:         ' + d.sdk,
      'redirect deu sessão: ' + d.redirectTrouxeSessao,
      '',
      'userAgent:',
      d.ua
    ];
    if (e.stack) linhas.push('', 'stack:', String(e.stack));
    return linhas.join('\n');
  }

  function abrirDiagnosticoOutlook() {
    var texto = textoDiagnostico();
    var corpo = el('div', { 'class': 'diag' });
    var est = GiocoOutlook.estado();
    if (est === 'webview') {
      corpo.appendChild(el('p', { text: 'Estás a ver esta página dentro de um browser embutido numa app. ' +
        'A Microsoft bloqueia o login nestes browsers, por isso nem se tenta. ' +
        'Abre a página no Safari (menu ··· → "Abrir no Safari") e liga aí a conta — ' +
        'a sessão fica guardada e o resto do calendário funciona na mesma aqui.' }));
    } else {
      corpo.appendChild(el('p', { text: 'Detalhe técnico do último erro. Copia e envia isto se for preciso perceber o que falhou.' }));
    }
    corpo.appendChild(el('pre', { text: texto }));

    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    var copiar = el('button', { type: 'button', 'class': 'btn-add', text: 'Copiar' });
    copiar.addEventListener('click', function () {
      function feito() { copiar.textContent = 'Copiado ✓'; setTimeout(function () { copiar.textContent = 'Copiar'; }, 2000); }
      function falhou() {
        // Sem clipboard (contexto não seguro, permissão negada): seleciona o
        // texto para o utilizador copiar à mão, que em iOS é um toque longo.
        copiar.textContent = 'Seleciona e copia';
        var pre = corpo.querySelector('pre');
        try {
          var r = document.createRange(); r.selectNodeContents(pre);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        } catch (err) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(feito, falhou);
      } else { falhou(); }
    });
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, [fechar, copiar])]));
    giocoModal.open({ titulo: est === 'webview' ? 'Abre no Safari' : 'Diagnóstico do Outlook', conteudo: corpo });
  }

  /* Painel da conta Microsoft: quem está ligado e o botão de desligar.
     Desligar é LOCAL — limpa a cache do MSAL neste browser e não manda o
     Manel para a página de logout da Microsoft (ver gioco-outlook.js). */
  function abrirContaOutlook() {
    var c = GiocoOutlook.conta() || { email: '', nome: '' };
    var corpo = el('div', { 'class': 'out-conta' });
    corpo.appendChild(el('p', { 'class': 'out-email', text: c.email || c.nome || 'Conta ligada' }));
    corpo.appendChild(el('p', { text: 'O calendário é lido em Calendars.Read. O GIOCO OS nunca escreve no Outlook nem copia estes eventos para a agenda do OS.' }));
    var desligar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Desligar conta' });
    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    desligar.addEventListener('click', function () {
      desligar.disabled = true; desligar.textContent = 'A desligar…';
      GiocoOutlook.desligar().then(function () {
        outEventos = []; outCache = {}; outIntervalo = null; outErro = '';
        setCamadaOut(false);
        giocoModal.close();
      });
    });
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, [fechar, desligar])]));
    giocoModal.open({ titulo: 'Conta Microsoft', conteudo: corpo });
  }

  /* ---------- Modais de evento (gioco-eventos.js) ----------
     Formulário, validação, atalhos (Enter / Ctrl+Enter) e escritas vivem no
     motor. A página só decide a data por omissão e o bloco "Pedido da loja". */
  function abrirNovo(pre) {
    pre = pre || {};
    EV.abrirNovo({ data: pre.data || estado.dataRef, diaInteiro: pre.diaInteiro, horaInicio: pre.horaInicio });
  }

  function abrirEditar(id) {
    var bruto = eventosPorId[id];
    if (!bruto) return;
    EV.abrirEditar(id, bruto, { antes: blocoPedidoLoja(bruto) });
  }

  // Bloco só de leitura por cima do formulário quando o evento nasceu de um
  // pedido da loja (ligacao.tipo 'lojaPedido'). Lê lojaPedidos/{id} com um
  // once('value') ao abrir — só leitura; se o pedido já não existir, diz.
  function blocoPedidoLoja(bruto) {
    var lig = bruto && bruto.ligacao;
    if (!lig || lig.tipo !== 'lojaPedido' || !lig.id) return null;
    var corpo = el('div', { 'class': 'ev-ligacao' }, [
      el('div', { 'class': 'ev-ligacao-t', html: '<svg class="icon" width="14" height="14"><use href="#i-store"/></svg><span>Pedido da loja</span>' }),
      el('p', { text: 'A carregar…' })
    ]);
    db.ref('lojaPedidos').child(String(lig.id)).once('value').then(function (snap) {
      var p = snap.val();
      var texto = corpo.querySelector('p');
      if (!p) { texto.textContent = 'Pedido apagado na loja'; }
      else {
        var desc = String(p.descricao || '').replace(/\s+/g, ' ').trim();
        if (desc.length > 200) desc = desc.slice(0, 200).trim() + '…';
        texto.textContent = desc;
        var meta = [p.pessoa, p.zona && p.zona !== '—' ? p.zona : ''].filter(Boolean).join(' · ');
        if (meta) corpo.insertBefore(el('p', { text: meta }), texto.nextSibling);
      }
      corpo.appendChild(el('a', { href: 'mrn-dashboard.html#cardPedidos', text: 'Ver no dashboard →' }));
    }).catch(function (err) {
      corpo.querySelector('p').textContent = 'Não foi possível ler o pedido.';
      console.error(err);
    });
    return corpo;
  }

  /* ---------- Deep-link (mesmo padrão da tesouraria.html) ----------
     ?dia=AAAA-MM-DD → vista Mês nesse mês com o painel do dia aberto;
     ?evento=ID → abre o modal de edição no primeiro snapshot de eventos/ em
     que o id existe e não está anulado (uma só vez; inválido ou anulado é
     ignorado). Sem parâmetros nada muda. Só leitura. */
  var deepEvento = null;
  (function () {
    try {
      var qs = new URLSearchParams(window.location.search);
      var dia = qs.get('dia');
      if (dia && isoValida(dia)) {
        // Ao telemóvel a Agenda a partir desse dia diz o mesmo que o painel
        // lateral do Mês diz em desktop — e a folha do dia abre por cima.
        estado.vista = ehMobile() ? 'agenda' : 'mes';
        estado.dataRef = dia;
        estado.diaSelecionado = dia;
      }
      var ev = qs.get('evento');
      if (ev && /^[A-Za-z0-9_-]+$/.test(ev)) deepEvento = ev;
    } catch (e) { /* URL estranho: comportamento por omissão */ }
  })();

  /* ---------- Ligação ao Firebase (só atualiza estado e chama render) ---------- */
  eventosRef.on('value', function (snapshot) {
    var val = snapshot.val() || {};
    eventosPorId = val;
    var lista = [];
    Object.keys(val).forEach(function (id) {
      var ev = normalizarManual(id, val[id]);
      if (ev) lista.push(ev);
    });
    estado.eventos = lista;   // fonte 'manual'; outras fontes juntam-se aqui
    estado.carregado = true;
    indexarEventos();
    render();
    if (deepEvento && val[deepEvento]) {
      var alvo = deepEvento; deepEvento = null;
      if (val[alvo].anulado !== true) abrirEditar(alvo);
    }
  });

  // Os cinco nós da fonte 'pagamentos' — só leitura. Um flag por nó; até
  // chegarem todos a página funciona só com eventos.
  paymentRequestsRef.on('value', function (s) { allPaymentRequests = s.val() || {}; carregado.payreq = true; render(); });
  compromissosRef.on('value', function (s) { allCompromissos = s.val() || {}; carregado.comp = true; render(); });
  pagamentosConcluidosRef.on('value', function (s) { allPagamentosConcluidos = s.val() || {}; carregado.concl = true; render(); });
  recibosRef.on('value', function (s) { allRecibos = s.val() || {}; carregado.recibos = true; render(); });
  pessoasRef.on('value', function (s) { allPessoas = s.val() || {}; carregado.pessoas = true; render(); });

  /* O MSAL JÁ arrancou lá em cima, em paralelo com o Firebase (ver o bloco
     antes do autenticarEContinuar). Aqui só nos ligamos à promessa para voltar
     a desenhar quando o estado deixar de ser 'a-verificar'. */
  GiocoOutlook.pronto().then(function (resultado) {
    /* Regresso do redirect (telemóvel): dois casos que antes ficavam mudos.
       1) Trouxe sessão → o Manel tinha carregado em "Ligar Outlook" antes
          de a página ir embora, por isso liga-se a camada de imediato, tal
          como o ramo do popup faz (senão voltava com o botão em "Outlook"
          desligado e parecia que o login não tinha feito nada).
       2) Trouxe um erro (state perdido pelo ITP, redirect_uri_mismatch,
          consentimento recusado…) → vai para o #outErro e para a consola,
          em vez de morrer dentro do handleRedirectPromise. */
    if (resultado && GiocoOutlook.estaLigado()) { setCamadaOut(true); return; }
    var erroRed = GiocoOutlook.erroDoRedirect();
    if (erroRed) registarErroOutlook(erroRed, true);
    render();
  }, function () { render(); });

  render();
  // Deep-link ?dia= ao telemóvel: o painel lateral não existe, abre a folha.
  if (ehMobile() && estado.diaSelecionado) abrirSheetDia(estado.diaSelecionado);
  }); // fim de autenticarEContinuar
</script>
