<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#FFEDDA">
<meta name="apple-mobile-web-app-title" content="Calendário">
<meta name="viewport" content="width=1200">
<title>GIOCO OS · Calendário</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="gioco-shell.css">
<link rel="stylesheet" href="gioco-eventos.css">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="gioco-compromissos.js"></script>
<script src="gioco-pagamentos.js"></script>
<script src="gioco-eventos.js"></script>
<!-- MSAL Browser 2.38.2 (CDN da Microsoft, mesma classe de confiança do gstatic
     de onde já vem o Firebase). Versão FIXA e integrity obrigatório: os bytes
     deste URL foram conferidos contra o tarball oficial do npm. Nunca "latest".
     É a única dependência de terceiros do OS fora do Firebase/pdf.js. -->
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"
        integrity="sha384-hhkHFODse2T75wPL7oJ0RZ+0CgRa74LNPhgx6wO6DMNEhU3/fSbTZdVzxsgyUelp"
        crossorigin="anonymous"></script>
<script src="gioco-outlook.js"></script>

<style>
  body{ -webkit-font-smoothing:antialiased; }

  .page-subtitle{ margin:0 0 4px; font-size:13px; color:var(--muted); }

  /* ---------- Erro de autenticação (padrão do OS) ---------- */
  #authErro{ display:none; margin:18px 0 0; }
  #authErro.on{ display:block; }
  .auth-box{ border-left:4px solid var(--red); background:var(--white); border-radius:12px; padding:20px 22px; }
  .auth-box h2{ margin:0 0 8px; font-family:'Inter',sans-serif; font-size:15px; font-weight:700; color:var(--red-ink); }
  .auth-box p{ margin:0 0 16px; font-size:13.5px; color:var(--muted); line-height:1.55; }

  /* O ::before do .glass-light pinta por cima do conteúdo estático: empurrar
     o conteúdo para z-index:1 (mesmo truque do shell na sidebar). */
  .cal-bar > *, .cal-vista > *, .dia-painel > *{ position:relative; z-index:1; }

  /* ---------- Barra de controlo ---------- */
  .cal-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:18px 0 10px; padding:14px 18px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav .icon-btn{ padding:0; font:inherit; }
  .cal-titulo{ flex:1; text-align:center; font-family:'Inter',sans-serif; font-weight:600; font-size:17px; color:var(--ink); min-width:220px; }
  .cal-dir{ display:flex; align-items:center; gap:10px; }

  /* Botão outline local (padrão .btn da pagamentos.html — não é classe do shell). */
  .btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:var(--white); color:var(--ink);
    border:1.5px solid var(--line); border-radius:100px;
    padding:9px 18px; cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, background .15s ease, color .15s ease;
  }
  .btn:hover{ border-color:var(--red); }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-add .icon{ width:14px; height:14px; }

  /* Toggle da camada de pagamentos: pílula com círculo --blush. */
  .camada-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:var(--white); color:var(--ink); border:1.5px solid var(--line); border-radius:100px;
    padding:7px 14px 7px 9px; cursor:pointer; transition:border-color .15s ease, opacity .15s ease;
  }
  .camada-btn i{ width:12px; height:12px; border-radius:50%; background:var(--blush); display:inline-block; }
  .camada-btn:hover{ border-color:var(--red); }
  .camada-btn[aria-pressed="false"]{ opacity:.55; }
  .camada-btn[aria-pressed="false"] i{ background:transparent; box-shadow:inset 0 0 0 2px var(--blush); }
  /* ---------- Camada Outlook ----------
     Par neutro derivado da família --line / --muted do shell: as seis
     superfícies de selo (lime, navy, mustard, red, blush, sky) estão todas
     tomadas pelas categorias e o --blush é dos pagamentos, por isso a camada
     de leitura do Outlook é cinzenta de propósito — informativa, não
     acionável, e imediatamente distinta das outras duas. Par claro/escuro
     obrigatório: é superfície COM texto por cima. */
  :root{ --out-bg:#ddd8cf; --out-ink:#33302a; }
  [data-theme="dark"]{ --out-bg:#37332c; --out-ink:#e6e0d4; }

  .camada-btn.out i{ background:var(--out-bg); box-shadow:inset 0 0 0 1px var(--muted); }
  /* Sem sessão Microsoft o mesmo botão vira "Ligar Outlook": sem ponto de
     camada e sem o esbatido do aria-pressed="false" (que só faz sentido
     quando já há camada para ligar/desligar). */
  .camada-btn.ligar{ opacity:1; padding-left:14px; }
  .camada-btn.ligar i{ display:none; }
  .camada-btn.out[aria-pressed="false"] i{ background:transparent; box-shadow:inset 0 0 0 2px var(--out-bg); }
  /* Abre o painel da conta Microsoft (giocoModal). Colado ao chip da camada. */
  .camada-mais{
    background:var(--white); color:var(--muted); border:1.5px solid var(--line);
    border-radius:100px; width:28px; height:28px; padding:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; margin-left:-4px;
  }
  .camada-mais:hover{ border-color:var(--red); color:var(--ink); }
  /* O display:inline-flex das classes acima vence o [hidden] do browser:
     sem estas duas regras, esconder por hidden não fazia nada. */
  .camada-btn[hidden], .camada-mais[hidden]{ display:none; }
  .camada-mais .icon{ width:14px; height:14px; }
  /* Erro do Graph / do login: discreto ao lado da camada, e CLICÁVEL — no
     telemóvel não há hover nem consola, por isso o detalhe tem de abrir num
     painel em vez de viver só num title=. */
  .out-erro{
    font-size:11.5px; color:var(--red-ink); cursor:pointer;
    background:none; border:none; padding:0; font-family:'Inter',sans-serif;
    text-decoration:underline; text-underline-offset:2px;
  }
  .out-erro:hover{ color:var(--ink); }
  .out-erro[hidden]{ display:none; }
  /* Painel de diagnóstico do login. */
  .diag{ color:var(--ink); font-size:13px; }
  .diag p{ margin:0 0 12px; color:var(--muted); font-size:12.5px; line-height:1.5; }
  .diag pre{
    margin:0 0 14px; padding:12px; border-radius:10px;
    background:var(--dough); border:1px solid var(--line);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto;
    color:var(--ink); -webkit-user-select:text; user-select:text;
  }
  .out-conta{ color:var(--ink); font-size:13px; }
  .out-conta .out-email{ font-weight:600; margin:0 0 4px; }
  .out-conta p{ margin:0 0 14px; color:var(--muted); font-size:12.5px; line-height:1.5; }

  .ev-chip.out{ background:var(--out-bg); color:var(--out-ink); }
  .ev-bloco.out{ background:var(--out-bg); color:var(--out-ink); }

  .sem-data{ font-size:11.5px; color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--muted); }
  .sem-data:hover{ color:var(--red-ink); border-bottom-color:var(--red-ink); }

  .seg{ display:inline-flex; border:1.5px solid var(--line); border-radius:100px; padding:3px; background:var(--white); }
  .seg button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:transparent; color:var(--ink); border:none; border-radius:100px;
    padding:6px 14px; cursor:pointer;
  }
  .seg button.active{ background:var(--ink); color:var(--dough); }

  .cal-legenda{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; font-size:11.5px; color:var(--muted); margin:0 6px 16px; }
  .cal-legenda span{ display:inline-flex; align-items:center; gap:6px; }
  .cal-legenda i{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  /* ---------- Vista ---------- */
  .cal-vista{ padding:16px; color:var(--ink); }
  .cal-vista:hover{ transform:none; }
  /* Na vista Mês o painel do dia é sticky: o overflow:hidden do .glass-light
     prendia-o ao cartão, por isso aqui fica visível (o ::before já tem raio). */
  .cal-vista.vista-mes{ overflow:visible; }

  /* Chip de evento (mês e faixa dia-inteiro da semana). Cores de texto fixas
     por categoria (como .status.* do shell), nunca var(--ink). */
  .ev-chip{
    display:block; height:20px; line-height:20px; border-radius:6px; padding:0 7px;
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; border:none; width:100%; text-align:left;
  }
  .ev-chip:hover{ filter:brightness(0.94); }
  .ev-chip .num{ font-weight:500; margin-right:3px; }
  /* Evento nascido de um pedido da loja (ligacao.tipo 'lojaPedido'): ícone store antes do título. */
  .ev-chip .icon, .ev-bloco .icon, .dia-item-t .icon{ width:14px; height:14px; vertical-align:-2px; margin-right:4px; }
  /* Chip de pagamento (fonte 'pagamentos'): --blush + texto fixo; pago = ✓ e esbatido. */
  .ev-chip.pag{ background:var(--blush); color:#141414; }
  .ev-chip.pag .num{ margin:0 0 0 4px; opacity:.85; }
  .ev-chip.pago{ opacity:.55; }

  /* ---------- Mês ---------- */
  .mes-cab{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin-bottom:6px; }
  .mes-cab div{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:center; padding:2px 0 4px; }
  .mes-grelha{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); grid-template-rows:repeat(6, 108px); gap:6px; }
  .mes-cel{
    position:relative; border-radius:10px; padding:6px 6px 4px;
    background:var(--white); border:1.5px solid var(--line); color:var(--ink);
    display:flex; flex-direction:column; gap:3px; cursor:pointer; overflow:hidden;
    transition:border-color .15s ease;
  }
  .mes-cel:hover{ border-color:var(--ink); }
  /* Dia selecionado (painel aberto): anel de 2px --ink por dentro nos DOIS temas
     (o --ink já inverte com o tema), sem tocar na pílula de hoje. */
  .mes-cel.sel{ box-shadow:inset 0 0 0 2px var(--ink); }
  /* Grelha + painel de detalhe lado a lado (mesmo padrão da padroes.html). */
  .mes-layout{ display:flex; gap:16px; align-items:flex-start; }
  .mes-grelha-wrap{ flex:1; min-width:640px; }
  .mes-layout .dia-painel{ width:auto; min-width:300px; max-width:360px; flex:0 1 360px; position:sticky; top:16px; }
  /* Na vista Mês, clicar em qualquer zona livre do painel abre a vista Dia. */
  .dia-painel[data-abrir-dia]{ cursor:pointer; }
  .mes-cel.fds{ background:var(--dough); }
  .mes-cel.fora{ opacity:.4; }
  .mes-num{ align-self:flex-start; font-size:11.5px; font-weight:600; color:var(--muted); padding:1px 6px; border-radius:100px; line-height:16px; cursor:pointer; user-select:none; }
  .mes-cel.hoje .mes-num{ background:var(--red); color:var(--on-red); }
  .mes-mais{ font-size:11px; font-weight:600; color:var(--muted); background:none; border:none; padding:0 7px; text-align:left; cursor:pointer; font-family:'Inter',sans-serif; }
  .mes-mais:hover{ color:var(--red-ink); }

  /* ---------- Semana / Dia (grelha horária) ---------- */
  .sem-cab{ display:grid; grid-template-columns:56px repeat(var(--ncols,7), minmax(0,1fr)); gap:0; margin-bottom:4px; }
  .sem-cab .sem-dia{ text-align:center; font-size:12px; font-weight:600; color:var(--muted); padding:2px 0 6px; }
  .sem-cab .sem-dia b{ font-weight:700; color:var(--ink); padding:1px 7px; border-radius:100px; }
  .sem-cab .sem-dia.hoje b{ background:var(--red); color:var(--on-red); }
  .sem-inteiro{ display:grid; grid-template-columns:56px repeat(var(--ncols,7), minmax(0,1fr)); gap:0; border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:4px; }
  .sem-inteiro .sem-lbl{ font-size:10.5px; color:var(--muted); padding-top:2px; }
  .sem-inteiro .sem-di-col{ display:flex; flex-direction:column; gap:3px; padding:0 3px; min-height:22px; cursor:pointer; }
  .sem-scroll{ max-height:600px; overflow-y:auto; overflow-x:hidden; border-radius:8px; }
  .sem-grelha{ display:grid; grid-template-columns:56px repeat(var(--ncols,7), minmax(0,1fr)); gap:0; height:816px; }
  .hora-col{ position:relative; height:816px; }
  .hora-lbl{ position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--muted); }
  .dia-col{ position:relative; height:816px; border-left:1px solid var(--line); }
  .dia-col.fds{ background:var(--dough); }
  .hora-cel{ position:absolute; left:0; right:0; height:48px; border-top:1px solid var(--line); cursor:pointer; }
  .hora-cel:hover{ background:rgba(217,17,36,0.06); }
  .ev-bloco{
    position:absolute; border-radius:8px; padding:3px 6px; overflow:hidden; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:11.5px; line-height:1.25;
    border:none; text-align:left; box-shadow:0 1px 0 rgba(0,0,0,0.08);
  }
  .ev-bloco:hover{ filter:brightness(0.94); }
  .ev-bloco b{ display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev-bloco .num{ font-size:10.5px; opacity:.85; }

  /* ---------- Dia ---------- */
  .dia-layout{ display:flex; gap:16px; align-items:flex-start; }
  .dia-grelha{ flex:1; min-width:0; }
  .dia-painel{ min-width:300px; width:300px; flex-shrink:0; padding:16px; color:var(--ink); }
  .dia-painel:hover{ transform:none; }
  .dia-painel-cab{ display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .dia-painel-cab h3{ flex:1; min-width:0; margin:0; font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dia-painel-cab .icon-btn{ width:32px; height:32px; padding:0; flex-shrink:0; font:inherit; }
  .dia-rodape{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .dia-abrir{ font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); background:none; border:none; padding:0; cursor:pointer; }
  .dia-abrir:hover{ color:var(--red-ink); }
  .dia-item{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--ink); font-family:'Inter',sans-serif; }
  .dia-item:last-child{ border-bottom:none; }
  .dia-item:hover .dia-item-t{ color:var(--red-ink); }
  .dia-item i{ width:4px; border-radius:2px; flex-shrink:0; align-self:stretch; }
  .dia-item-t{ font-size:13px; font-weight:600; }
  .dia-item-h{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .dia-item-n{ font-size:12px; color:var(--muted); margin-top:4px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; }
  .dia-vazio{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .dia-sec{ margin:16px 0 6px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .dia-pag{ display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--ink); font-family:'Inter',sans-serif; }
  .dia-pag:last-of-type{ border-bottom:none; }
  .dia-pag i{ width:4px; border-radius:2px; flex-shrink:0; align-self:stretch; background:var(--blush); min-height:28px; }
  .dia-pag .dia-pag-t{ flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dia-pag:hover .dia-pag-t{ color:var(--red-ink); }
  .dia-pag .dia-pag-v{ font-size:12.5px; font-weight:600; }
  .dia-pag.pago .dia-pag-t, .dia-pag.pago .dia-pag-v{ opacity:.6; }
  .dia-pag-total{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:8px; }
  .dia-pag-total b{ color:var(--ink); }

  /* Detalhe só de leitura de um pagamento (giocoModal). */
  .pag-detalhe{ color:var(--ink); font-size:13px; }
  .pag-detalhe .pag-titulo{ font-size:15px; font-weight:700; margin:0 0 6px; }
  .pag-detalhe .pag-valor{ font-size:28px; font-weight:700; margin:0 0 10px; }
  .pag-detalhe .pag-kv{ display:flex; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
  .pag-detalhe .pag-kv span:first-child{ width:90px; flex-shrink:0; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; padding-top:2px; }
  .pag-detalhe .pag-notas{ white-space:pre-line; line-height:1.45; }
  /* O detalhe do Outlook tem o rotulo "Videochamada", que nao cabe nos 90px
     da coluna de labels (o span tem flex-shrink:0 e transbordava por cima do
     valor). Modificador so para este modal — o dos pagamentos fica igual. */
  .pag-detalhe.out-detalhe .pag-kv span:first-child{ width:112px; }
  a.btn-add{ text-decoration:none; }

  /* O formulário do modal de evento vive em gioco-eventos.css (.ev-*). */
</style>
</head>

<body>
<script src="gioco-shell.js"></script>

<div class="shell">

  <div class="sidebar glass collapsed" id="sidebarEl">
    <div class="glass-bend"></div>
    <div class="brand">
      <div class="mark-collapsed"><svg class="icon" width="18" height="18"><use href="#i-menu"/></svg></div>
      <img src="Logo_Tomato_5x.png" alt="GIOCO" class="mark-logo">
      <div class="word">GIOCO OS<span>painel privado</span></div>
    </div>
    <nav id="giocoNav"></nav>
    <script>giocoNav('calendario.html', 'privada');</script>
    <div class="sidebar-foot">
      <!-- Sem sessões no GIOCO OS: utilizador fixo, sem dropdown nem logout. -->
      <div class="foot-user">
        <div class="foot-avatar"><svg class="icon" width="14" height="14"><use href="#i-settings"/></svg></div>
        <span>Manel</span><div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page">

      <div class="greet-row">
        <button class="sidebar-pin-btn glass-light" id="sidebarPinBtn" onclick="toggleSidebarPin()" title="Fixar a barra lateral fechada">
          <svg class="icon" width="16" height="16"><use href="#i-panel-left"/></svg>
        </button>
        <h1><svg class="icon" width="24" height="24" style="vertical-align:-3px;margin-right:8px"><use href="#i-calendar"/></svg>GIOCO · <b>Calendário</b></h1>
        <div class="spacer"></div>
        <label class="gio-toggle gio-toggle--lg gio-toggle--theme" title="Tema claro/escuro">
          <input type="checkbox" class="gio-toggle-input" id="toggleInput" checked onchange="toggleThemeSwitch()" aria-label="Tema claro">
          <span class="gio-toggle-track">
            <span class="gio-toggle-knob"><svg class="icon" width="14" height="14" id="knobIcon"><use href="#i-sun"/></svg></span>
            <span class="gio-toggle-ghost"><svg class="icon" width="13" height="13" id="ghostIcon"><use href="#i-moon"/></svg></span>
          </span>
        </label>
      </div>

      <p class="page-subtitle">Agenda pessoal</p>

      <!-- Sem sessão anónima a página não lê nem escreve nada. Escondido até
           falhar; ver autenticarEContinuar() mais abaixo. -->
      <div id="authErro">
        <div class="auth-box card glass-light">
          <h2>Sem ligação ao Firebase</h2>
          <p id="authErroDetalhe">A autenticação anónima não respondeu. Verifica a ligação à rede e tenta de novo — a página não lê nem escreve nada sem sessão.</p>
          <button type="button" class="btn-add" id="authRetryBtn">Tentar de novo</button>
        </div>
      </div>

      <div class="panel glass-light cal-bar" id="calBar">
        <div class="cal-nav">
          <button type="button" class="icon-btn" id="btnAnterior" title="Período anterior (←)"><svg class="icon" width="18" height="18"><use href="#i-chevron-left"/></svg></button>
          <button type="button" class="icon-btn" id="btnSeguinte" title="Período seguinte (→)"><svg class="icon" width="18" height="18"><use href="#i-chevron-right"/></svg></button>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDxjZXA3wp4sgxMxmiuOQDomx9GJgt3puE",
    authDomain: "gioco-fornecedores.firebaseapp.com",
    databaseURL: "https://gioco-fornecedores-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gioco-fornecedores",
    storageBucket: "gioco-fornecedores.firebasestorage.app",
    messagingSenderId: "441783294427",
    appId: "1:441783294427:web:51a362d4f91d0e2149effe"
  };
  firebase.initializeApp(firebaseConfig);

  // NÃO ALTERAR: autenticação anónima obrigatória antes de qualquer
  // leitura/escrita no Firebase. Ver decisão de segurança de Ago/2026.
  // Timeout de 8s de propósito: sem rede o signInAnonymously fica pendurado
  // indefinidamente e NUNCA rejeita — sem isto a página ficava em branco e muda
  // para quem está ao balcão. O #authErro aparece com um botão que volta a
  // tentar sem recarregar. Padrão único do OS: se mudar aqui, muda em todas.
  //
  // O callback fica guardado à primeira chamada para o retry o poder repetir
  // sem obrigar cada página a dar-lhe um nome.
  var authArrancou = false;
  var authCallback = null;

  function autenticarEContinuar(callback) {
    if (callback) authCallback = callback;

    var resolvido = false;
    var caixaErro = document.getElementById('authErro');
    var detalhe = document.getElementById('authErroDetalhe');

    if (caixaErro) caixaErro.classList.remove('on');

    function falhar(msg) {
      if (resolvido) return;
      resolvido = true;
      if (detalhe) detalhe.textContent = msg;
      if (caixaErro) caixaErro.classList.add('on');
    }

    var timer = setTimeout(function () {
      falhar('A autenticação anónima não respondeu em 8 segundos. Verifica a ligação à rede e tenta de novo — a página não lê nem escreve nada sem sessão.');
    }, 8000);

    firebase.auth().signInAnonymously()
      .then(function () {
        if (resolvido) return;
        resolvido = true;
        clearTimeout(timer);
        if (caixaErro) caixaErro.classList.remove('on');
        // Sem isto, um retry bem sucedido depois de um timeout voltava a montar
        // a página inteira por cima da que já lá estava.
        if (authArrancou) return;
        authArrancou = true;
        if (authCallback) authCallback();
      })
      .catch(function (erro) {
        clearTimeout(timer);
        console.error('Falha na autenticação anónima:', erro);
        // Não continuar sem sessão — evita escritas/leituras que vão
        // falhar de qualquer forma quando as rules apertarem.
        falhar('Falha na autenticação anónima (' + (erro && erro.code ? erro.code : 'erro desconhecido') + '). Verifica a ligação à rede e tenta de novo.');
      });
  }

  (function () {
    var btn = document.getElementById('authRetryBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var detalhe = document.getElementById('authErroDetalhe');
      if (detalhe) detalhe.textContent = 'A ligar…';
      autenticarEContinuar(null);
    });
  })();

  /* ---------- MSAL: arranca em PARALELO com o Firebase ----------
     As duas autenticações são independentes e nenhuma pode esperar pela outra.
     Antes disto o GiocoOutlook.init() vivia dentro do callback do
     autenticarEContinuar, o que atrasava o handleRedirectPromise até 8 s (ou
     para sempre, se o Firebase falhasse) — e o regresso do login da Microsoft
     ficava por processar sem ter nada a ver com a Microsoft.
     Se o Firebase falhar, a camada Outlook continua a funcionar; se o MSAL
     falhar, o calendário continua a funcionar. */
  try { GiocoOutlook.init(); } catch (e) { console.error('[outlook] init:', e); }

  autenticarEContinuar(function () {
  var db = firebase.database();
  var eventosRef = db.ref('eventos');
  // Fonte 'pagamentos' (SÓ LEITURA): os cinco nós que a tesouraria.html usa.
  // Os valores dos salários e da TSU dependem de recibos/pessoas. Nenhum
  // destes nós é escrito por esta página.
  var paymentRequestsRef = db.ref('paymentRequests');
  var compromissosRef = db.ref('compromissosFixos');
  var pagamentosConcluidosRef = db.ref('pagamentosConcluidos');
  var recibosRef = db.ref('recibos');
  var pessoasRef = db.ref('pessoas');
  var allPaymentRequests = {}, allCompromissos = {}, allPagamentosConcluidos = {}, allRecibos = {}, allPessoas = {};
  var carregado = { payreq: false, comp: false, concl: false, recibos: false, pessoas: false };
  function pagamentosCarregados(){ return carregado.payreq && carregado.comp && carregado.concl && carregado.recibos && carregado.pessoas; }

  /* =====================================================================
     ARQUITETURA — fontes.
     O render NUNCA toca no Firebase. Trabalha só com uma lista de itens
     NORMALIZADOS: {id, titulo, data, diaInteiro, horaInicio, horaFim,
     categoria, notas, origem, editavel, extra?}. Fontes hoje:
       'manual'     — o nó eventos/ (editavel:true), em estado.eventos;
       'pagamentos' — fontePagamentos(), só leitura (editavel:false), a
                      partir do gioco-pagamentos.js sobre os cinco nós da
                      tesouraria; entra na lista quando a camada está ligada.
     listaParaRender() junta as fontes; indexarEventos() indexa por dia.
     A diferença visual vive só em chipDe(item) / blocoDe(item) / painel do
     dia — sem ramos "if origem" espalhados pelo render. Ver CLAUDE.md.
     ===================================================================== */

  // Motor partilhado dos eventos (gioco-eventos.js): categorias, normalização,
  // formulário do modal e as únicas escritas em eventos/. Nomes destruturados
  // para os call sites ficarem iguais.
  var EV = giocoEventosEngine({ eventosRef: eventosRef, giocoModal: giocoModal });
  var CATEGORIAS = EV.CATEGORIAS, categoria = EV.categoria, el = EV.el;
  var pad2 = EV.pad2, isoValida = EV.isoValida, horaValida = EV.horaValida, minutos = EV.minutos, deMinutos = EV.deMinutos;

  /* ---------- Helpers partilhados com a tesouraria (iguais lá) ---------- */
  var MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function formatDateDDMMYYYY(d) {
    return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear();
  }
  function parseMontante(m){
    var n = parseFloat(String(m == null ? '' : m).replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  function ordenaPorPrazo(lista){
    lista.sort(function(a, b){
      if (!a.prazoDate && !b.prazoDate) return 0;
      if (!a.prazoDate) return 1;
      if (!b.prazoDate) return -1;
      return a.prazoDate - b.prazoDate;
    });
    return lista;
  }
  var fmtEuro = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 });
  function formatEuro(n) { return fmtEuro.format(Number(n) || 0); }

  var CE = giocoCompromissosEngine({
    getCompromissos: function(){ return allCompromissos; },
    getRecibos:      function(){ return allRecibos; },
    getPessoas:      function(){ return allPessoas; },
    formatEuro: formatEuro, parseMontante: parseMontante, MESES_PT: MESES_PT
  });
  var PG = giocoPagamentosEngine({
    getPaymentRequests:      function(){ return allPaymentRequests; },
    getPagamentosConcluidos: function(){ return allPagamentosConcluidos; },
    compromissos:            CE,
    parseMontante: parseMontante, formatDateDDMMYYYY: formatDateDDMMYYYY, ordenaPorPrazo: ordenaPorPrazo
  });

  var HORA_INICIO_GRELHA = 7;   // 07:00
  var HORA_FIM_GRELHA = 24;     // 24:00
  var PX_HORA = 48;
  var ALTURA_GRELHA = (HORA_FIM_GRELHA - HORA_INICIO_GRELHA) * PX_HORA;
  var MAX_CHIPS_MES = 3;

  /* ---------- Datas: funções puras ---------- */
  function toISODate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseISO(iso) {
    var p = String(iso).split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  function hojeISO() { return toISODate(new Date()); }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISODate(d); }
  function addMonths(iso, n) {
    var d = parseISO(iso);
    var dia = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    var ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(dia, ultimo));
    return toISODate(d);
  }
  function startOfWeekMonday(iso) {
    var d = parseISO(iso);
    var dow = (d.getDay() + 6) % 7; // 0 = segunda
    d.setDate(d.getDate() - dow);
    return toISODate(d);
  }
  function semanaDe(iso) {
    var ini = startOfWeekMonday(iso), out = [];
    for (var i = 0; i < 7; i++) out.push(addDays(ini, i));
    return out;
  }
  function monthGrid(ano, mes) { // mes 1-12 → 42 datas ISO, a começar à segunda
    var primeiro = ano + '-' + pad2(mes) + '-01';
    var ini = startOfWeekMonday(primeiro), out = [];
    for (var i = 0; i < 42; i++) out.push(addDays(ini, i));
    return out;
  }

  var fmtMesLongo = new Intl.DateTimeFormat('pt-PT', { month: 'long' });
  var fmtMesCurto = new Intl.DateTimeFormat('pt-PT', { month: 'short' });
  var fmtDiaSemanaLongo = new Intl.DateTimeFormat('pt-PT', { weekday: 'long' });
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function limpa(s) { return s.replace(/\.$/, ''); }
  function mesLongo(iso) { return cap(fmtMesLongo.format(parseISO(iso))); }
  function mesCurto(iso) { return cap(limpa(fmtMesCurto.format(parseISO(iso)))); }
  function diaSemanaLongo(iso) { return cap(fmtDiaSemanaLongo.format(parseISO(iso))); }
  // O 'short' do Intl em pt-PT devolve 'segunda' por extenso; o cabeçalho quer 'Seg'.
  var DIAS_CURTOS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  function diaSemanaCurto(iso) { return DIAS_CURTOS[(parseISO(iso).getDay() + 6) % 7]; }
  function anoDe(iso) { return iso.slice(0, 4); }
  function mesDe(iso) { return parseInt(iso.slice(5, 7), 10); }
  function diaDe(iso) { return parseInt(iso.slice(8, 10), 10); }

  function tituloPeriodo(vista, ref) {
    if (vista === 'mes') return mesLongo(ref) + ' ' + anoDe(ref);
    if (vista === 'semana') {
      var s = semanaDe(ref), a = s[0], b = s[6];
      if (mesDe(a) === mesDe(b)) return diaDe(a) + '–' + diaDe(b) + ' ' + mesCurto(a) + ' ' + anoDe(a);
      if (anoDe(a) === anoDe(b)) return diaDe(a) + ' ' + mesCurto(a) + ' – ' + diaDe(b) + ' ' + mesCurto(b) + ' ' + anoDe(b);
      return diaDe(a) + ' ' + mesCurto(a) + ' ' + anoDe(a) + ' – ' + diaDe(b) + ' ' + mesCurto(b) + ' ' + anoDe(b);
    }
    return diaSemanaLongo(ref) + ', ' + diaDe(ref) + ' ' + mesCurto(ref) + ' ' + anoDe(ref);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- Estado ---------- */
  var VISTAS = ['mes', 'semana', 'dia'];
  var vistaGuardada = null;
  try { vistaGuardada = localStorage.getItem('calendario.vista'); } catch (e) {}
  var estado = {
    vista: VISTAS.indexOf(vistaGuardada) >= 0 ? vistaGuardada : 'mes',
    dataRef: hojeISO(),
    diaSelecionado: null, // vista Mês: dia com o painel de detalhe aberto ("AAAA-MM-DD" | null)
    eventos: [],          // lista normalizada (todas as fontes)
    carregado: false
  };
  var eventosPorDia = new Map();
  var eventosPorId = {};   // só a fonte manual (nó bruto), para o modal de edição
  var itensPorId = {};     // todos os itens normalizados da última lista (todas as fontes)
  var camadaPag = true;
  try { camadaPag = localStorage.getItem('calendario.camada.pagamentos') !== '0'; } catch (e) {}
  function setCamadaPag(on) {
    camadaPag = !!on;
    try { localStorage.setItem('calendario.camada.pagamentos', camadaPag ? '1' : '0'); } catch (e) {}
    render();
  }

  /* ---------- Camada 'outlook' (SÓ LEITURA) ----------
     Segunda camada, no mesmo padrão da dos pagamentos (.camada-btn +
     aria-pressed + localStorage), mas DESLIGADA por omissão: obriga a uma
     sessão Microsoft e não deve ir buscar nada sem o Manel pedir.
     Os eventos vivem só aqui em memória, por intervalo visível — NUNCA são
     escritos no nó eventos/ (ver gioco-outlook.js).
     A estrutura aguenta uma terceira camada sem refactor: uma fonteX(), um
     flag próprio e mais uma entrada em listaParaRender(). */
  var camadaOut = false;
  try { camadaOut = localStorage.getItem('calendario.camada.outlook') === '1'; } catch (e) {}
  var outEventos = [];      // itens normalizados do intervalo já carregado
  var outIntervalo = null;  // 'ini|fim' ja pedido (evita repetir o mesmo GET)
  var outErro = '';         // mensagem discreta; nunca bloqueia o render
  var outErroObj = null;    // o objecto de erro INTEIRO (nunca uma string derivada)
  var outAPedir = false;
  var outCache = {};        // 'ini|fim' -> lista

  function setCamadaOut(on) {
    camadaOut = !!on;
    try { localStorage.setItem('calendario.camada.outlook', camadaOut ? '1' : '0'); } catch (e) {}
    if (!camadaOut) { outErro = ''; outErroObj = null; }
    render();
  }
  function outlookLigado() { return GiocoOutlook.disponivel() && GiocoOutlook.estaLigado(); }
  function fonteOutlook() { return (camadaOut && outlookLigado()) ? outEventos : []; }
  function ehOutlook(item) { return item.origem === 'outlook'; }

  // Intervalo que a vista mostra, fim EXCLUSIVO (a janela do calendarView).
  function intervaloVisivel() {
    var datas;
    if (estado.vista === 'mes') datas = monthGrid(parseInt(anoDe(estado.dataRef), 10), mesDe(estado.dataRef));
    else if (estado.vista === 'semana') datas = semanaDe(estado.dataRef);
    else datas = [estado.dataRef];
    return { ini: datas[0], fim: addDays(datas[datas.length - 1], 1) };
  }

  /* Chamado a cada render: só vai à rede quando o intervalo muda de facto
     (mudar de mês/semana/dia). Um erro fixa o intervalo na mesma, para não
     martelar o Graph em ciclo com o render que ele próprio provoca. */
  function atualizarOutlook() {
    if (!camadaOut || !outlookLigado()) return;
    var iv = intervaloVisivel(), chave = iv.ini + '|' + iv.fim;
    if (chave === outIntervalo) return;
    if (outCache[chave]) { outIntervalo = chave; outEventos = outCache[chave]; outErro = ''; render(); return; }
    if (outAPedir) return;   // o render do fim do pedido volta a passar por aqui
    outAPedir = true;
    GiocoOutlook.carregarEventos(iv.ini, iv.fim).then(function (lista) {
      outCache[chave] = lista;
      outIntervalo = chave; outEventos = lista; outErro = '';
    })['catch'](function (e) {
      console.error('[outlook]', e);
      outIntervalo = chave; outEventos = [];
      outErroObj = e || null;
      GiocoOutlook.guardarErro(e);
      outErro = (e && (e.errorMessage || e.message)) ? String(e.errorMessage || e.message) : 'Falha a ler o calendário.';
    }).then(function () { outAPedir = false; render(); });
  }

  function setVista(v) {
    if (VISTAS.indexOf(v) < 0 || v === estado.vista) return;
    estado.vista = v;
    try { localStorage.setItem('calendario.vista', v); } catch (e) {}
    render();
  }
  function setDataRef(iso) { estado.dataRef = iso; render(); }
  function navegar(dir) {
    if (estado.vista === 'mes') setDataRef(addMonths(estado.dataRef, dir));
    else if (estado.vista === 'semana') setDataRef(addDays(estado.dataRef, 7 * dir));
    else setDataRef(addDays(estado.dataRef, dir));
  }

  /* ---------- Normalização e índice ---------- */
  var normalizarManual = EV.normalizar;   // preserva origem e ligacao; anulado → null
  /* ---------- Fonte 'pagamentos' (só leitura) ----------
     mesesVisiveis: [{ano, mes}] — os compromissos geram-se por mês, só para
     os meses que a vista mostra (nunca para o ano). Pedidos: uma entrada
     POR LINHA, só as que têm prazo; as sem prazo contam-se à parte. */
  function fontePagamentos(mesesVisiveis) {
    var out = [];
    if (!pagamentosCarregados()) return out;
    PG.linhasPaymentRequestsTodas().forEach(function (l) {
      if (!l.prazoDate) return;
      out.push({
        id: 'pag:payreq:' + l.ticketId + '~' + l.lineIdx,
        titulo: l.fornecedor,
        data: toISODate(l.prazoDate),
        diaInteiro: true, horaInicio: null, horaFim: null,
        categoria: 'prazo',
        notas: 'Pedido #' + l.ticketNumero + (l.referencia ? ' · Ref. ' + l.referencia : ''),
        origem: 'pagamentos', editavel: false,
        extra: { valor: l.montante, estado: l.pago ? 'pago' : 'pendente', tipo: 'pedido', chaveTesouraria: PG.chaveLinha(l), prazoDate: l.prazoDate }
      });
    });
    mesesVisiveis.forEach(function (am) {
      PG.linhasCompromissosDoMes(am.ano, am.mes).forEach(function (l) {
        var rotulo = CE.rotuloEstado(l.estado);
        out.push({
          id: 'pag:fixo:' + l.compromissoId + '_' + PG.periodoCompromisso(l.prazoDate),
          titulo: l.fornecedor,
          data: toISODate(l.prazoDate),
          diaInteiro: true, horaInicio: null, horaFim: null,
          categoria: 'prazo',
          notas: rotulo + (l.nota ? (rotulo ? ' — ' : '') + l.nota : ''),
          origem: 'pagamentos', editavel: false,
          extra: { valor: l.montante, estado: l.pago ? 'pago' : 'pendente', tipo: 'compromisso', chaveTesouraria: PG.chaveLinha(l), prazoDate: l.prazoDate }
        });
      });
    });
    return out;
  }
  function linhasSemData() {
    if (!pagamentosCarregados()) return 0;
    return PG.linhasPaymentRequestsTodas().filter(function (l) { return !l.prazoDate; }).length;
  }
  function ehPagamento(item) { return item.origem === 'pagamentos'; }

  // Datas que a vista atual mostra → meses distintos, para a fonte de pagamentos.
  function mesesVisiveis() {
    var datas;
    if (estado.vista === 'mes') datas = monthGrid(parseInt(anoDe(estado.dataRef), 10), mesDe(estado.dataRef));
    else if (estado.vista === 'semana') datas = semanaDe(estado.dataRef);
    else datas = [estado.dataRef];
    var vistos = {}, out = [];
    datas.forEach(function (iso) {
      var k = iso.slice(0, 7);
      if (!vistos[k]) { vistos[k] = true; out.push({ ano: parseInt(anoDe(iso), 10), mes: mesDe(iso) }); }
    });
    return out;
  }

  // A lista que o render recebe: eventos manuais + (se a camada estiver
  // ligada) pagamentos dos meses visíveis. Aceita duplicados pedido/
  // compromisso, a mesma decisão da tesouraria.
  function listaParaRender() {
    var lista = estado.eventos.slice();
    if (camadaPag) lista = lista.concat(fontePagamentos(mesesVisiveis()));
    lista = lista.concat(fonteOutlook());
    return lista;
  }

  // Ordem dentro do dia: eventos de dia inteiro, depois pagamentos, depois os com hora.
  function grupoOrdem(ev) {
    if (ehPagamento(ev)) return 1;
    return ev.diaInteiro ? 0 : 2;
  }
  function compararEventos(a, b) {
    var ga = grupoOrdem(a), gb = grupoOrdem(b);
    if (ga !== gb) return ga - gb;
    var ha = a.horaInicio || '', hb = b.horaInicio || '';
    if (ha !== hb) return ha < hb ? -1 : 1;
    return a.titulo.localeCompare(b.titulo, 'pt');
  }
  function indexarEventos() {
    eventosPorDia = new Map();
    itensPorId = {};
    listaParaRender().forEach(function (ev) {
      itensPorId[ev.id] = ev;
      if (!eventosPorDia.has(ev.data)) eventosPorDia.set(ev.data, []);
      eventosPorDia.get(ev.data).push(ev);
    });
    eventosPorDia.forEach(function (lista) { lista.sort(compararEventos); });
  }
  function eventosDoDia(iso) { return eventosPorDia.get(iso) || []; }

  /* ---------- Render ---------- */
  var vistaEl = document.getElementById('calVista');
  var tituloEl = document.getElementById('calTitulo');
  var ultimoScrollChave = null;

  function render() {
    indexarEventos();   // a lista depende da vista (meses visíveis) e da camada
    tituloEl.textContent = tituloPeriodo(estado.vista, estado.dataRef);
    var btnCamada = document.getElementById('camadaPag');
    btnCamada.setAttribute('aria-pressed', camadaPag ? 'true' : 'false');
    renderCamadaOutlook();
    atualizarOutlook();
    var semData = document.getElementById('semData');
    var nSem = linhasSemData();
    semData.hidden = nSem === 0;
    semData.textContent = nSem + ' sem data';
    var botoes = document.querySelectorAll('#segVista button');
    for (var i = 0; i < botoes.length; i++) botoes[i].classList.toggle('active', botoes[i].getAttribute('data-vista') === estado.vista);
    vistaEl.classList.toggle('vista-mes', estado.vista === 'mes');
    if (estado.vista === 'mes') renderMes();
    else if (estado.vista === 'semana') renderGrelhaHoraria(semanaDe(estado.dataRef));
    else renderDia();
  }

  /* paleta(item): a cor de um item por FONTE, num só sítio.
     Manual → a cor da categoria; Outlook → o par neutro --out-*.
     Os pagamentos não passam por aqui (têm chip próprio, --blush). */
  function paleta(ev) {
    if (ehOutlook(ev)) return { cor: 'var(--out-bg)', texto: 'var(--out-ink)', label: 'Outlook', classe: ' out' };
    var c = categoria(ev.categoria);
    return { cor: c.cor, texto: c.texto, label: c.label, classe: '' };
  }

  /* Barra: o mesmo botão serve de toggle da camada e, sem sessão, de
     "Ligar Outlook". O botão ao lado abre o painel da conta (giocoModal). */
  function renderCamadaOutlook() {
    var btn = document.getElementById('camadaOut');
    var txt = document.getElementById('camadaOutTxt');
    var mais = document.getElementById('outConta');
    var erro = document.getElementById('outErro');
    if (!btn) return;
    var est = GiocoOutlook.estado();
    var ligado = est === 'ligado';
    btn.hidden = false;
    btn.disabled = false;
    mais.hidden = !ligado;
    erro.hidden = true;

    /* 'webview': a Microsoft bloqueia o login dentro de browsers embutidos.
       Não se tenta nada — diz-se o que fazer, e o detalhe abre no painel. */
    if (est === 'webview') {
      btn.classList.add('ligar');
      btn.removeAttribute('aria-pressed');
      btn.disabled = true;
      btn.title = 'Abre a página no Safari para ligares o Outlook';
      txt.textContent = 'Abre no Safari';
      erro.hidden = false;
      erro.textContent = 'Porquê?';
      return;
    }
    if (est === 'indisponivel') {
      btn.hidden = true;
      erro.hidden = false;
      erro.textContent = 'Outlook indisponível';
      return;
    }
    /* 'a-verificar': o handleRedirectPromise ainda não assentou. NUNCA dizer
       aqui que não há sessão — era isso que, no regresso do redirect, punha o
       botão a pedir login por cima de um login que tinha corrido bem. */
    if (est === 'a-verificar') {
      btn.classList.add('ligar');
      btn.removeAttribute('aria-pressed');
      btn.disabled = true;
      btn.title = 'A verificar a sessão da Microsoft…';
      txt.textContent = 'A verificar…';
      return;
    }
    if (est === 'desligado') {
      btn.classList.add('ligar');
      btn.removeAttribute('aria-pressed');
      btn.title = 'Ligar a conta Microsoft para ver o calendário do Outlook';
      txt.textContent = 'Ligar Outlook';
    } else {
      btn.classList.remove('ligar');
      btn.setAttribute('aria-pressed', camadaOut ? 'true' : 'false');
      btn.title = 'Mostrar ou esconder o calendário do Outlook (só leitura)';
      txt.textContent = 'Outlook';
    }
    // Erro (login ou Graph): discreto e clicável; nunca bloqueia o render.
    if (outErro) {
      erro.hidden = false;
      erro.textContent = outErroObj && outErroObj.__login ? 'Login falhou' : 'Outlook sem resposta';
    }
  }

  /* chipDe(item): o único sítio onde um chip sabe de que fonte vem. */
  function chipDe(ev) {
    if (ehPagamento(ev)) {
      var pago = ev.extra.estado === 'pago';
      var titulo = ev.titulo + ' · ' + formatEuro(ev.extra.valor);
      return '<button type="button" class="ev-chip pag' + (pago ? ' pago' : '') + '" data-id="' + escapeHtml(ev.id) + '" title="' + escapeHtml(titulo) + '">' +
        (pago ? '✓ ' : '') + escapeHtml(ev.titulo) + ' ·<span class="num">' + escapeHtml(formatEuro(ev.extra.valor)) + '</span></button>';
    }
    var c = paleta(ev);
    var hora = ev.diaInteiro || !ev.horaInicio ? '' : '<span class="num">' + ev.horaInicio + '</span>';
    var dica = ev.titulo + (temReuniao(ev) ? ' · ' + ev.extra.reuniao.servico : '');
    return '<button type="button" class="ev-chip' + c.classe + '" data-id="' + escapeHtml(ev.id) + '" style="background:' + c.cor + ';color:' + c.texto + '" title="' + escapeHtml(dica) + '">' +
      hora + iconeLigacao(ev) + iconeReuniao(ev) + escapeHtml(ev.titulo) + '</button>';
  }
  var chipHtml = chipDe;
  // Evento ligado a um pedido da loja: ícone store (14px) antes do título, sem categoria nova.
  function ehPedidoLoja(ev) { return !!(ev && ev.ligacao && ev.ligacao.tipo === 'lojaPedido'); }
  function iconeLigacao(ev) { return ehPedidoLoja(ev) ? '<svg class="icon" width="14" height="14"><use href="#i-store"/></svg>' : ''; }
  /* Evento do Outlook com link de videochamada (extra.reuniao, detectado no
     gioco-outlook.js): ícone i-video pela mesma porta do i-store — 14px inline,
     já com CSS em `.ev-chip .icon, .ev-bloco .icon, .dia-item-t .icon`. Não
     empurra o texto: o chip trunca com ellipsis, como sempre. */
  function temReuniao(ev) { return !!(ev && ev.extra && ev.extra.reuniao && ev.extra.reuniao.url); }
  function iconeReuniao(ev) {
    if (!temReuniao(ev)) return '';
    return '<svg class="icon" width="14" height="14"><use href="#i-video"/></svg>';
  }

  function renderMes() {
    var ref = estado.dataRef, hoje = hojeISO(), mes = mesDe(ref);
    var dias = monthGrid(parseInt(anoDe(ref), 10), mes);
    // A seleção sobrevive à mudança de mês só enquanto o dia continuar na grelha.
    if (estado.diaSelecionado && dias.indexOf(estado.diaSelecionado) < 0) estado.diaSelecionado = null;
    var sel = estado.diaSelecionado;
    var html = '<div class="mes-layout"><div class="mes-grelha-wrap"><div class="mes-cab">';
    DIAS_CURTOS.forEach(function (d) { html += '<div>' + d + '</div>'; });
    html += '</div><div class="mes-grelha">';
    dias.forEach(function (iso, i) {
      var cls = 'mes-cel';
      if (i % 7 >= 5) cls += ' fds';
      if (mesDe(iso) !== mes) cls += ' fora';
      if (iso === hoje) cls += ' hoje';
      if (iso === sel) cls += ' sel';
      var evs = eventosDoDia(iso);
      html += '<div class="' + cls + '" data-dia="' + iso + '">';
      html += '<span class="mes-num num" data-dia-num="' + iso + '">' + diaDe(iso) + '</span>';
      var visiveis = evs.length > MAX_CHIPS_MES ? MAX_CHIPS_MES - 1 : evs.length;
      for (var k = 0; k < visiveis; k++) html += chipHtml(evs[k]);
      if (evs.length > visiveis) html += '<button type="button" class="mes-mais" data-mais="' + iso + '">+' + (evs.length - visiveis) + ' mais</button>';
      html += '</div>';
    });
    html += '</div></div>';
    if (sel) html += renderPainelDia(sel, { fechar: true, abrirDia: true });
    html += '</div>';
    vistaEl.innerHTML = html;
  }
  function selecionarDia(iso) { estado.diaSelecionado = iso; render(); }
  function fecharPainelDia() { if (estado.diaSelecionado) { estado.diaSelecionado = null; render(); } }

  /* Colunas por clusters de sobreposição: eventos que se tocam no tempo
     partilham a largura em partes iguais. */
  function layoutColunas(evs) {
    var itens = evs.filter(function (e) { return !e.diaInteiro && e.horaInicio; }).map(function (e) {
      var ini = minutos(e.horaInicio);
      var fim = e.horaFim ? minutos(e.horaFim) : ini + 60;
      if (fim <= ini) fim = ini + 60;
      return { ev: e, ini: ini, fim: fim, col: 0, ncols: 1 };
    }).sort(function (a, b) { return a.ini - b.ini || a.fim - b.fim; });
    var cluster = [], clusterFim = -1, fimCols = [];
    function fecharCluster() {
      var n = fimCols.length || 1;
      cluster.forEach(function (it) { it.ncols = n; });
      cluster = []; fimCols = []; clusterFim = -1;
    }
    itens.forEach(function (it) {
      if (cluster.length && it.ini >= clusterFim) fecharCluster();
      var col = -1;
      for (var c = 0; c < fimCols.length; c++) if (fimCols[c] <= it.ini) { col = c; break; }
      if (col < 0) { col = fimCols.length; fimCols.push(0); }
      fimCols[col] = it.fim;
      it.col = col;
      cluster.push(it);
      clusterFim = Math.max(clusterFim, it.fim);
    });
    fecharCluster();
    return itens;
  }

  /* blocoDe(item): bloco na grelha horária (só itens com hora; os pagamentos são de dia inteiro). */
  function blocoDe(it) {
    var c = paleta(it.ev);
    var base = HORA_INICIO_GRELHA * 60;
    var top = Math.max(0, (it.ini - base) / 60 * PX_HORA);
    var altura = Math.max(24, (it.fim - Math.max(it.ini, base)) / 60 * PX_HORA);
    if (it.ini < base) altura = Math.max(24, (it.fim - base) / 60 * PX_HORA);
    if (top + altura > ALTURA_GRELHA) altura = Math.max(24, ALTURA_GRELHA - top);
    var largura = 100 / it.ncols, left = largura * it.col;
    var horas = it.ev.horaInicio + (it.ev.horaFim ? '–' + it.ev.horaFim : '');
    return '<button type="button" class="ev-bloco' + c.classe + '" data-id="' + escapeHtml(it.ev.id) + '" style="top:' + top + 'px;height:' + altura + 'px;left:calc(' + left + '% + 2px);width:calc(' + largura + '% - 4px);background:' + c.cor + ';color:' + c.texto + '" title="' + escapeHtml(it.ev.titulo) + '">' +
      '<b>' + iconeLigacao(it.ev) + iconeReuniao(it.ev) + escapeHtml(it.ev.titulo) + '</b><span class="num">' + horas + '</span></button>';
  }

  function horaColHtml() {
    var html = '<div class="hora-col">';
    for (var h = HORA_INICIO_GRELHA; h <= HORA_FIM_GRELHA; h++) {
      html += '<div class="hora-lbl num" style="top:' + ((h - HORA_INICIO_GRELHA) * PX_HORA) + 'px">' + pad2(h) + ':00</div>';
    }
    return html + '</div>';
  }

  function diaColHtml(iso, fds) {
    var html = '<div class="dia-col' + (fds ? ' fds' : '') + '" data-dia="' + iso + '">';
    for (var h = HORA_INICIO_GRELHA; h < HORA_FIM_GRELHA; h++) {
      html += '<div class="hora-cel" data-hora="' + pad2(h) + ':00" style="top:' + ((h - HORA_INICIO_GRELHA) * PX_HORA) + 'px"></div>';
    }
    layoutColunas(eventosDoDia(iso)).forEach(function (it) { html += blocoDe(it); });
    return html + '</div>';
  }

  function grelhaHorariaHtml(dias) {
    var hoje = hojeISO();
    var html = '<div class="sem-cab" style="--ncols:' + dias.length + '"><div></div>';
    dias.forEach(function (iso) {
      html += '<div class="sem-dia' + (iso === hoje ? ' hoje' : '') + '">' + diaSemanaCurto(iso) + ' <b class="num">' + diaDe(iso) + '</b></div>';
    });
    html += '</div><div class="sem-inteiro" style="--ncols:' + dias.length + '"><div class="sem-lbl">dia inteiro</div>';
    dias.forEach(function (iso) {
      html += '<div class="sem-di-col" data-dia-inteiro="' + iso + '">';
      eventosDoDia(iso).forEach(function (ev) { if (ev.diaInteiro) html += chipHtml(ev); });
      html += '</div>';
    });
    html += '</div><div class="sem-scroll" id="semScroll"><div class="sem-grelha" style="--ncols:' + dias.length + '">' + horaColHtml();
    dias.forEach(function (iso, i) { html += diaColHtml(iso, dias.length === 7 && i >= 5); });
    return html + '</div></div>';
  }

  function scrollInicial(dias) {
    var chave = estado.vista + '|' + estado.dataRef;
    var sc = document.getElementById('semScroll');
    if (!sc) return;
    if (chave === ultimoScrollChave) { sc.scrollTop = ultimoScrollTop; return; }
    ultimoScrollChave = chave;
    var alvo = 8 * 60;
    dias.forEach(function (iso) {
      eventosDoDia(iso).forEach(function (ev) { if (!ev.diaInteiro && ev.horaInicio) alvo = Math.min(alvo, minutos(ev.horaInicio)); });
    });
    sc.scrollTop = Math.max(0, (alvo - HORA_INICIO_GRELHA * 60) / 60 * PX_HORA);
    ultimoScrollTop = sc.scrollTop;
  }
  var ultimoScrollTop = 0;

  function renderGrelhaHoraria(dias) {
    vistaEl.innerHTML = grelhaHorariaHtml(dias);
    scrollInicial(dias);
    ligarScroll();
  }
  function ligarScroll() {
    var sc = document.getElementById('semScroll');
    if (sc) sc.addEventListener('scroll', function () { ultimoScrollTop = sc.scrollTop; });
  }

  function seccaoPagamentosHtml(pags) {
    if (!pags.length) return '';
    var pendente = 0, h = '<div class="dia-sec">Pagamentos</div>';
    pags.forEach(function (ev) {
      var pago = ev.extra.estado === 'pago';
      if (!pago) pendente += ev.extra.valor;
      h += '<button type="button" class="dia-pag' + (pago ? ' pago' : '') + '" data-id="' + escapeHtml(ev.id) + '"><i></i>' +
        '<span class="dia-pag-t">' + escapeHtml(ev.titulo) + '</span>' +
        '<span class="dia-pag-v num">' + escapeHtml(formatEuro(ev.extra.valor)) + '</span>' +
        '<span class="status ' + (pago ? 'ok' : 'warn') + '">' + (pago ? 'Pago' : 'Pendente') + '</span></button>';
    });
    h += '<div class="dia-pag-total"><span>Pendente no dia</span><b class="num">' + escapeHtml(formatEuro(pendente)) + '</b></div>';
    return h;
  }

  /* Painel "Neste dia" — o mesmo nas vistas Mês (lateral, com ×) e Dia.
     opts.fechar → botão × (só faz sentido no Mês); opts.abrirDia → link para a vista Dia. */
  function tituloDia(iso) { return diaSemanaLongo(iso) + ', ' + diaDe(iso) + ' ' + mesCurto(iso); }
  function renderPainelDia(iso, opts) {
    opts = opts || {};
    var todos = eventosDoDia(iso);
    var evs = todos.filter(function (ev) { return !ehPagamento(ev); });
    var pags = todos.filter(ehPagamento);
    var lista = '';
    if (!evs.length) {
      lista = '<p class="dia-vazio">Sem eventos neste dia.</p>';
    } else {
      evs.forEach(function (ev) {
        var c = paleta(ev);
        var horas = ev.diaInteiro ? 'Dia inteiro' : (ev.horaInicio || '') + (ev.horaFim ? '–' + ev.horaFim : '');
        lista += '<button type="button" class="dia-item" data-id="' + escapeHtml(ev.id) + '"><i style="background:' + c.cor + '"></i><div style="min-width:0;flex:1">' +
          '<div class="dia-item-t">' + iconeLigacao(ev) + iconeReuniao(ev) + escapeHtml(ev.titulo) + '</div>' +
          '<div class="dia-item-h num">' + escapeHtml(horas) + ' · ' + c.label + '</div>' +
          (ev.notas ? '<div class="dia-item-n">' + escapeHtml(ev.notas) + '</div>' : '') +
          '</div></button>';
      });
    }
    var cab = '<div class="dia-painel-cab"><h3>' + escapeHtml(tituloDia(iso)) + '</h3>' +
      (opts.fechar ? '<button type="button" class="icon-btn" data-acao="fechar" title="Fechar (Esc)" aria-label="Fechar"><svg class="icon" width="14" height="14"><use href="#i-x"/></svg></button>' : '') +
      '</div>';
    var rodape = '<div class="dia-rodape">' +
      '<button type="button" class="btn-add" data-acao="novo" data-dia="' + iso + '"><svg class="icon" width="14" height="14"><use href="#i-plus"/></svg> Novo evento</button>' +
      (opts.abrirDia ? '<button type="button" class="dia-abrir" data-acao="abrir-dia" data-dia="' + iso + '">Abrir vista Dia →</button>' : '') +
      '</div>';
    return '<div class="panel glass-light dia-painel"' + (opts.abrirDia ? ' data-abrir-dia="' + iso + '" title="Abrir vista Dia"' : '') + '>' + cab + lista + seccaoPagamentosHtml(pags) + rodape + '</div>';
  }

  // Novo evento a partir do painel: se for hoje, começa na próxima hora cheia.
  function novoNoDia(iso) {
    var pre = { data: iso };
    if (iso === hojeISO()) {
      var h = Math.min(23, new Date().getHours() + 1);
      pre.horaInicio = pad2(h) + ':00';
    }
    abrirNovo(pre);
  }

  function renderDia() {
    var iso = estado.dataRef;
    vistaEl.innerHTML = '<div class="dia-layout"><div class="dia-grelha">' + grelhaHorariaHtml([iso]) + '</div>' +
      renderPainelDia(iso, {}) + '</div>';
    scrollInicial([iso]);
    ligarScroll();
  }

  /* ---------- Legenda ---------- */
  document.getElementById('calLegenda').innerHTML = CATEGORIAS.map(function (c) {
    return '<span><i style="background:' + c.cor + '"></i>' + c.label + '</span>';
  }).join('') + '<span><i style="background:var(--blush)"></i>Pagamentos (Tesouraria, só leitura)</span>' +
    '<span><i style="background:var(--out-bg)"></i>Outlook (só leitura)</span>';

  /* ---------- Interação nas vistas ---------- */
  vistaEl.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-id]');
    if (chip) {
      e.stopPropagation();
      // Ramifica por ORIGEM (e não por !editavel): a próxima camada só de
      // leitura acrescenta um ramo aqui, sem mexer nas outras.
      var item = itensPorId[chip.getAttribute('data-id')];
      var org = item ? item.origem : 'manual';
      if (org === 'pagamentos') abrirDetalhePagamento(item);
      else if (org === 'outlook') abrirDetalheOutlook(item);
      else abrirEditar(chip.getAttribute('data-id'));
      return;
    }
    var acao = e.target.closest('[data-acao]');
    if (acao) {
      e.stopPropagation();
      var a = acao.getAttribute('data-acao'), d = acao.getAttribute('data-dia');
      if (a === 'fechar') fecharPainelDia();
      else if (a === 'novo') novoNoDia(d);
      else if (a === 'abrir-dia') { estado.dataRef = d; setVista('dia'); render(); }
      return;
    }
    // Zona livre do painel (fora de chips, botões e ×): abre a vista Dia.
    var painel = e.target.closest('.dia-painel[data-abrir-dia]');
    if (painel) { e.stopPropagation(); estado.dataRef = painel.getAttribute('data-abrir-dia'); setVista('dia'); render(); return; }
    // "+N mais" seleciona o dia e abre o painel lateral.
    var mais = e.target.closest('[data-mais]');
    if (mais) { e.stopPropagation(); selecionarDia(mais.getAttribute('data-mais')); return; }
    var cel = e.target.closest('.hora-cel');
    if (cel) {
      var col = cel.closest('.dia-col');
      abrirNovo({ data: col.getAttribute('data-dia'), horaInicio: cel.getAttribute('data-hora') });
      return;
    }
    var di = e.target.closest('[data-dia-inteiro]');
    if (di) { abrirNovo({ data: di.getAttribute('data-dia-inteiro'), diaInteiro: true }); return; }
    // Clique vazio na célula (ou no número) seleciona o dia; clicar no já
    // selecionado não fecha. Criar evento passa a ser pelo painel ou pelo N.
    var mesCel = e.target.closest('.mes-cel');
    if (mesCel) { selecionarDia(mesCel.getAttribute('data-dia')); }
  });
  vistaEl.addEventListener('dblclick', function (e) {
    var num = e.target.closest('[data-dia-num]');
    if (num) { e.stopPropagation(); estado.dataRef = num.getAttribute('data-dia-num'); setVista('dia'); render(); }
  });

  document.getElementById('btnAnterior').addEventListener('click', function () { navegar(-1); });
  document.getElementById('btnSeguinte').addEventListener('click', function () { navegar(1); });
  document.getElementById('btnHoje').addEventListener('click', function () { setDataRef(hojeISO()); });
  document.getElementById('btnNovo').addEventListener('click', function () { abrirNovo({ data: estado.dataRef }); });
  document.getElementById('camadaPag').addEventListener('click', function () { setCamadaPag(!camadaPag); });
  document.getElementById('outConta').addEventListener('click', abrirContaOutlook);
  document.getElementById('outErro').addEventListener('click', abrirDiagnosticoOutlook);
  document.getElementById('camadaOut').addEventListener('click', function () {
    var est = GiocoOutlook.estado();
    // 'a-verificar', 'webview' e 'indisponivel' não fazem nada: o botão está
    // desactivado nesses estados e o detalhe abre pelo link ao lado.
    if (est !== 'ligado' && est !== 'desligado') return;
    if (est === 'ligado') { setCamadaOut(!camadaOut); return; }
    // Sem sessão: o botão é "Ligar Outlook". Um erro aqui fica na barra e
    // não mexe em mais nada do calendário.
    var btn = this, txt = document.getElementById('camadaOutTxt');
    btn.disabled = true; txt.textContent = 'A ligar…';
    GiocoOutlook.ligar().then(function (c) {
      btn.disabled = false;
      if (c) setCamadaOut(true);   // ligou agora: mostra logo a camada
      else render();               // caiu para redirect: a página vai embora
    })['catch'](function (e) {
      console.error('[outlook] login:', e);
      btn.disabled = false;
      // Guarda-se o objecto INTEIRO: o errorMessage do MSAL é o que diz mesmo
      // o que se passou, e antes era deitado fora em favor do errorCode.
      if (e) { try { e.__login = true; } catch (err) {} }
      outErroObj = e || null;
      GiocoOutlook.guardarErro(e);
      outErro = (e && (e.errorMessage || e.message)) ? String(e.errorMessage || e.message) : 'Falha no login.';
      render();
    });
  });
  document.getElementById('segVista').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vista]');
    if (b) setVista(b.getAttribute('data-vista'));
  });

  document.addEventListener('keydown', function (e) {
    if (window.giocoModal && giocoModal.isOpen()) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'Escape') { if (estado.vista === 'mes' && estado.diaSelecionado) { e.preventDefault(); fecharPainelDia(); } }
    else if (k === 'ArrowLeft') { e.preventDefault(); navegar(-1); }
    else if (k === 'ArrowRight') { e.preventDefault(); navegar(1); }
    else if (k === 't' || k === 'T') { e.preventDefault(); setDataRef(hojeISO()); }
    else if (k === 'm' || k === 'M') { e.preventDefault(); setVista('mes'); }
    else if (k === 's' || k === 'S') { e.preventDefault(); setVista('semana'); }
    else if (k === 'd' || k === 'D') { e.preventDefault(); setVista('dia'); }
    // preventDefault: sem isto o "n" era escrito no título acabado de focar.
    // Com um dia selecionado na vista Mês, o N cria nesse dia.
    else if (k === 'n' || k === 'N') { e.preventDefault(); abrirNovo({ data: (estado.vista === 'mes' && estado.diaSelecionado) || estado.dataRef }); }
  });

  /* ---------- Detalhe só de leitura de um pagamento (fonte 'pagamentos') ---------- */
  function abrirDetalhePagamento(item) {
    var x = item.extra || {};
    var pago = x.estado === 'pago';
    var corpo = el('div', { 'class': 'pag-detalhe' });
    corpo.appendChild(el('p', { 'class': 'pag-titulo', text: item.titulo }));
    corpo.appendChild(el('p', { 'class': 'pag-valor num', text: formatEuro(x.valor) }));
    function kv(k, v) { corpo.appendChild(el('div', { 'class': 'pag-kv' }, [el('span', { text: k }), v])); }
    kv('Estado', el('span', { 'class': 'status ' + (pago ? 'ok' : 'warn'), text: pago ? 'Pago' : 'Pendente' }));
    kv('Tipo', el('span', { text: x.tipo === 'pedido' ? item.notas.split(' · ')[0] : 'Compromisso fixo' }));
    kv('Data', el('span', { 'class': 'num', text: diaSemanaLongo(item.data) + ', ' + diaDe(item.data) + ' ' + mesCurto(item.data) + ' ' + anoDe(item.data) }));
    if (item.notas) kv('Notas', el('span', { 'class': 'pag-notas', text: item.notas }));
    var href = 'tesouraria.html?dia=' + encodeURIComponent(item.data) + '&chave=' + encodeURIComponent(x.chaveTesouraria || '');
    var abrir = el('a', { 'class': 'btn-add', href: href, text: 'Abrir na Tesouraria' });
    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, [fechar, abrir])]));
    giocoModal.open({ titulo: 'Pagamento', conteudo: corpo });
  }

  /* ---------- Detalhe só de leitura de um evento do Outlook ----------
     Mesmo padrão do detalhe dos pagamentos (.pag-detalhe + .ev-actions).
     NUNCA abre o formulário de edição: a fonte é o Outlook, e o OS não
     escreve lá nem copia o evento para o nó eventos/. */
  function abrirDetalheOutlook(item) {
    var x = item.extra || {};
    var corpo = el('div', { 'class': 'pag-detalhe out-detalhe' });
    corpo.appendChild(el('p', { 'class': 'pag-titulo', text: item.titulo }));
    function kv(k, v) { corpo.appendChild(el('div', { 'class': 'pag-kv' }, [el('span', { text: k }), v])); }
    var dia = diaSemanaLongo(item.data) + ', ' + diaDe(item.data) + ' ' + mesCurto(item.data) + ' ' + anoDe(item.data);
    var horas = item.diaInteiro ? 'Dia inteiro' : (item.horaInicio || '') + (item.horaFim ? '–' + item.horaFim : '');
    kv('Quando', el('span', { 'class': 'num', text: dia + ' · ' + horas }));
    /* O campo Local quando é SÓ o URL da reunião não se mostra: fica
       redundante ao lado do botão "Entrar na reunião". Com texto à volta
       ("Sala 2 · https://…"), mostra-se o texto como sempre. */
    var localSoLink = !!(x.reuniao && String(x.local || '').trim() === x.reuniao.url);
    if (x.local && !localSoLink) kv('Local', el('span', { text: x.local }));
    if (x.reuniao) kv('Videochamada', el('span', { text: x.reuniao.servico }));
    if (x.organizador) kv('Organizador', el('span', { text: x.organizador }));
    kv('Origem', el('span', { text: 'Outlook · só leitura' }));

    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    /* Ordem visual: [Fechar] [Entrar na reunião] [Abrir no Outlook].
       Com link de reunião, a acção provável é ENTRAR, não ir ver o convite:
       o "Entrar" fica com o .btn-add cheio e o "Abrir no Outlook" desce a
       .ev-btn-outline, para não haver dois botões vermelhos indistintos. Sem
       reunião, o "Abrir no Outlook" continua a ser o primário, como sempre. */
    var direita = [fechar];
    if (x.reuniao) {
      direita.push(el('a', {
        'class': 'btn-add', href: x.reuniao.url, target: '_blank', rel: 'noopener noreferrer',
        title: 'Abrir ' + x.reuniao.servico + ' em nova janela', text: 'Entrar na reunião'
      }));
    }
    if (x.webLink) {
      direita.push(el('a', {
        'class': x.reuniao ? 'ev-btn-outline' : 'btn-add',
        href: x.webLink, target: '_blank', rel: 'noopener noreferrer', text: 'Abrir no Outlook'
      }));
    }
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, direita)]));
    giocoModal.open({ titulo: 'Evento do Outlook', conteudo: corpo });
  }

  /* Painel de diagnóstico do Outlook (giocoModal).
     Existe porque o telemóvel não tem consola nem hover: sem isto, um login
     falhado em iOS mostrava três palavras e mais nada. Mostra o errorCode E o
     errorMessage completos, o redirectUri resolvido em runtime (a causa número
     um de redirect_uri_mismatch), o ambiente detectado e o user agent. */
  function textoDiagnostico() {
    var d = GiocoOutlook.diagnostico();
    var e = outErroObj || {};
    var linhas = [
      'GIOCO OS · diagnóstico do Outlook',
      new Date().toISOString(),
      '',
      'errorCode:    ' + (e.errorCode || d.errorCode || '—'),
      'errorMessage: ' + (e.errorMessage || e.message || d.errorMessage || '—'),
      'subError:     ' + (e.subError || d.subError || '—'),
      'correlationId:' + (e.correlationId || d.correlationId || '—'),
      '',
      'estado:       ' + d.estado,
      'redirectUri:  ' + d.redirectUri,
      'href:         ' + window.location.href,
      'ambiente:     ios=' + d.ambiente.ios + ' webview=' + d.ambiente.webview +
        (d.ambiente.motivo ? ' (' + d.ambiente.motivo + ')' : ''),
      'MSAL:         ' + d.sdk,
      'redirect deu sessão: ' + d.redirectTrouxeSessao,
      '',
      'userAgent:',
      d.ua
    ];
    if (e.stack) linhas.push('', 'stack:', String(e.stack));
    return linhas.join('\n');
  }

  function abrirDiagnosticoOutlook() {
    var texto = textoDiagnostico();
    var corpo = el('div', { 'class': 'diag' });
    var est = GiocoOutlook.estado();
    if (est === 'webview') {
      corpo.appendChild(el('p', { text: 'Estás a ver esta página dentro de um browser embutido numa app. ' +
        'A Microsoft bloqueia o login nestes browsers, por isso nem se tenta. ' +
        'Abre a página no Safari (menu ··· → "Abrir no Safari") e liga aí a conta — ' +
        'a sessão fica guardada e o resto do calendário funciona na mesma aqui.' }));
    } else {
      corpo.appendChild(el('p', { text: 'Detalhe técnico do último erro. Copia e envia isto se for preciso perceber o que falhou.' }));
    }
    corpo.appendChild(el('pre', { text: texto }));

    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    var copiar = el('button', { type: 'button', 'class': 'btn-add', text: 'Copiar' });
    copiar.addEventListener('click', function () {
      function feito() { copiar.textContent = 'Copiado ✓'; setTimeout(function () { copiar.textContent = 'Copiar'; }, 2000); }
      function falhou() {
        // Sem clipboard (contexto não seguro, permissão negada): seleciona o
        // texto para o utilizador copiar à mão, que em iOS é um toque longo.
        copiar.textContent = 'Seleciona e copia';
        var pre = corpo.querySelector('pre');
        try {
          var r = document.createRange(); r.selectNodeContents(pre);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        } catch (err) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(feito, falhou);
      } else { falhou(); }
    });
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, [fechar, copiar])]));
    giocoModal.open({ titulo: est === 'webview' ? 'Abre no Safari' : 'Diagnóstico do Outlook', conteudo: corpo });
  }

  /* Painel da conta Microsoft: quem está ligado e o botão de desligar.
     Desligar é LOCAL — limpa a cache do MSAL neste browser e não manda o
     Manel para a página de logout da Microsoft (ver gioco-outlook.js). */
  function abrirContaOutlook() {
    var c = GiocoOutlook.conta() || { email: '', nome: '' };
    var corpo = el('div', { 'class': 'out-conta' });
    corpo.appendChild(el('p', { 'class': 'out-email', text: c.email || c.nome || 'Conta ligada' }));
    corpo.appendChild(el('p', { text: 'O calendário é lido em Calendars.Read. O GIOCO OS nunca escreve no Outlook nem copia estes eventos para a agenda do OS.' }));
    var desligar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Desligar conta' });
    var fechar = el('button', { type: 'button', 'class': 'ev-btn-outline', text: 'Fechar' });
    fechar.addEventListener('click', function () { giocoModal.close(); });
    desligar.addEventListener('click', function () {
      desligar.disabled = true; desligar.textContent = 'A desligar…';
      GiocoOutlook.desligar().then(function () {
        outEventos = []; outCache = {}; outIntervalo = null; outErro = '';
        setCamadaOut(false);
        giocoModal.close();
      });
    });
    corpo.appendChild(el('div', { 'class': 'ev-actions' }, [el('div', { 'class': 'ev-actions-right' }, [fechar, desligar])]));
    giocoModal.open({ titulo: 'Conta Microsoft', conteudo: corpo });
  }

  /* ---------- Modais de evento (gioco-eventos.js) ----------
     Formulário, validação, atalhos (Enter / Ctrl+Enter) e escritas vivem no
     motor. A página só decide a data por omissão e o bloco "Pedido da loja". */
  function abrirNovo(pre) {
    pre = pre || {};
    EV.abrirNovo({ data: pre.data || estado.dataRef, diaInteiro: pre.diaInteiro, horaInicio: pre.horaInicio });
  }

  function abrirEditar(id) {
    var bruto = eventosPorId[id];
    if (!bruto) return;
    EV.abrirEditar(id, bruto, { antes: blocoPedidoLoja(bruto) });
  }

  // Bloco só de leitura por cima do formulário quando o evento nasceu de um
  // pedido da loja (ligacao.tipo 'lojaPedido'). Lê lojaPedidos/{id} com um
  // once('value') ao abrir — só leitura; se o pedido já não existir, diz.
  function blocoPedidoLoja(bruto) {
    var lig = bruto && bruto.ligacao;
    if (!lig || lig.tipo !== 'lojaPedido' || !lig.id) return null;
    var corpo = el('div', { 'class': 'ev-ligacao' }, [
      el('div', { 'class': 'ev-ligacao-t', html: '<svg class="icon" width="14" height="14"><use href="#i-store"/></svg><span>Pedido da loja</span>' }),
      el('p', { text: 'A carregar…' })
    ]);
    db.ref('lojaPedidos').child(String(lig.id)).once('value').then(function (snap) {
      var p = snap.val();
      var texto = corpo.querySelector('p');
      if (!p) { texto.textContent = 'Pedido apagado na loja'; }
      else {
        var desc = String(p.descricao || '').replace(/\s+/g, ' ').trim();
        if (desc.length > 200) desc = desc.slice(0, 200).trim() + '…';
        texto.textContent = desc;
        var meta = [p.pessoa, p.zona && p.zona !== '—' ? p.zona : ''].filter(Boolean).join(' · ');
        if (meta) corpo.insertBefore(el('p', { text: meta }), texto.nextSibling);
      }
      corpo.appendChild(el('a', { href: 'mrn-dashboard.html#cardPedidos', text: 'Ver no dashboard →' }));
    }).catch(function (err) {
      corpo.querySelector('p').textContent = 'Não foi possível ler o pedido.';
      console.error(err);
    });
    return corpo;
  }

  /* ---------- Deep-link (mesmo padrão da tesouraria.html) ----------
     ?dia=AAAA-MM-DD → vista Mês nesse mês com o painel do dia aberto;
     ?evento=ID → abre o modal de edição no primeiro snapshot de eventos/ em
     que o id existe e não está anulado (uma só vez; inválido ou anulado é
     ignorado). Sem parâmetros nada muda. Só leitura. */
  var deepEvento = null;
  (function () {
    try {
      var qs = new URLSearchParams(window.location.search);
      var dia = qs.get('dia');
      if (dia && isoValida(dia)) {
        estado.vista = 'mes';
        estado.dataRef = dia;
        estado.diaSelecionado = dia;
      }
      var ev = qs.get('evento');
      if (ev && /^[A-Za-z0-9_-]+$/.test(ev)) deepEvento = ev;
    } catch (e) { /* URL estranho: comportamento por omissão */ }
  })();

  /* ---------- Ligação ao Firebase (só atualiza estado e chama render) ---------- */
  eventosRef.on('value', function (snapshot) {
    var val = snapshot.val() || {};
    eventosPorId = val;
    var lista = [];
    Object.keys(val).forEach(function (id) {
      var ev = normalizarManual(id, val[id]);
      if (ev) lista.push(ev);
    });
    estado.eventos = lista;   // fonte 'manual'; outras fontes juntam-se aqui
    estado.carregado = true;
    indexarEventos();
    render();
    if (deepEvento && val[deepEvento]) {
      var alvo = deepEvento; deepEvento = null;
      if (val[alvo].anulado !== true) abrirEditar(alvo);
    }
  });

  // Os cinco nós da fonte 'pagamentos' — só leitura. Um flag por nó; até
  // chegarem todos a página funciona só com eventos.
  paymentRequestsRef.on('value', function (s) { allPaymentRequests = s.val() || {}; carregado.payreq = true; render(); });
  compromissosRef.on('value', function (s) { allCompromissos = s.val() || {}; carregado.comp = true; render(); });
  pagamentosConcluidosRef.on('value', function (s) { allPagamentosConcluidos = s.val() || {}; carregado.concl = true; render(); });
  recibosRef.on('value', function (s) { allRecibos = s.val() || {}; carregado.recibos = true; render(); });
  pessoasRef.on('value', function (s) { allPessoas = s.val() || {}; carregado.pessoas = true; render(); });

  /* O MSAL JÁ arrancou lá em cima, em paralelo com o Firebase (ver o bloco
     antes do autenticarEContinuar). Aqui só nos ligamos à promessa para voltar
     a desenhar quando o estado deixar de ser 'a-verificar'. */
  GiocoOutlook.pronto().then(function () { render(); }, function () { render(); });

  render();
  }); // fim de autenticarEContinuar
</script>
