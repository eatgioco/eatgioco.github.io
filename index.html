<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIOCO OS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5F2EC;
    --red:#D91124;
    --black:#141414;
    --white:#FFFFFF;
    --line:#E2DDD1;
    --muted:#6b6660;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.mono,.card-title,.tag,.field-label{
    font-family:'Space Mono', monospace;
  }

  header{
    background:var(--red);
    color:var(--white);
    padding:20px 24px;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .brand-mark{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:48px 24px;
  }

  .page-title{
    margin:0;
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .page-subtitle{
    margin:8px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
    margin-top:40px;
  }

  .card{
    display:block;
    background:var(--white);
    border:2px solid var(--black);
    padding:24px;
    text-decoration:none;
    color:var(--black);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }

  .card:hover{
    transform:translate(-2px,-2px);
    box-shadow:4px 4px 0 var(--red);
  }

  .card-icon{
    font-size:28px;
    line-height:1;
  }

  .card-title{
    margin:14px 0 4px;
    font-size:16px;
    font-weight:700;
  }

  .card-subtitle{
    margin:0;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="brand-mark"><span style="color:var(--black);">●</span> GIOCO®</span>
  </div>
</header>

<main>
  <h1 class="page-title">GIOCO OS</h1>
  <p class="page-subtitle">Directório Operacional</p>

  <div class="grid">
    <a class="card" href="fornecedores.html">
      <div class="card-icon">📋</div>
      <h3 class="card-title">Fornecedores</h3>
      <p class="card-subtitle">Base de dados e pagamentos</p>
    </a>

    <a class="card" href="contabilidade.html">
      <div class="card-icon">🧾</div>
      <h3 class="card-title">Contabilidade</h3>
      <p class="card-subtitle">Documentos e finanças</p>
    </a>

    <a class="card" href="caixa.html">
      <div class="card-icon">💶</div>
      <h3 class="card-title">Caixa</h3>
      <p class="card-subtitle">Movimentos de dinheiro</p>
    </a>
  </div>
</main>

</body>
</html>
